name: Add Rings Today feature navigation
on:
  push:
    paths:
      - '.trigger-add-today-feature-nav'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch feature navigation
        run: node scripts/add-today-feature-nav.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking.html territory.html journal.html gps-art.html
          git commit -m "Add Rings Today to feature navigation"
          git push
