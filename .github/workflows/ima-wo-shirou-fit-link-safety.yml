name: Ima wo Shirou isolated FIT link safety
on:
  pull_request:
    paths:
      - 'src/ima-wo-shirou-fit-link-review.mjs'
      - 'tests/ima-wo-shirou-fit-link-review.test.mjs'
      - 'docs/ima-wo-shirou-fit-link-safety-20261113.md'
      - '.github/workflows/ima-wo-shirou-fit-link-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no accidental calendar-FIT auto-link
        run: node --test tests/ima-wo-shirou-fit-link-review.test.mjs
