name: B-1 private gate and ledger SQL isolation
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/b1-production-private-gate-and-ledger-v01-20261030.sql'
      - 'docs/b1-private-gate-ledger-isolated.test.sql'
      - '.github/workflows/b1-private-gate-ledger-isolated.yml'
permissions:
  contents: read
jobs:
  sql-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: b1isolated
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: b1_private_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b1isolated -d b1_private_fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: b1isolated
      PGPASSWORD: synthetic-only
      PGDATABASE: b1_private_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated target
        run: |
          test "$PGHOST" = localhost
          test "$PGUSER" = b1isolated
          test "$PGDATABASE" = b1_private_fixture
      - name: Verify M1-M3 and private stop
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f docs/b1-private-gate-ledger-isolated.test.sql 2>&1 | tee b1-private-gate-ledger-isolated.log
      - name: Save synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-private-gate-ledger-isolated
          path: b1-private-gate-ledger-isolated.log
          if-no-files-found: ignore
          retention-days: 7
