name: Isolated race training suggestion tests
on:
  pull_request:
    paths:
      - 'src/race-training-suggestions.cjs'
      - 'tests/race-training-suggestions.test.cjs'
      - '.github/workflows/race-training-suggestions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated training suggestion tests
        run: node tests/race-training-suggestions.test.cjs
