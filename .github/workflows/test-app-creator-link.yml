name: App footer Instagram regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'scripts/test-app-creator-link.cjs'
      - '.github/workflows/test-app-creator-link.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-app-creator-link.cjs
