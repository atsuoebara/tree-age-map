name: Rings Atlas contract checks

on:
  pull_request:
    paths:
      - 'rings-atlas-view.js'
      - 'rings-atlas.html'
      - 'rings-atlas-prefecture-preview.js'
      - 'index.html'
      - 'tests/rings-atlas/**'
      - '.github/workflows/rings-atlas-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Atlas JavaScript syntax
        run: node --check rings-atlas-view.js
      - name: Verify Atlas relocation contract
        run: node tests/rings-atlas/atlas-relocation-contract.cjs
      - name: Verify top only shows Atlas tile, retaining region data
        run: node tests/rings-atlas/home-region-details-hidden.cjs
      - name: Verify standalone Atlas route and feature tile
        run: node tests/rings-atlas/atlas-standalone-route.cjs
      - name: Verify embedded clean shell and five-prefecture preview
        run: node tests/rings-atlas/atlas-iframe-clean-preview.cjs
      - name: Check prefab region preview syntax
        run: node --check rings-atlas-prefecture-preview.js
      - name: Exercise embedded sign-in and bfcache lifecycle
        run: node tests/rings-atlas/atlas-embedded-lifecycle.cjs
      - name: Verify map and filters stay accessible
        run: node tests/rings-atlas/atlas-map-visibility-contract.cjs
      - name: Verify Leaflet resize contract
        run: node tests/rings-atlas/atlas-leaflet-layout-contract.cjs
      - name: Exercise Atlas view lifecycle
        run: node tests/rings-atlas/atlas-view-lifecycle.cjs
      - name: Verify account and map record layout
        run: node tests/rings-atlas/home-account-record-layout.cjs
      - name: Verify feature tile navigation nearer map
        run: node tests/rings-atlas/home-feature-tile-position.cjs
      - name: Verify connection menu remains ahead of run controls on expand
        run: node tests/rings-atlas/home-connection-menu-order.cjs
      - name: Verify connection help consolidation without hiding public guide
        run: node tests/rings-atlas/home-connection-guide-placement.cjs
      - name: Verify side-by-side memories and nearby run management
        run: node tests/rings-atlas/home-run-controls-memory-pair.cjs
      - name: Check engagement layout JavaScript syntax
        run: node --check rr-engagement.js
      - name: Verify title-right account stack
        run: node tests/rings-atlas/header-account-stack.cjs
      - name: Verify logo and bilingual two-line header
        run: node tests/rings-atlas/header-brand-logo-two-lines.cjs
      - name: Check header placement syntax
        run: node --check header-account-placement.js
