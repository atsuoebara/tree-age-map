name: Garmin account deletion strategy (isolated PostgreSQL)

on:
  pull_request:
    paths:
      - "supabase/tests/garmin_race_account_deletion_cases.sql"
      - ".github/workflows/garmin-race-account-deletion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: garmin_account_delete_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d garmin_account_delete_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: garmin_account_delete_ci
      PGUSER: postgres
      PGPASSWORD: ci_only_secret
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated CI database target
        run: test "$PGDATABASE" = garmin_account_delete_ci
      - name: Exercise FK block, orphan detection and ordered erasure (ROLLBACK)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/garmin_race_account_deletion_cases.sql
