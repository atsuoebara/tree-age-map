name: Test Journal social preview egress

on:
  pull_request:
    paths:
      - 'scripts/optimize-journal-images.py'
      - 'scripts/test-journal-og-egress.py'
      - '.github/workflows/test-journal-og-egress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Check script syntax and offline regression
        run: |
          python -m py_compile scripts/optimize-journal-images.py scripts/test-journal-og-egress.py
          python -m unittest discover -s scripts -p 'test-journal-og-egress.py' -v
