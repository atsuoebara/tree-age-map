name: Race mixed-quality policy (synthetic)
on:
  pull_request:
    paths:
      - 'src/race-mixed-quality-policy-review.cjs'
      - 'tests/race-mixed-quality-policy-review.test.cjs'
      - 'docs/race-mixed-quality-policy-v01-20261112.md'
      - '.github/workflows/race-mixed-quality-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mixed-quality policies cannot certify or recommend
        run: node tests/race-mixed-quality-policy-review.test.cjs
      - name: Preserve quality gate
        run: node tests/race-elapsed-quality-gate-review.test.cjs
      - name: Preserve continuity diagnostic
        run: node tests/race-source-continuity-diagnostic.test.cjs
      - name: Preserve split bridge
        run: node tests/garmin-splits-training-bridge.test.cjs
