name: Rings Now P3 v03 isolated one-shot candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rings-now-p3-v03-isolated-manual
  cancel-in-progress: false
jobs:
  isolated-v03:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/run/rings-now-v03-20261126-1435' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Prove one-shot execution eligibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/rings-now-p3-v03-one-shot-history-cli.cjs
      - name: Offline checks and gated isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n tests/fixtures/rings-now-p3-v03-concurrent-probe.bash
          for f in tests/rings-now-p3-v03-*.cjs; do node --check "$f"; done
          node --test --test-name-pattern='activation and history reject incomplete evidence|adapter uses v03 route, database and exact fixture pins' tests/rings-now-p3-v03-wiring.test.cjs
          node tests/rings-now-p3-v03-isolated-cli.cjs --isolated-once
