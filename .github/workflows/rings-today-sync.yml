name: Sync Rings Today
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to sync (2006 or later; blank = current year)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/rings-today-sync.yml'
  schedule:
    # Current-year runs: every 5 minutes as a backup for the live trigger.
    - cron: '*/5 * * * *'
    # Historical backfill: every 15 minutes. Recent history is prioritized.
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  current:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *' }}
    concurrency:
      group: rings-today-current
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Rings Today geometry
        run: node scripts/sync-rings-today.mjs --self-test
      - name: Sync current or requested year
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_YEAR: ${{ inputs.year }}
          RINGS_TODAY_LIMIT: '100'
        run: |
          export RINGS_TODAY_YEAR="${REQUESTED_YEAR:-$(date -u +%Y)}"
          echo "Rings Today primary sync year: $RINGS_TODAY_YEAR"
          node scripts/sync-rings-today.mjs

  history:
    if: ${{ github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') }}
    concurrency:
      group: rings-today-history
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finish previous year first
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RINGS_TODAY_LIMIT: '500'
        run: |
          export RINGS_TODAY_YEAR=$((10#$(date -u +%Y) - 1))
          echo "Rings Today priority historical sync year: $RINGS_TODAY_YEAR"
          # One scheduled/push run should advance enough batches to finish the previous year.
          # Extra passes are harmless once the cursor is caught up.
          for PASS in $(seq 1 8); do
            echo "Previous-year backfill pass $PASS/8"
            node scripts/sync-rings-today.mjs
          done
      - name: Rotate older history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RINGS_TODAY_LIMIT: '250'
        run: |
          CURRENT_YEAR=$((10#$(date -u +%Y)))
          OLDEST_YEAR=2006
          NEWEST_ROTATING_YEAR=$((CURRENT_YEAR - 2))
          YEAR_COUNT=$((NEWEST_ROTATING_YEAR - OLDEST_YEAR + 1))
          if [ "$YEAR_COUNT" -le 0 ]; then exit 0; fi
          SLOT=$(( (10#$(date -u +%j) * 96 + 10#$(date -u +%H) * 4 + 10#$(date -u +%M) / 15) % YEAR_COUNT ))
          export RINGS_TODAY_YEAR=$((NEWEST_ROTATING_YEAR - SLOT))
          echo "Rings Today rotating historical sync year: $RINGS_TODAY_YEAR"
          node scripts/sync-rings-today.mjs
