name: Sync Rings Today
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to sync (2006 or later; blank = current year)'
        required: false
        type: string
  schedule:
    # Current-year runs: every 5 minutes so Rings Today feels live.
    - cron: '*/5 * * * *'
    # Historical backfill: once per hour.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: rings-today-sync
  cancel-in-progress: false

jobs:
  current:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Rings Today geometry
        run: node scripts/sync-rings-today.mjs --self-test
      - name: Sync current or requested year
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_YEAR: ${{ inputs.year }}
          RINGS_TODAY_LIMIT: '100'
        run: |
          export RINGS_TODAY_YEAR="${REQUESTED_YEAR:-$(date -u +%Y)}"
          echo "Rings Today primary sync year: $RINGS_TODAY_YEAR"
          node scripts/sync-rings-today.mjs

  history:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '17 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rotate one historical year
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RINGS_TODAY_LIMIT: '250'
        run: |
          # 2006-2025 are rotated hourly. Each year keeps its own cursor,
          # so old data gradually fills without restarting from the beginning.
          SLOT=$(( (10#$(date -u +%j) * 24 + 10#$(date -u +%H)) % 20 ))
          export RINGS_TODAY_YEAR=$((2006 + SLOT))
          echo "Rings Today historical sync year: $RINGS_TODAY_YEAR"
          node scripts/sync-rings-today.mjs
