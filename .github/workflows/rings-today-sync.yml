name: Sync Rings Today
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to sync (2026 or later; blank = current UTC year)'
        required: false
        type: string
  schedule:
    # Every hour at :17. GitHub scheduled runs can be delayed.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: rings-today-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Rings Today geometry
        run: node scripts/sync-rings-today.mjs --self-test

      - name: Sync all runs into Rings Today regions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_YEAR: ${{ inputs.year }}
        run: |
          export RINGS_TODAY_YEAR="${REQUESTED_YEAR:-$(date -u +%Y)}"
          echo "Rings Today sync year: $RINGS_TODAY_YEAR"
          node scripts/sync-rings-today.mjs
