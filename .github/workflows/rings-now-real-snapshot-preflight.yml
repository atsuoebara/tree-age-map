name: Rings Now real snapshot preflight documentation
on:
  pull_request:
    paths:
      - 'docs/rings-now-real-snapshot-preflight-v01.md'
      - 'tests/rings-now-real-snapshot-preflight.test.mjs'
      - '.github/workflows/rings-now-real-snapshot-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evidence gates and public OFF invariants
        run: node --test tests/rings-now-real-snapshot-preflight.test.mjs
