name: Ima wo Shirou isolated eight-day eligibility gate
on:
  pull_request:
    paths:
      - 'src/ima-wo-shirou-eight-day-eligibility.mjs'
      - 'tests/ima-wo-shirou-eight-day-eligibility.test.mjs'
      - 'docs/ima-wo-shirou-eight-day-gate-review-20261113.md'
      - '.github/workflows/ima-wo-shirou-eight-day-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify boundary and safety behavior
        run: node --test tests/ima-wo-shirou-eight-day-eligibility.test.mjs
      - name: Preserve existing calendar tests
        run: node scripts/test-run-record-calendar.cjs
