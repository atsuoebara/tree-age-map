name: Rings Now single statement SQL candidate review
on:
  pull_request:
    paths:
      - 'docs/rings-now-single-statement-snapshot-CANDIDATE.sql'
      - 'docs/rings-now-single-statement-snapshot-review-20261114.md'
      - 'tests/rings-now-single-statement-candidate.test.mjs'
      - '.github/workflows/rings-now-single-statement-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated candidate boundaries
        run: node --test tests/rings-now-single-statement-candidate.test.mjs
