name: Rings Now owner calendar input contract
on:
  pull_request:
    paths:
      - 'src/rings-now-calendar-owner-input-contract.mjs'
      - 'tests/rings-now-calendar-owner-input-contract.test.mjs'
      - '.github/workflows/rings-now-calendar-owner-input-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-input-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New contract and existing calendar selection
        run: |
          node --check src/rings-now-calendar-owner-input-contract.mjs
          node --test tests/rings-now-calendar-owner-input-contract.test.mjs
          node --test tests/rings-now-calendar-selection-adapter.test.mjs
