# Rings Now P2 G4 final candidate. NOT BRANCHED BEFORE EXACT-HEAD AUDIT.
# This immutable commit shall only receive a selectable branch after independent
# verification of this exact HEAD and account's preexisting $0 hard cap.
# One-shot count gate runs BEFORE any Docker command.
name: Rings Now P2 isolated stack (ONE-SHOT GATED)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rings-now-p2-isolated-manual
  cancel-in-progress: false
jobs:
  isolated-p2:
    if: ${{ true }} # only selectable AFTER exact-head independent audit; guarded pre-Docker
    runs-on: ubuntu-latest
    timeout-minutes: 12 # strict bound; Actions $0 spending limit previously confirmed
    steps:
      - name: Checkout exact dispatch SHA 
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2 # B: one parent is required to verify source binding
      - name: Prove one-shot execution eligibility 
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/rings-now-p2-one-shot-history-cli.cjs
      - name: Verify exact checkout and canonical manifest before CLI 
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tests/rings-now-p2-g4-approval-child-cli.cjs
          node -e '
            const m=require("./tests/rings-now-p2-isolated-manifest.json");
            const g=require("./tests/rings-now-p2-stack-static-gate.cjs");
            const r=g.inspectP2Preflight(m,process.env);
            if(!r.pass) {
              process.stderr.write("BLOCKED_NOT_RUN: manifest preflight failed ("+r.failures.join(",")+")\\n");
              process.exit(2);
            }
          '
      - name: Run one isolated probe; keep non-proven outcome red 
        shell: bash
        run: |
          set -euo pipefail
          # CLI emits only non-secret structured summary and ALWAYS exits 1 or 2.
          # Leave step failed; never turn CLI self-report into green PASS.
          node tests/rings-now-p2-cli.cjs --isolated-once
