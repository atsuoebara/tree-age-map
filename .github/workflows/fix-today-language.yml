name: Fix Rings Today language
on:
  push:
    paths:
      - '.trigger-fix-today-language'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-today-language.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today.html
          git commit -m "Fix Rings Today English display"
          git push
