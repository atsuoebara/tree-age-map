name: Garmin sample shape probe (isolated)

on:
  pull_request:
    paths:
      - 'src/garmin-sample-shape-probe.mjs'
      - 'src/garmin-one-shot-probe-contract.mjs'
      - 'tests/garmin-one-shot-probe-contract.test.mjs'
      - 'tests/garmin-revoke-retry-integration.test.mjs'
      - 'tests/garmin-disconnect-fence-candidate.test.mjs'
      - 'scripts/test-garmin-oauth.mjs'
      - 'tests/garmin-disconnect-midflight-reconnect.test.mjs'
      - 'src/garmin-consent-lifecycle-contract.mjs'
      - 'src/garmin-lifecycle-integration-plan.mjs'
      - 'src/race-strava-first-match-contract.mjs'
      - 'src/race-strava-stream-gate.mjs'
      - 'src/race-user-fit-only-gate.mjs'
      - 'src/race-fit-only-split-probe.mjs'
      - 'src/race-fit-sdk-isolated-adapter.mjs'
      - 'src/race-fit-clock-anomaly-review.mjs'
      - 'tests/race-fit-clock-anomaly-review.test.mjs'
      - 'tests/race-fit-sdk-isolated-adapter.test.mjs'
      - 'tests/race-fit-only-split-probe.test.mjs'
      - 'tests/race-user-fit-only-gate.test.mjs'
      - 'tests/race-strava-stream-gate.test.mjs'
      - 'tests/race-strava-first-match-contract.test.mjs'
      - 'tests/garmin-lifecycle-integration-plan.test.mjs'
      - 'tests/garmin-consent-lifecycle-contract.test.mjs'
      - 'scripts/garmin-disconnect-fence-candidate.mjs'
      - 'tests/garmin-sample-shape-probe.test.mjs'
      - 'scripts/inspect-garmin-activity-shape.mjs'
      - 'tests/inspect-garmin-activity-shape.test.mjs'
      - '.github/workflows/garmin-sample-shape-probe.yml'
  push:
    branches:
      - 'feature/garmin-race-analysis-implementation-20261109'
    paths:
      - 'src/garmin-sample-shape-probe.mjs'
      - 'src/garmin-one-shot-probe-contract.mjs'
      - 'tests/garmin-one-shot-probe-contract.test.mjs'
      - 'tests/garmin-revoke-retry-integration.test.mjs'
      - 'tests/garmin-disconnect-fence-candidate.test.mjs'
      - 'scripts/test-garmin-oauth.mjs'
      - 'tests/garmin-disconnect-midflight-reconnect.test.mjs'
      - 'src/garmin-consent-lifecycle-contract.mjs'
      - 'src/garmin-lifecycle-integration-plan.mjs'
      - 'src/race-strava-first-match-contract.mjs'
      - 'src/race-strava-stream-gate.mjs'
      - 'src/race-user-fit-only-gate.mjs'
      - 'src/race-fit-only-split-probe.mjs'
      - 'src/race-fit-sdk-isolated-adapter.mjs'
      - 'src/race-fit-clock-anomaly-review.mjs'
      - 'tests/race-fit-clock-anomaly-review.test.mjs'
      - 'tests/race-fit-sdk-isolated-adapter.test.mjs'
      - 'tests/race-fit-only-split-probe.test.mjs'
      - 'tests/race-user-fit-only-gate.test.mjs'
      - 'tests/race-strava-stream-gate.test.mjs'
      - 'tests/race-strava-first-match-contract.test.mjs'
      - 'tests/garmin-lifecycle-integration-plan.test.mjs'
      - 'tests/garmin-consent-lifecycle-contract.test.mjs'
      - 'scripts/garmin-disconnect-fence-candidate.mjs'
      - 'tests/garmin-sample-shape-probe.test.mjs'
      - 'scripts/inspect-garmin-activity-shape.mjs'
      - 'tests/inspect-garmin-activity-shape.test.mjs'
      - '.github/workflows/garmin-sample-shape-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure Garmin shape probe privacy and boundary cases
        run: node tests/garmin-sample-shape-probe.test.mjs
      - name: One-shot atomic lease contract synthetic tests
        run: node tests/garmin-one-shot-probe-contract.test.mjs
      - name: Synthetic Garmin remote revoke failure and retry against receiver source
        run: node tests/garmin-revoke-retry-integration.test.mjs
      - name: Verify current Garmin OAuth regression tests
        run: node scripts/test-garmin-oauth.mjs
      - name: Verify fenced disconnect candidate on isolated transformed OAuth source
        run: node tests/garmin-disconnect-fence-candidate.test.mjs
      - name: Verify reconnect during in-flight external Garmin revocation
        run: node tests/garmin-disconnect-midflight-reconnect.test.mjs
      - name: Verify Garmin consent and remote revoke lifecycle model
        run: node tests/garmin-consent-lifecycle-contract.test.mjs
      - name: Audit three-actor Garmin integration design contract
        run: node tests/garmin-lifecycle-integration-plan.test.mjs
      - name: Verify Strava-first canonical run matching without duplicate writes
        run: node tests/race-strava-first-match-contract.test.mjs
      - name: Verify Strava stream shape and 2026 provider policy hard gate
        run: node tests/race-strava-stream-gate.test.mjs
      - name: Verify user-provided FIT-only offline shape and provenance boundaries
        run: node tests/race-user-fit-only-gate.test.mjs
      - name: Verify synthetic FIT-only kilometre clock elapsed candidates
        run: node tests/race-fit-only-split-probe.test.mjs
      - name: Verify generated FIT binary SDK decode to isolated kilometre probe
        run: node tests/race-fit-sdk-isolated-adapter.test.mjs
      - name: Verify FIT clock anomalies and no imputed timestamps
        run: node tests/race-fit-clock-anomaly-review.test.mjs
      - name: Offline JSON shape inspector synthetic tests
        run: node tests/inspect-garmin-activity-shape.test.mjs
      - name: Ensure live Garmin receiver does not import isolated probe
        run: |
          if grep -Eq 'garmin-sample-shape-probe|inspect-garmin-activity-shape|garmin-one-shot-probe-contract' supabase/functions/garmin-activity-push/index.ts; then
            echo 'Isolated probe unexpectedly referenced by production receiver' >&2
            exit 1
          fi
