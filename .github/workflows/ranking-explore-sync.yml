name: Verify EXPLORE regions (global)
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to verify (leave blank for current UTC year)'
        required: false
        type: string
  schedule:
    # 09:23 and 21:23 Japan time. GitHub scheduled runs can be delayed.
    - cron: '23 0,12 * * *'
permissions:
  contents: read
concurrency:
  group: ranking-explore-sync
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check geometry and supported boundary files
        run: node scripts/sync-ranking-explore.mjs --self-test
      - name: Import opted-in GPS regions worldwide
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_YEAR: ${{ inputs.year }}
        run: |
          export EXPLORE_YEAR="${REQUESTED_YEAR:-$(date -u +%Y)}"
          echo "EXPLORE sync year: $EXPLORE_YEAR"
          node scripts/sync-ranking-explore.mjs
