name: Synthetic duplicate-nine float8 isolation (no production)
on:
  pull_request:
    paths:
      - 'tests/duplicate-nine-isolated-float8-pg17.sql'
      - '.github/workflows/duplicate-nine-isolated-float8-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-only-local
          POSTGRES_DB: synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Run synthetic float8 fixture without production credentials
        env:
          PGPASSWORD: synthetic-only-local
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U synthetic -d synthetic -f tests/duplicate-nine-isolated-float8-pg17.sql
