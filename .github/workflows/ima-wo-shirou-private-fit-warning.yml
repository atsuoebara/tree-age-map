name: Ima wo Shirou private FIT warning
on:
  pull_request:
    paths:
      - 'previews/ima-wo-shirou-fit-local-file-draft-20261113.html'
      - 'tests/ima-wo-shirou-private-fit-warning.test.cjs'
      - 'docs/ima-wo-shirou-real-fit-private-checklist-20261114.md'
      - '.github/workflows/ima-wo-shirou-private-fit-warning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact warning and privacy guards
        run: node --test tests/ima-wo-shirou-private-fit-warning.test.cjs
      - name: Existing local FIT parser regression
        run: node tests/race-fit-local-file-review.test.mjs
