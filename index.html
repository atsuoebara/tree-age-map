<script>

/* =====================================
   基本設定
===================================== */

const OWNER = 'atsuoebara';
const REPO = 'tree-age-map';
const BRANCH = 'main';

const CELL_SIZE = 0.0009;

const AREA_COLOR = '#ff2bd6';
const BORDER_COLOR = '#707580';
const ROUTE_COLOR = '#ff3b30';


/* =====================================
   Supabase
===================================== */

const SUPABASE_URL =
  'https://fhwvntpzwyenendhcgbw.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_8ZhwV5lVHGbud8v6AS3YBQ_C78JbXyM';

const SUPABASE_RUNS_URL =
  SUPABASE_URL +
  '/rest/v1/runs';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );

let currentSession =
  null;

let currentUser =
  null;


/* =====================================
   AUTH UI
===================================== */

const authArea =
  document.getElementById(
    'authArea'
  );

const appRoot =
  document.getElementById(
    'appRoot'
  );

const emailInput =
  document.getElementById(
    'emailInput'
  );

const passwordInput =
  document.getElementById(
    'passwordInput'
  );

const loginButton =
  document.getElementById(
    'loginButton'
  );

const signupButton =
  document.getElementById(
    'signupButton'
  );

const logoutButton =
  document.getElementById(
    'logoutButton'
  );
const stravaConnectButton =
  document.getElementById(
    'stravaConnectButton'
  );
const authMessage =
  document.getElementById(
    'authMessage'
  );

const accountEmail =
  document.getElementById(
    'accountEmail'
  );


function setAuthMessage(
  text
) {

  authMessage.textContent =
    text;

}


function setAuthBusy(
  busy
) {

  loginButton.disabled =
    busy;

  signupButton.disabled =
    busy;

  loginButton.style.opacity =
    busy
      ? '.55'
      : '1';

  signupButton.style.opacity =
    busy
      ? '.55'
      : '1';

}


async function login() {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if (
    !email ||
    !password
  ) {

    setAuthMessage(
      'メールアドレスとパスワードを入力してください。'
    );

    return;

  }


  setAuthBusy(
    true
  );

  setAuthMessage(
    'ログイン中…'
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword(
          {
            email,
            password
          }
        );


    if (
      error
    ) {

      throw error;

    }


    currentSession =
      data.session;

    currentUser =
      data.user;


    location.reload();

  }
  catch(error) {

    console.error(
      error
    );


    setAuthMessage(
      'ログインできませんでした。メールアドレスまたはパスワードを確認してください。'
    );

  }
  finally {

    setAuthBusy(
      false
    );

  }

}


async function signup() {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if (
    !email ||
    !password
  ) {

    setAuthMessage(
      'メールアドレスとパスワードを入力してください。'
    );

    return;

  }


  if (
    password.length <
    6
  ) {

    setAuthMessage(
      'パスワードは6文字以上にしてください。'
    );

    return;

  }


  setAuthBusy(
    true
  );

  setAuthMessage(
    '新規登録中…'
  );


  try {

    const redirectTo =
      location.origin +
      location.pathname;


    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signUp(
          {
            email,
            password,
            options:{
              emailRedirectTo:
                redirectTo
            }
          }
        );


    if (
      error
    ) {

      throw error;

    }


    if (
      data.session
    ) {

      currentSession =
        data.session;

      currentUser =
        data.user;


      location.reload();

      return;

    }


    setAuthMessage(
      '登録メールを送信しました。メール内の確認リンクを開いてからログインしてください。'
    );

  }
  catch(error) {

    console.error(
      error
    );


    setAuthMessage(
      '新規登録できませんでした。入力内容を確認してください。'
    );

  }
  finally {

    setAuthBusy(
      false
    );

  }

}


async function logout() {

  try {

    await supabaseClient
      .auth
      .signOut();

  }
  catch(error) {

    console.error(
      error
    );

  }


  location.reload();

}
async function connectStrava() {
  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    alert('先にRunner’s Ringsへログインしてください。');
    return;
  }

  const { data, error } =
    await supabaseClient.functions.invoke(
      'strava-oauth',
      {
        headers: {
          Authorization: `Bearer ${session.access_token}`
        }
      }
    );

  if (error) {
    console.error(error);
    alert('Strava連携の開始に失敗しました。');
    return;
  }

  if (!data?.url) {
    alert('Strava認証URLを取得できませんでした。');
    return;
  }

  location.href = data.url;
}
async function syncStrava() {
  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    alert('先にRunner’s Ringsへログインしてください。');
    return;
  }

  const { data, error } =
    await supabaseClient.functions.invoke(
      'strava-sync',
      {
        headers: {
          Authorization: `Bearer ${session.access_token}`
        }
      }
    );

  if (error) {
    console.error(error);
    alert('Stravaのラン取得に失敗しました。');
    return;
  }

  console.log('Strava activities:', data);

  alert(
    'Stravaから ' +
    (data?.count ?? 0) +
    ' 件取得しました。'
  );
}

window.syncStrava = syncStrava;
  
loginButton.onclick =
  login;

signupButton.onclick =

logoutButton.onclick =
  logout;
stravaConnectButton.onclick =
  connectStrava;

async function updateStravaConnectionStatus() {
  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    return;
  }

  const { data, error } =

/* =====================================

===================================== */

const DB_NAME =
  'RunnersRingsDB';

const DB_VERSION =
  1;

const STORE_NAME =
  'importedGPX';

const LEGACY_OWNER_KEY =
  'RunnersRingsLegacyOwnerUserId';


function openDatabase() {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        event => {

          const db =
            event.target.result;


          if (
            !db
              .objectStoreNames
              .contains(
                STORE_NAME
              )
          ) {

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath:'id',
                autoIncrement:true
              }
            );

          }

        };


      request.onsuccess =
        () =>
          resolve(
            request.result
          );


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}

async function claimLegacyLocalGPX() {

  if (
    !currentUser
  ) {

    return;

  }


  const all =
    await getAllSavedGPXRaw();


  const legacy =
    all.filter(
      item =>
        !item.userId
    );


  let legacyOwnerId =
    localStorage.getItem(
      LEGACY_OWNER_KEY
    );


  const forceLegacy =
    new URLSearchParams(
      location.search
    )
    .get(
      'legacy'
    ) ===
    '1';


  if (
    forceLegacy &&
    !legacyOwnerId
  ) {

    legacyOwnerId =
      currentUser.id;


    localStorage.setItem(
      LEGACY_OWNER_KEY,
      currentUser.id
    );

  }


  if (
    legacy.length &&
    !legacyOwnerId
  ) {

    legacyOwnerId =
      currentUser.id;


    localStorage.setItem(
      LEGACY_OWNER_KEY,
      currentUser.id
    );

  }


  if (
    legacyOwnerId !==
    currentUser.id
  ) {

    return;

  }


  if (
    !legacy.length
  ) {

    return;

  }


  const db =
    await openDatabase();


  await new Promise(
    (
      resolve,
      reject
    ) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          'readwrite'
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      legacy.forEach(
        item => {

          store.put(
            {
              ...item,
              userId:
                currentUser.id
            }
          );

        }
      );


      transaction.oncomplete =
        () =>
          resolve();


      transaction.onerror =
        () =>
          reject(
            transaction.error
          );

    }
  );

}

/* =====================================
   距離
===================================== */

function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;

  const toRad =
    deg =>
      deg *
      Math.PI /
      180;


  const dLat =
    toRad(
      lat2 -
      lat1
    );


  const dLon =
    toRad(
      lon2 -
      lon1
    );


  const a =
    Math.sin(
      dLat /
      2
    ) ** 2 +

    Math.cos(
      toRad(
        lat1
      )
    ) *

    Math.cos(
      toRad(
        lat2
      )
    ) *

    Math.sin(
      dLon /
      2
    ) ** 2;


  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(
        a
      ),
      Math.sqrt(
        1 -
        a
      )
    )
  );

}


/* =====================================
   市町村判定
===================================== */

function pointInRing(
  point,
  ring
) {

  const x =
    point[0];

  const y =
    point[1];

  let inside =
    false;


  for (
    let i = 0,
        j = ring.length - 1;

    i < ring.length;

    j = i++
  ) {

    const xi =
      ring[i][0];

    const yi =
      ring[i][1];

    const xj =
      ring[j][0];

    const yj =
      ring[j][1];


    const intersect =
      ((yi > y) !==
       (yj > y)) &&
      (
        x <
        (
          (xj - xi) *
          (y - yi) /
          (yj - yi)
        ) +
        xi
      );


    if (
      intersect
    ) {

      inside =
        !inside;

    }

  }


  return inside;

}


function pointInPolygon(
  point,
  polygon
) {

  if (
    !pointInRing(
      point,
      polygon[0]
    )
  ) {

    return false;

  }


  for (
    let i = 1;
    i < polygon.length;
    i++
  ) {

    if (
      pointInRing(
        point,
        polygon[i]
      )
    ) {

      return false;

    }

  }


  return true;

}


function pointInFeature(
  point,
  feature
) {

  const geometry =
    feature.geometry;


  if (
    !geometry
  ) {

    return false;

  }


  if (
    geometry.type ===
    'Polygon'
  ) {

    return pointInPolygon(
      point,
      geometry.coordinates
    );

  }


  if (
    geometry.type ===
    'MultiPolygon'
  ) {

    return geometry
      .coordinates
      .some(
        polygon =>
          pointInPolygon(
            point,
            polygon
          )
      );

  }


  return false;

}


/* =====================================
   BBOX
===================================== */

function collectCoordinates(
  coords,
  output
) {

  if (
    typeof coords[0] ===
    'number'
  ) {

    output.push(
      coords
    );

    return;

  }


  coords.forEach(
    child =>
      collectCoordinates(
        child,
        output
      )
  );

}


function getFeatureBBox(
  feature
) {

  const points =
    [];


  collectCoordinates(
    feature.geometry.coordinates,
    points
  );


  let minLon =
    Infinity;

  let minLat =
    Infinity;

  let maxLon =
    -Infinity;

  let maxLat =
    -Infinity;


  points.forEach(
    (
      [
        lon,
        lat
      ]
    ) => {

      minLon =
        Math.min(
          minLon,
          lon
        );

      minLat =
        Math.min(
          minLat,
          lat
        );

      maxLon =
        Math.max(
          maxLon,
          lon
        );

      maxLat =
        Math.max(
          maxLat,
          lat
        );

    }
  );


  return {
    minLon,
    minLat,
    maxLon,
    maxLat
  };

}


/* =====================================
   都道府県・市町村
===================================== */

function getPrefecture(
  feature
) {

  return (
    feature
      ?.properties
      ?.N03_001 ||
    '都道府県不明'
  );

}


function getCity(
  feature
) {

  return (
    feature
      ?.properties
      ?.N03_004 ||
    '名称不明'
  );

}


function getCityKey(
  feature
) {

  return (
    getPrefecture(
      feature
    ) +
    '|' +
    getCity(
      feature
    )
  );

}


function splitCityKey(
  key
) {

  const i =
    key.indexOf(
      '|'
    );


  if (
    i ===
    -1
  ) {

    return {
      prefecture:'',
      city:key
    };

  }


  return {
    prefecture:
      key.slice(
        0,
        i
      ),

    city:
      key.slice(
        i + 1
      )
  };

}


function findMunicipalityFeature(
  lat,
  lon
) {

  const point =
    [
      lon,
      lat
    ];


  for (
    const item of
    municipalityFeatures
  ) {

    const b =
      item.bbox;


    if (
      lon < b.minLon ||
      lon > b.maxLon ||
      lat < b.minLat ||
      lat > b.maxLat
    ) {

      continue;

    }


    if (
      pointInFeature(
        point,
        item.feature
      )
    ) {

      return item.feature;

    }

  }


  return null;

}


/* =====================================
   100mセル
===================================== */

function getCellKey(
  lat,
  lon
) {

  return (
    Math.floor(
      lat /
      CELL_SIZE
    ) +
    ',' +
    Math.floor(
      lon /
      CELL_SIZE
    )
  );

}


function getCellBounds(
  key
) {

  const [
    a,
    b
  ] =
    key
      .split(',')
      .map(
        Number
      );


  const south =
    a *
    CELL_SIZE;

  const west =
    b *
    CELL_SIZE;


  return [
    [
      south,
      west
    ],
    [
      south +
      CELL_SIZE,
      west +
      CELL_SIZE
    ]
  ];

}


function getRingOpacity(
  count
) {

  if(count <= 1) return 0.10;
  if(count === 2) return 0.16;
  if(count <= 4) return 0.24;
  if(count <= 7) return 0.34;
  if(count <= 15) return 0.46;

  return 0.58;

}


function buildCellsFromRoute(
  latlngs
) {

  const cells =
    new Set();


  if (
    !latlngs.length
  ) {

    return cells;

  }


  cells.add(
    getCellKey(
      latlngs[0][0],
      latlngs[0][1]
    )
  );


  for (
    let i = 1;
    i < latlngs.length;
    i++
  ) {

    const a =
      latlngs[
        i - 1
      ];

    const b =
      latlngs[i];


    const km =
      distanceKm(
        a[0],
        a[1],
        b[0],
        b[1]
      );


    const steps =
      Math.max(
        1,
        Math.ceil(
          km /
          0.04
        )
      );


    for (
      let s = 0;
      s <= steps;
      s++
    ) {

      const t =
        s /
        steps;


      const lat =
        a[0] +
        (
          b[0] -
          a[0]
        ) *
        t;


      const lon =
        a[1] +
        (
          b[1] -
          a[1]
        ) *
        t;


      cells.add(
        getCellKey(
          lat,
          lon
        )
      );

    }

  }


  return cells;

}


/* =====================================
   市町村濃度
===================================== */

function getMunicipalityOpacity(
  km
) {

  if(km <= 0) return 0;
  if(km < 5) return 0.04;
  if(km < 10) return 0.08;
  if(km < 20) return 0.14;
  if(km < 30) return 0.22;
  if(km < 50) return 0.30;
  if(km < 100) return 0.40;
  if(km < 200) return 0.50;
  if(km < 400) return 0.60;

  return 0.70;

}

/* =====================================
   ルート解析
===================================== */

function analyseRoute(
  latlngs,
  targetDistanceKm = null
) {

  const cityDistances =
    {};

  const cities =
    new Set();

  const prefectures =
    new Set();

  let calculatedKm =
    0;


  for (
    let i = 1;
    i < latlngs.length;
    i++
  ) {

    const prev =
      latlngs[
        i - 1
      ];

    const current =
      latlngs[i];


    const segmentKm =
      distanceKm(
        prev[0],
        prev[1],
        current[0],
        current[1]
      );


    calculatedKm +=
      segmentKm;


    const feature =
      findMunicipalityFeature(
        (
          prev[0] +
          current[0]
        ) /
        2,

        (
          prev[1] +
          current[1]
        ) /
        2
      );


    if (
      feature
    ) {

      const cityKey =
        getCityKey(
          feature
        );


      const prefecture =
        getPrefecture(
          feature
        );


      cityDistances[
        cityKey
      ] =
        (
          cityDistances[
            cityKey
          ] ||
          0
        ) +
        segmentKm;


      cities.add(
        cityKey
      );


      prefectures.add(
        prefecture
      );

    }

  }


  if (
    targetDistanceKm &&
    calculatedKm >
    0
  ) {

    const scale =
      targetDistanceKm /
      calculatedKm;


    Object.keys(
      cityDistances
    )
    .forEach(
      key => {

        cityDistances[
          key
        ] *=
          scale;

      }
    );

  }


  return {
    cityDistances,

    cities:
      Array.from(
        cities
      ),

    prefectures:
      Array.from(
        prefectures
      ),

    calculatedKm
  };

}


/* =====================================
   活動シグネチャ
===================================== */

function createActivitySignature(
  activity
) {

  // Strava由来はStrava固有IDを最優先
  if (
    activity.stravaId
  ) {
    return (
      'strava|' +
      String(
        activity.stravaId
      )
    );
  }

  // Strava IDがないランは従来方式で重複判定
  const first =
    activity.latlngs[0];

  const last =
    activity.latlngs[
      activity.latlngs.length -
      1
    ];

  const round4 =
    value =>
      Number(
        value
      )
      .toFixed(
        4
      );

  const datePart =
    activity.date &&
    !Number.isNaN(
      activity.date.getTime()
    )

      ? [
          activity.date.getFullYear(),

          String(
            activity.date.getMonth() +
            1
          )
          .padStart(
            2,
            '0'
          ),

          String(
            activity.date.getDate()
          )
          .padStart(
            2,
            '0'
          )
        ]
        .join(
          '-'
        )

      : 'nodate';

  return [
    datePart,

    activity.distance
      .toFixed(
        2
      ),

    activity.latlngs.length,

    round4(
      first[0]
    ),

    round4(
      first[1]
    ),

    round4(
      last[0]
    ),

    round4(
      last[1]
    )
  ]
  .join(
    '|'
  );

}


function registerActivity(
  activity
) {

  const signature =
    createActivitySignature(
      activity
    );


  if (
    activitySignatures.has(
      signature
    )
  ) {

    return false;

  }


  activity.signature =
    signature;


  activitySignatures.add(
    signature
  );


  activities.push(
    activity
  );


  return true;

}


/* =====================================
   重複チェック
===================================== */

function sameCalendarDate(
  a,
  b
) {

  return !!(
    a &&
    b &&
    !Number.isNaN(
      a.getTime()
    ) &&
    !Number.isNaN(
      b.getTime()
    ) &&
    a.getFullYear() ===
      b.getFullYear() &&
    a.getMonth() ===
      b.getMonth() &&
    a.getDate() ===
      b.getDate()
  );

}


function getRouteSamples(
  latlngs,
  count = 7
) {

  const result =
    [];


  if (
    latlngs.length <
    2
  ) {

    return result;

  }


  for (
    let i = 0;
    i < count;
    i++
  ) {

    result.push(
      latlngs[
        Math.round(
          i /
          (
            count -
            1
          ) *
          (
            latlngs.length -
            1
          )
        )
      ]
    );

  }


  return result;

}


function routeSimilarity(
  a,
  b
) {

  const samplesA =
    getRouteSamples(
      a.latlngs
    );

  const samplesB =
    getRouteSamples(
      b.latlngs
    );


  if (
    samplesA.length !==
      samplesB.length ||
    !samplesA.length
  ) {

    return false;

  }


  let total =
    0;

  let max =
    0;


  for (
    let i = 0;
    i < samplesA.length;
    i++
  ) {

    const d =
      distanceKm(
        samplesA[i][0],
        samplesA[i][1],
        samplesB[i][0],
        samplesB[i][1]
      );


    total +=
      d;


    max =
      Math.max(
        max,
        d
      );

  }


  return (
    total /
    samplesA.length <=
      0.12 &&
    max <=
      0.30
  );

}


function findPossibleDuplicate(
  newActivity
) {

  if (
    !newActivity ||
    !Array.isArray(
      newActivity.latlngs
    ) ||
    newActivity.latlngs.length <
      2
  ) {

    return null;

  }


  const newStart =
    newActivity.latlngs[0];

  const newEnd =
    newActivity.latlngs[
      newActivity.latlngs.length -
      1
    ];


  for (
    const oldActivity of
    activities
  ) {

    if (
      !Array.isArray(
        oldActivity.latlngs
      ) ||
      oldActivity.latlngs.length <
        2 ||
      !sameCalendarDate(
        newActivity.date,
        oldActivity.date
      )
    ) {

      continue;

    }


    const difference =
      Math.abs(
        newActivity.distance -
        oldActivity.distance
      );


    const allowed =
      Math.max(
        0.5,
        oldActivity.distance *
        0.08
      );


    if (
      difference >
      allowed
    ) {

      continue;

    }


    const oldStart =
      oldActivity.latlngs[0];

    const oldEnd =
      oldActivity.latlngs[
        oldActivity.latlngs.length -
        1
      ];


    if (
      distanceKm(
        newStart[0],
        newStart[1],
        oldStart[0],
        oldStart[1]
      ) >
      0.4
    ) {

      continue;

    }


    if (
      distanceKm(
        newEnd[0],
        newEnd[1],
        oldEnd[0],
        oldEnd[1]
      ) >
      0.6
    ) {

      continue;

    }


    if (
      !routeSimilarity(
        newActivity,
        oldActivity
      )
    ) {

      continue;

    }


    return oldActivity;

  }


  return null;

}


/* =====================================
   GPX → Activity
===================================== */

function buildActivityFromGPXText(
  text,
  name,
  source
) {

  const xml =
    new DOMParser()
      .parseFromString(
        text,
        'application/xml'
      );


  if (
    xml.querySelector(
      'parsererror'
    )
  ) {

    throw new Error(
      'GPXを読み込めません'
    );

  }


  const timeElement =
    xml.querySelector(
      'metadata > time'
    ) ||
    xml.querySelector(
      'trkpt > time'
    );


  let date =
    null;


  if (
    timeElement
  ) {

    const d =
      new Date(
        timeElement.textContent
      );


    if (
      !Number.isNaN(
        d.getTime()
      )
    ) {

      date =
        d;

    }

  }


  const latlngs =
    Array.from(
      xml.getElementsByTagName(
        'trkpt'
      )
    )
    .map(
      point => [
        parseFloat(
          point.getAttribute(
            'lat'
          )
        ),

        parseFloat(
          point.getAttribute(
            'lon'
          )
        )
      ]
    )
    .filter(
      point =>
        Number.isFinite(
          point[0]
        ) &&
        Number.isFinite(
          point[1]
        )
    );


  if (
    latlngs.length <
    2
  ) {

    throw new Error(
      'GPS座標が不足しています'
    );

  }


  const analysis =
    analyseRoute(
      latlngs
    );


  return {
    source,
    name,
    date,

    year:
      date
        ? date.getFullYear()
        : null,

    distance:
      analysis.calculatedKm,

    latlngs,

    cityDistances:
      analysis.cityDistances,

    cities:
      analysis.cities,

    prefectures:
      analysis.prefectures,

    cells:
      Array.from(
        buildCellsFromRoute(
          latlngs
        )
      )
  };

}

function formatDateForCloud(
  date
) {

  if (
    !date ||
    Number.isNaN(
      date.getTime()
    )
  ) {

    return null;

  }


  return [
    date.getFullYear(),

    String(
      date.getMonth() +
      1
    )
    .padStart(
      2,
      '0'
    ),

    String(
      date.getDate()
    )
    .padStart(
      2,
      '0'
    )
  ]
  .join(
    '-'
  );

}


async function fetchCloudRuns() {

  if (
    !cloudEnabled()
  ) {
    return [];
  }

  const headers =
    await getCloudHeaders();

  const allRuns = [];
  const pageSize = 1000;
  let offset = 0;

  while (true) {

    const url =
      SUPABASE_RUNS_URL +
      '?select=id,created_at,activity_date,name,distance_km,route,user_id,strava_id,source' +
      '&user_id=eq.' +
      encodeURIComponent(
        currentUser.id
      ) +
      '&order=activity_date.asc' +
      '&limit=' +
      pageSize +
      '&offset=' +
      offset;

    const response =
      await fetch(
        url,
        {
          headers
        }
      );

    if (
      !response.ok
    ) {

      const message =
        await response.text();

      throw new Error(
        'クラウド読込失敗 HTTP ' +
        response.status +
        ' ' +
        message
      );
    }

    const pageRuns =
      await response.json();

    allRuns.push(
      ...pageRuns
    );

    if (
      pageRuns.length < pageSize
    ) {
      break;
    }

    offset += pageSize;
  }

  return allRuns;
}


function buildActivityFromCloudRow(
  row
) {

  if (
    !Array.isArray(
      row.route
    ) ||
    row.route.length <
      2
  ) {

    return null;

  }


  const latlngs =
    row.route
      .map(
        point => [
          Number(
            point[0]
          ),
          Number(
            point[1]
          )
        ]
      )
      .filter(
        point =>
          Number.isFinite(
            point[0]
          ) &&
          Number.isFinite(
            point[1]
          )
      );


  if (
    latlngs.length <
    2
  ) {

    return null;

  }


  const distance =
    Number(
      row.distance_km
    );


  const analysis =
    analyseRoute(
      latlngs,

      Number.isFinite(
        distance
      )
        ? distance
        : null
    );


  const date =
    row.activity_date

      ? new Date(
          row.activity_date +
          'T12:00:00'
        )

      : null;


  return {
    source:
      'cloud',

    cloudId:
      row.id,
    stravaId:
      row.strava_id
        ? String(row.strava_id)
        : null,

    originalSource:
      row.source || null,
    name:
      row.name ||
      'クラウドラン',

    date,

    year:
      date &&
      !Number.isNaN(
        date.getTime()
      )

        ? date.getFullYear()

        : null,

    distance:
      Number.isFinite(
        distance
      )

        ? distance

        : analysis.calculatedKm,

    latlngs,

    cityDistances:
      analysis.cityDistances,

    cities:
      analysis.cities,

    prefectures:
      analysis.prefectures,

    cells:
      Array.from(
        buildCellsFromRoute(
          latlngs
        )
      )
  };

}


async function loadCloudActivities() {

  if (
    !cloudEnabled()
  ) {

    cloudRunCount =
      0;

    cloudRows =
      [];

    return 0;

  }


  try {

    setStatus(
      '☁️ クラウドRUNを読み込み中…'
    );


    const rows =
      await fetchCloudRuns();


    cloudRows =
      rows;


    cloudRunCount =
      rows.length;


    let loaded =
      0;


    rows.forEach(
      row => {

        const activity =
          buildActivityFromCloudRow(
            row
          );


        if (
          !activity
        ) {

          return;

        }

                const routeSignature =
          createActivitySignature(
            {
              ...activity,
              stravaId: null
            }
          );

        cloudRouteSignatures.add(
          routeSignature
        );

        const signature =
          createActivitySignature(
            activity
          );


        cloudSignatures.add(
          signature
        );


        if (
          registerActivity(
            activity
          )
        ) {

          loaded++;

        }

      }
    );


    return loaded;

  }
  catch(error) {

    console.error(
      error
    );


    document
      .getElementById(
        'syncInfo'
      )
      .textContent =
        '⚠️ クラウド読込失敗・端末データで表示';


    return 0;

  }

}


async function saveActivityToCloud(
  activity
) {

  if (
    !cloudEnabled()
  ) {

    throw new Error(
      'ログインしていません'
    );

  }


  const payload =
    {
      user_id:
        currentUser.id,

      activity_date:
        formatDateForCloud(
          activity.date
        ),

      name:
        activity.name

          ? activity.name.replace(
              /\.gpx$/i,
              ''
            )

          : 'ラン',

      distance_km:
        Number(
          activity.distance
            .toFixed(
              6
            )
        ),

      route:
        activity.latlngs
    };


  const headers =
    await getCloudHeaders(
      {
        'Content-Type':
          'application/json',

        Prefer:
          'return=representation'
      }
    );


  const response =
    await fetch(
      SUPABASE_RUNS_URL,
      {
        method:'POST',

        headers,

        body:
          JSON.stringify(
            payload
          )
      }
    );


  if (
    !response.ok
  ) {

    const message =
      await response.text();


    throw new Error(
      'クラウド保存失敗 HTTP ' +
      response.status +
      ' ' +
      message
    );

  }


  const rows =
    await response.json();


  if (
    rows &&
    rows[0]
  ) {

    cloudRows.push(
      rows[0]
    );

  }


  cloudRunCount =
    cloudRows.length;


  cloudSignatures.add(
    createActivitySignature(
      activity
    )
  );


  return (
    rows &&
    rows[0]
  )

    ? rows[0]

    : null;

}

  ) {

  );


  const response =
    await fetch(
      'https://api.github.com/repos/' +
      OWNER +
      '/' +
      REPO +
      '/contents?ref=' +
      BRANCH,
      {
        headers:{
          Accept:
            'application/vnd.github+json'
        }
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      'GPX一覧取得失敗 HTTP ' +
      response.status
    );

  }


  return (
    await response.json()
  )
  .filter(
    file =>
      file.type ===
        'file' &&
      file.name
        .toLowerCase()
        .endsWith(
          '.gpx'
        )
  )
  .map(
    file => ({
      name:
        file.name,

      url:
        file.download_url
    })
  );

}

   端末保存GPX
===================================== */

async function loadSavedActivities() {

  let saved;


  try {

    saved =
      await getSavedGPX();

  }
  catch(error) {

    console.error(
      error
    );


    return {
      loaded:0,
      synced:0
    };

  }


  let loaded =
    0;

  let synced =
    0;


  for (
    const item of
    saved
  ) {

    try {

      const activity =
        buildActivityFromGPXText(
          item.text,
          item.name,
          'local'
        );


      activity.localId =
        item.id;


      const signature =
        createActivitySignature(
          activity
        );


      const alreadyKnown =
  activitySignatures.has(
    signature
  ) ||
  cloudRouteSignatures.has(
    signature
  );


      if (
        !alreadyKnown
      ) {

        if (
          registerActivity(
            activity
          )
        ) {

          loaded++;

        }

      }


      if (
  cloudEnabled() &&
  !cloudRouteSignatures.has(
    signature
  )
) {

        try {

          await saveActivityToCloud(
            activity
          );


          synced++;

        }
        catch(syncError) {

          console.warn(
            '端末→クラウド同期失敗',
            item.name,
            syncError
          );

        }

      }

    }
    catch(error) {

      console.warn(
        '保存GPX復元失敗',
        item.name,
        error
      );

    }

  }


  return {
    loaded,
    synced
  };

}

/* =====================================
   一括インポート
===================================== */

async function importSelectedGPXFiles(
  files
) {

  const isBatch =
    files.length >
    1;


  let added =
    0;

  let duplicates =
    0;

  let invalidFormat =
    0;

  let failed =
    0;

  let cloudSaved =
    0;

  let cloudFailed =
    0;

  let lastAddedActivity =
    null;


  for (
    let i = 0;
    i < files.length;
    i++
  ) {

    const file =
      files[i];


    setStatus(
      'GPX ' +
      (i + 1) +
      '/' +
      files.length +
      ' を処理中…'
    );


    if (
      !file.name
        .toLowerCase()
        .endsWith(
          '.gpx'
        )
    ) {

      invalidFormat++;

      continue;

    }


    try {

      const text =
        await file.text();


      const activity =
        buildActivityFromGPXText(
          text,
          file.name,
          'local'
        );


      const exact =
        createActivitySignature(
          activity
        );


      if (
        activitySignatures.has(
          exact
        )
      ) {

        duplicates++;

        continue;

      }


      const duplicate =
        findPossibleDuplicate(
          activity
        );


      if (
        duplicate
      ) {

        if (
          isBatch
        ) {

          duplicates++;

          continue;

        }


        const source =
          duplicate.source ===
            'archive'

            ? '過去データ'

            : duplicate.source ===
              'github'

              ? 'GitHubデータ'

              : duplicate.source ===
                'cloud'

                ? 'クラウド'

                : '端末保存';


        const ok =
          confirm(
            '⚠️ 登録済みの可能性が高いランがあります。\n\n' +
            '登録済み\n' +
            formatRunDate(
              duplicate.date
            ) +
            '\n' +
            duplicate.distance
              .toFixed(
                2
              ) +
            ' km\n' +
            source +
            '\n\n' +
            '今回\n' +
            formatRunDate(
              activity.date
            ) +
            '\n' +
            activity.distance
              .toFixed(
                2
              ) +
            ' km\n\n' +
            '［OK］それでも追加\n' +
            '［キャンセル］追加しない'
          );


        if (
          !ok
        ) {

          duplicates++;

          continue;

        }

      }


      activity.localId =
        await saveGPXToDevice(
          file.name,
          text
        );


      registerActivity(
        activity
      );


      added++;

      lastAddedActivity =
        activity;


      try {

        setStatus(
          '☁️ ' +
          (i + 1) +
          '/' +
          files.length +
          ' クラウド保存中…'
        );


        await saveActivityToCloud(
          activity
        );


        cloudSaved++;

      }
      catch(error) {

        console.error(
          'クラウド保存失敗:',
          file.name,
          error
        );


        cloudFailed++;

      }

    }
    catch(error) {

      console.error(
        'GPX処理失敗:',
        file.name,
        error
      );


      failed++;

    }

  }


  selectedYear =
    'ALL';


  createYearFilters();


  renderSelectedData();


  await updateStorageInfo();


  if (
    savedRunsPanel
      .classList
      .contains(
        'open'
      )
  ) {

    await renderSavedRuns();

  }


  if (
    cloudRunsPanel
      .classList
      .contains(
        'open'
      )
  ) {

    await renderCloudRuns();

  }


  if (
    isBatch
  ) {

    const home =
      getHomePrefectureBounds();


    if (
      home
    ) {

      map.fitBounds(
        home.bounds,
        {
          padding:[
            20,
            20
          ]
        }
      );

    }


    setStatus(
      '✅ 一括インポート完了'
    );


    let message =
      files.length +
      '件を処理しました。\n\n' +
      '✅ 新規追加 ' +
      added +
      '件\n' +
      '⏭️ 重複スキップ ' +
      duplicates +
      '件\n';


    if (
      invalidFormat >
      0
    ) {

      message +=
        '⚠️ GPX以外 ' +
        invalidFormat +
        '件\n';

    }


    if (
      failed >
      0
    ) {

      message +=
        '❌ 読み込み失敗 ' +
        failed +
        '件\n';

    }


    message +=
      '☁️ クラウド保存 ' +
      cloudSaved +
      '件';


    if (
      cloudFailed >
      0
    ) {

      message +=
        '\n⚠️ クラウド未同期 ' +
        cloudFailed +
        '件';

    }


    alert(
      message
    );

  }
  else {

    if (
      added ===
      1 &&
      lastAddedActivity
    ) {

      map.fitBounds(
        L.latLngBounds(
          lastAddedActivity.latlngs
        ),
        {
          padding:[
            25,
            25
          ]
        }
      );


      if (
        cloudFailed ===
        0
      ) {

        setStatus(
          '✅ クラウド＋端末に保存しました'
        );


        alert(
          'ランを追加しました！\n\n☁️ クラウド保存完了'
        );

      }
      else {

        setStatus(
          '⚠️ 端末には保存済み・クラウド同期は次回再試行'
        );


        alert(
          'ランを追加しました。\n\n' +
          '端末には保存できましたが、' +
          'クラウド保存は完了していません。\n' +
          '次回起動時に再同期します。'
        );

      }

    }
    else if (
      duplicates ===
      1
    ) {

      setStatus(
        '⚠️ 登録済みのランです'
      );


      alert(
        '⚠️ このランはすでに登録されています。\n\n' +
        '同じランのため追加しませんでした。'
      );

    }
    else if (
      invalidFormat ===
      1
    ) {

      setStatus(
        '⚠️ GPX形式ではありません'
      );


      alert(
        'このファイルはGPX形式ではありません。\n\n' +
        '「.gpx」のファイルを選択してください。'
      );

    }
    else if (
      failed ===
      1
    ) {

      setStatus(
        '❌ GPX追加失敗'
      );


      alert(
        'GPXの読み込みに失敗しました。'
      );

    }

  }

}

/* =====================================
   集計
===================================== */

function buildSelectedStats() {

  const selected =
    getSelectedActivities();


  const municipalityDistance =
    {};

  const municipalityRunCount =
    {};

  const prefectureDistance =
    {};

  const prefectureRunCount =
    {};

  const ringCells =
    {};


  let totalDistanceKm =
    0;


  selected.forEach(
    activity => {

      totalDistanceKm +=
        activity.distance;


      const prefecturesInRun =
        new Set();


      Object.entries(
        activity.cityDistances
      )
      .forEach(
        (
          [
            cityKey,
            km
          ]
        ) => {

          municipalityDistance[
            cityKey
          ] =
            (
              municipalityDistance[
                cityKey
              ] ||
              0
            ) +
            km;


          const {
            prefecture
          } =
            splitCityKey(
              cityKey
            );


          if (
            prefecture
          ) {

            prefectureDistance[
              prefecture
            ] =
              (
                prefectureDistance[
                  prefecture
                ] ||
                0
              ) +
              km;


            prefecturesInRun.add(
              prefecture
            );

          }

        }
      );


      activity.cities
        .forEach(
          cityKey => {

            municipalityRunCount[
              cityKey
            ] =
              (
                municipalityRunCount[
                  cityKey
                ] ||
                0
              ) +
              1;

          }
        );


      prefecturesInRun
        .forEach(
          prefecture => {

            prefectureRunCount[
              prefecture
            ] =
              (
                prefectureRunCount[
                  prefecture
                ] ||
                0
              ) +
              1;

          }
        );


      activity.cells
        .forEach(
          key => {

            ringCells[
              key
            ] =
              (
                ringCells[
                  key
                ] ||
                0
              ) +
              1;

          }
        );

    }
  );


  return {
    activities:
      selected,

    municipalityDistance,

    municipalityRunCount,

    prefectureDistance,

    prefectureRunCount,

    ringCells,

    totalDistanceKm
  };

}

/* =====================================
   実走線
===================================== */

function drawRoutes(
  selectedActivities
) {

  const drawn =
    new Set();


  const round =
    value =>
      Math.round(
        value *
        10000
      ) /
      10000;


  selectedActivities
    .forEach(
      activity => {

        for (
          let i = 1;
          i < activity.latlngs.length;
          i++
        ) {

          const a =
            activity.latlngs[
              i - 1
            ];

          const b =
            activity.latlngs[i];


          const aKey =
            round(
              a[0]
            ) +
            ',' +
            round(
              a[1]
            );


          const bKey =
            round(
              b[0]
            ) +
            ',' +
            round(
              b[1]
            );


          const key =
            aKey < bKey

              ? aKey +
                '|' +
                bKey

              : bKey +
                '|' +
                aKey;


          if (
            drawn.has(
              key
            )
          ) {

            continue;

          }


          drawn.add(
            key
          );


          routeGroup.addLayer(
            L.polyline(
              [
                a,
                b
              ],
              {
                color:
                  ROUTE_COLOR,

                weight:
                  1.5,

                opacity:
                  0.30,

                lineCap:
                  'round',

                lineJoin:
                  'round',

                interactive:
                  false
              }
            )
          );

        }

      }
    );

}

/* =====================================
   市町村面
===================================== */

function drawMunicipalities(
  municipalityDistance,
  municipalityRunCount
) {

  municipalityLayer =
    L.geoJSON(
      geojsonData,
      {
        style:
          feature => {

            const cityKey =
              getCityKey(
                feature
              );


            const km =
              municipalityDistance[
                cityKey
              ] ||
              0;


            return {
              color:
                BORDER_COLOR,

              weight:
                km > 0
                  ? 0.7
                  : 0.35,

              opacity:
                km > 0
                  ? 0.45
                  : 0.10,

              fillColor:
                AREA_COLOR,

              fillOpacity:
                getMunicipalityOpacity(
                  km
                )
            };

          },


        onEachFeature:
          (
            feature,
            layer
          ) => {

            const prefecture =
              getPrefecture(
                feature
              );


            const city =
              getCity(
                feature
              );


            const cityKey =
              getCityKey(
                feature
              );


            const km =
              municipalityDistance[
                cityKey
              ] ||
              0;


            const runs =
              municipalityRunCount[
                cityKey
              ] ||
              0;


            municipalityLayers[
              cityKey
            ] =
              layer;


            layer.bindPopup(
              '<div class="popup-title">' +
              city +
              '</div>' +
              '<div class="popup-row">' +
              prefecture +
              '</div>' +
              '<div class="popup-row">' +
              '累積走行距離：' +
              '<strong>' +
              km.toFixed(
                2
              ) +
              ' km</strong>' +
              '</div>' +
              '<div class="popup-row">' +
              '走ったラン：' +
              '<strong>' +
              runs +
              ' 回</strong>' +
              '</div>'
            );

          }
      }
    );

}

function getPrefectureBounds(
  prefecture
) {

  const bounds =
    L.latLngBounds(
      []
    );


  municipalityFeatures
    .forEach(
      item => {

        if (
          getPrefecture(
            item.feature
          ) ===
          prefecture
        ) {

          bounds.extend(
            [
              item.bbox.minLat,
              item.bbox.minLon
            ]
          );


          bounds.extend(
            [
              item.bbox.maxLat,
              item.bbox.maxLon
            ]
          );

        }

      }
    );


  return bounds.isValid()
    ? bounds
    : null;

}

  cloudRunsPanel
  .scrollIntoView(
    {
      behavior:'smooth',
      block:'start'
    }
  );


  setStatus(
    prefecture +
    'を表示'
  );

}


/* =====================================
   都道府県 Dashboard
===================================== */

function updatePrefectureDashboard(
  stats
) {

  document
    .getElementById(
      'prefectureHeading'
    )
    .textContent =
      selectedYear ===
      'ALL'

        ? '都道府県別'

        : selectedYear +
          '年 都道府県別';


  const list =
    document.getElementById(
      'prefectureList'
    );


  const entries =
    Object.entries(
      stats.prefectureDistance
    )
    .filter(
      (
        [
          ,
          km
        ]
      ) =>
        km >
        0.01
    )
    .sort(
      (
        a,
        b
      ) =>
        b[1] -
        a[1]
    );


  list.innerHTML =
    '';


  if (
    !entries.length
  ) {

    list.innerHTML =
      '<div class="emptyMessage">' +
      'この期間の都道府県データがありません' +
      '</div>';

    return;

  }


  const maxKm =
    entries[0][1];


  entries.forEach(
    (
      [
        prefecture,
        km
      ]
    ) => {

      const percent =
        Math.max(
          3,
          km /
          maxKm *
          100
        );


      const runs =
        stats
          .prefectureRunCount[
            prefecture
          ] ||
        0;


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'prefectureCard';


      card.innerHTML =
        '<div class="prefectureTop">' +
          '<div class="prefectureName">' +
            prefecture +
          '</div>' +
          '<div class="prefectureDistance">' +
            km.toFixed(
              2
            ) +
            ' km' +
          '</div>' +
        '</div>' +
        '<div class="barTrack">' +
          '<div class="barFill" style="width:' +
            percent +
            '%"></div>' +
        '</div>' +
        '<div class="prefectureRuns">' +
          'RUNS ' +
          runs +
        '</div>';


      card.onclick =
        () =>
          focusPrefecture(
            prefecture
          );


      list.appendChild(
        card
      );

    }
  );

}


/* =====================================
   市町村 Dashboard
===================================== */

function updateDashboard(
  stats
) {

  const entries =
    Object.entries(
      stats.municipalityDistance
    )
    .filter(
      (
        [
          ,
          km
        ]
      ) =>
        km >
        0.01
    )
    .sort(
      (
        a,
        b
      ) =>
        b[1] -
        a[1]
    );


  document
    .getElementById(
      'totalDistance'
    )
    .textContent =
      stats
        .totalDistanceKm
        .toFixed(
          1
        );


  document
    .getElementById(
      'runCount'
    )
    .textContent =
      stats.activities.length;


  document
    .getElementById(
      'cityCount'
    )
    .textContent =
      entries.length;


  updatePrefectureDashboard(
    stats
  );


  document
    .getElementById(
      'cityHeading'
    )
    .textContent =
      selectedYear ===
      'ALL'

        ? '市町村別'

        : selectedYear +
          '年 市町村別';


  const cityList =
    document.getElementById(
      'cityList'
    );


  cityList.innerHTML =
    '';


  if (
    !entries.length
  ) {

    cityList.innerHTML =
      '<div class="emptyMessage">' +
      'この期間の市町村データがありません' +
      '</div>';

    return;

  }


  const maxKm =
    entries[0][1];


  entries.forEach(
    (
      [
        cityKey,
        km
      ]
    ) => {

      const {
        prefecture,
        city
      } =
        splitCityKey(
          cityKey
        );


      const percent =
        Math.max(
          3,
          km /
          maxKm *
          100
        );


      const runs =
        stats
          .municipalityRunCount[
            cityKey
          ] ||
        0;


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'cityCard';


      card.innerHTML =
        '<div class="cityTop">' +
          '<div class="cityName">' +
            city +
          '</div>' +
          '<div class="cityDistance">' +
            km.toFixed(
              2
            ) +
            ' km' +
          '</div>' +
        '</div>' +
        '<div class="barTrack">' +
          '<div class="barFill" style="width:' +
            percent +
            '%"></div>' +
        '</div>' +
        '<div class="cityRuns">' +
          prefecture +
          ' ・ RUNS ' +
          runs +
        '</div>';


      card.onclick =
        () =>
          focusMunicipality(
            cityKey
          );


      cityList.appendChild(
        card
      );

    }
  );

}


/* =====================================
   表示切替
===================================== */

function updateDisplay() {

  const zoom =
    map.getZoom();


  if (
    zoom >=
    14
  ) {

    if (
      municipalityLayer &&
      map.hasLayer(
        municipalityLayer
      )
    ) {

      map.removeLayer(
        municipalityLayer
      );

    }


    if (
      !map.hasLayer(
        ringGroup
      )
    ) {

      ringGroup.addTo(
        map
      );

    }


    if (
      !map.hasLayer(
        routeGroup
      )
    ) {

      routeGroup.addTo(
        map
      );

    }


    setStatus(
      selectedYear ===
      'ALL'

        ? '詳細表示：実走コース＋100m Runner\'s Rings'

        : selectedYear +
          '年：実走コース＋100m Runner\'s Rings'
    );

  }
  else if (
    zoom >=
    12
  ) {

    if (
      municipalityLayer &&
      map.hasLayer(
        municipalityLayer
      )
    ) {

      map.removeLayer(
        municipalityLayer
      );

    }


    if (
      map.hasLayer(
        ringGroup
      )
    ) {

      map.removeLayer(
        ringGroup
      );

    }


    if (
      !map.hasLayer(
        routeGroup
      )
    ) {

      routeGroup.addTo(
        map
      );

    }


    setStatus(
      selectedYear ===
      'ALL'

        ? '路線表示：実際に走ったコース'

        : selectedYear +
          '年：実際に走ったコース'
    );

  }
  else {

    if (
      municipalityLayer &&
      !map.hasLayer(
        municipalityLayer
      )
    ) {

      municipalityLayer.addTo(
        map
      );

    }


    if (
      map.hasLayer(
        routeGroup
      )
    ) {

      map.removeLayer(
        routeGroup
      );

    }


    if (
      map.hasLayer(
        ringGroup
      )
    ) {

      map.removeLayer(
        ringGroup
      );

    }


    setStatus(
      selectedYear ===
      'ALL'

        ? '広域表示：累積走行距離を市町村面で表示'

        : selectedYear +
          '年：走行距離を市町村面で表示'
    );

  }

}


/* =====================================
   再描画
===================================== */

function renderSelectedData() {

  const stats =
    buildSelectedStats();


  clearMapLayers();


  drawRoutes(
    stats.activities
  );


  drawRingCells(
    stats.ringCells
  );


  drawMunicipalities(
    stats.municipalityDistance,
    stats.municipalityRunCount
  );


  updateDashboard(
    stats
  );


  updateDisplay();

}


/* =====================================
   初期表示
===================================== */

function getHomePrefectureBounds() {

  const stats =
    buildSelectedStats();


  const ranking =
    Object.entries(
      stats.prefectureDistance
    )
    .sort(
      (
        a,
        b
      ) =>
        b[1] -
        a[1]
    );


  if (
    !ranking.length
  ) {

    return null;

  }


  const prefecture =
    ranking[0][0];


  const bounds =
    getPrefectureBounds(
      prefecture
    );


  return bounds

    ? {
        prefecture,
        bounds
      }

    : null;

}


/* =====================================
   アプリ起動
===================================== */

async function start() {

  try {

    await claimLegacyLocalGPX();


    await loadMunicipalities();


    let archiveCount =
      0;

    let githubCount =
      0;


    if (
      isLegacyOwner()
    ) {

      setStatus(
        '過去ランを復元中…'
      );


      archiveCount =
        loadArchiveActivities();


      const gpxFiles =
        await getGPXFiles();


      githubCount =
        await loadAllGPX(
          gpxFiles
        );

    }


    const cloudCount =
      await loadCloudActivities();
await updateStravaConnectionStatus();

    setStatus(
      '端末保存ランを復元中…'
    );


    const localResult =
      await loadSavedActivities();


    createYearFilters();


    renderSelectedData();


    await updateStorageInfo();


    await renderSavedRuns();


    const home =
      getHomePrefectureBounds();


    if (
      home
    ) {

      map.fitBounds(
        home.bounds,
        {
          padding:[
            20,
            20
          ]
        }
      );

    }
    else if (
      municipalityLayer
    ) {

      map.fitBounds(
        municipalityLayer
          .getBounds()
      );

    }


    setTimeout(
      () =>
        map.invalidateSize(),
      200
    );


    console.log(
      '過去:',
      archiveCount
    );


    console.log(
      'GitHub:',
      githubCount
    );


    console.log(
      'クラウド:',
      cloudCount
    );


    console.log(
      '端末追加:',
      localResult.loaded
    );


    console.log(
      '今回クラウド同期:',
      localResult.synced
    );


    console.log(
      '合計:',
      activities.length
    );


    if (
      localResult.synced >
      0
    ) {

      setStatus(
        '✅ ' +
        localResult.synced +
        ' RUNSをクラウドへ同期しました'
      );

    }

  }
  catch(error) {

    console.error(
      error
    );


    setStatus(
      '❌ ' +
      error.message
    );

  }

}


map.on(
  'zoomend',
  updateDisplay
);


/* =====================================
   認証状態 → 起動
===================================== */

async function init() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if (
      error
    ) {

      throw error;

    }


    currentSession =
      data.session;

    currentUser =
      data.session
        ?.user ||
      null;


    if (
      !currentSession ||
      !currentUser
    ) {

      authArea.style.display =
        'flex';

      appRoot.style.display =
        'none';

      return;

    }


    accountEmail.textContent =
  'アカウント';

    authArea.style.display =
      'none';

    appRoot.style.display =
      'block';


    setTimeout(
      () =>
        map.invalidateSize(),
      100
    );


    await start();

  }
  catch(error) {

    console.error(
      error
    );


    authArea.style.display =
      'flex';

    appRoot.style.display =
      'none';


    setAuthMessage(
      '認証情報を確認できませんでした。'
    );

  }

}


init();

const backToMapButton = document.getElementById("backToMapButton");

backToMapButton.onclick = () => {
  location.href = "https://atsuoebara.github.io/tree-age-map/";
};
