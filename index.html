<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner's Rings</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1422;
      color: white;
    }

    header {
      background: #0f1d2f;
      padding: 14px 16px 12px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.75;
    }

    #status {
      background: #17283d;
      color: #dce8f5;
      padding: 8px 14px;
      font-size: 13px;
      white-space: nowrap;
      overflow-x: auto;
    }

    #filters {
      background: #0f1d2f;
      padding: 9px 10px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .yearButton {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.14);
      background: #17283d;
      color: #dce8f5;
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 600;
    }

    .yearButton.active {
      background: #ff2bd6;
      color: white;
      border-color: #ff2bd6;
    }

    #map {
      width: 100%;
      height: 44vh;
      min-height: 320px;
    }

    #dashboard {
      padding: 18px 16px 32px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      background: #132237;
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
    }

    .label {
      font-size: 10px;
      letter-spacing: 1px;
      opacity: 0.65;
      margin-bottom: 6px;
    }

    .value {
      font-size: 21px;
      font-weight: 700;
    }

    .unit {
      font-size: 12px;
      opacity: 0.65;
    }

    h2 {
      font-size: 16px;
      margin: 22px 0 10px;
    }

    #cityList {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cityCard {
      background: #132237;
      border-radius: 14px;
      padding: 12px 14px 14px;
      cursor: pointer;
    }

    .cityTop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .cityName {
      font-size: 14px;
      font-weight: 700;
    }

    .cityDistance {
      font-size: 14px;
      opacity: 0.85;
    }

    .cityRuns {
      margin-top: 7px;
      font-size: 11px;
      opacity: 0.6;
    }

    .barTrack {
      width: 100%;
      height: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .barFill {
      height: 100%;
      background: #ff2bd6;
      border-radius: 999px;
      min-width: 3px;
    }

    .emptyMessage {
      background: #132237;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      opacity: 0.8;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
    }

    .popup-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .popup-row {
      margin-top: 4px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>Runner's Rings</h1>
  <p>走った記録ではなく、走った人生を残す。</p>
</header>

<div id="status">
  データを読み込み中…
</div>

<div id="filters">
  <button class="yearButton active">ALL</button>
</div>

<div id="map"></div>

<section id="dashboard">

  <div class="summary">

    <div class="card">
      <div class="label">TOTAL</div>
      <span id="totalDistance" class="value">--</span>
      <span class="unit">km</span>
    </div>
