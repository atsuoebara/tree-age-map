<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner's Rings</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1422;
    }

    header {
      background: #0f1d2f;
      color: white;
      padding: 12px 16px;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.75;
    }

    #status {
      background: #17283d;
      color: #dce8f5;
      padding: 8px 14px;
      font-size: 13px;
      box-sizing: border-box;
      white-space: nowrap;
      overflow-x: auto;
    }

    #map {
      width: 100%;
      height: calc(100vh - 91px);
    }
  </style>
</head>

<body>

<header>
  <h1>Runner's Rings</h1>
  <p>走った記録ではなく、走った人生を残す。</p>
</header>

<div id="status">
  データを読み込み中…
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([36.39, 139.06], 9);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/*
 * ==========================================
 * 読み込むGPX一覧
 * ==========================================
 */

const gpxFiles = [
  {
    name: 'run1',
    url: './run1.gpx'
  },
  {
    name: 'run2',
    url: 'https://raw.githubusercontent.com/atsuoebara/tree-age-map/refs/heads/main/%20%20%20%20run2.gpx'
  }
];


let geojsonData = null;
let municipalityLayer = null;

const routeGroup = L.layerGroup();

const municipalityDistance = {};

let totalDistanceKm = 0;


/*
 * ==========================================
 * 2点間の距離
 * ==========================================
 */

function distanceKm(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const toRad =
    deg => deg * Math.PI / 180;

  const dLat =
    toRad(lat2 - lat1);

  const dLon =
    toRad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *

    Math.sin(dLon / 2) ** 2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/*
 * ==========================================
 * 点がリング内にあるか判定
 * ==========================================
 */

function pointInRing(point, ring) {

  const x = point[0];
  const y = point[1];

  let inside = false;

  for (
    let i = 0, j = ring.length - 1;
    i < ring.length;
    j = i++
  ) {

    const xi = ring[i][0];
    const yi = ring[i][1];

    const xj = ring[j][0];
    const yj = ring[j][1];

    const intersect =
      ((yi > y) !== (yj > y)) &&
      (
        x <
        (xj - xi) *
        (y - yi) /
        (yj - yi) +
        xi
      );

    if (intersect) {
      inside = !inside;
    }
  }

  return inside;
}


function pointInPolygon(point, polygon) {

  if (!pointInRing(point, polygon[0])) {
    return false;
  }

  for (
    let i = 1;
    i < polygon.length;
    i++
  ) {

    if (
      pointInRing(
        point,
        polygon[i]
      )
    ) {
      return false;
    }
  }

  return true;
}


function pointInFeature(point, feature) {

  const geometry = feature.geometry;

  if (!geometry) {
    return false;
  }

  if (geometry.type === 'Polygon') {

    return pointInPolygon(
      point,
      geometry.coordinates
    );
  }

  if (geometry.type === 'MultiPolygon') {

    return geometry.coordinates.some(
      polygon =>
        pointInPolygon(
          point,
          polygon
        )
    );
  }

  return false;
}


/*
 * ==========================================
 * 座標 → 市町村
 * ==========================================
 */

function findMunicipality(lat, lon) {

  const point = [lon, lat];

  for (
    const feature of
    geojsonData.features
  ) {

    if (
      pointInFeature(
        point,
        feature
      )
    ) {

      return (
        feature.properties.N03_004 ||
        '名称不明'
      );
    }
  }

  return null;
}


/*
 * ==========================================
 * 累積距離 → 面の濃さ
 * ==========================================
 */

function getOpacity(km) {

  if (km <= 0) return 0.03;
  if (km < 5) return 0.15;
  if (km < 10) return 0.30;
  if (km < 20) return 0.45;
  if (km < 30) return 0.60;
  if (km < 50) return 0.72;

  return 0.85;
}


/*
 * ==========================================
 * 行政境界読み込み
 * ==========================================
 */

async function loadMunicipalities() {

  const response =
    await fetch(
      './N03-20250101_10.geojson'
    );

  if (!response.ok) {

    throw new Error(
      '行政境界データ取得失敗'
    );
  }

  geojsonData =
    await response.json();
}


/*
 * ==========================================
 * GPXを1本読み込む
 * ==========================================
 */

async function loadOneGPX(gpxFile) {

  document.getElementById(
    'status'
  ).textContent =
    '読み込み中：' +
    gpxFile.name;


  const response =
    await fetch(
      gpxFile.url
    );


  if (!response.ok) {

    throw new Error(
      gpxFile.name +
      ' 取得失敗 HTTP ' +
      response.status
    );
  }


  const text =
    await response.text();


  const parser =
    new DOMParser();


  const xml =
    parser.parseFromString(
      text,
      'application/xml'
    );


  if (
    xml.querySelector('parsererror')
  ) {

    throw new Error(
      gpxFile.name +
      ' XML解析失敗'
    );
  }


  const points =
    Array.from(
      xml.getElementsByTagName(
        'trkpt'
      )
    );


  const latlngs = [];


  points.forEach(point => {

    const lat =
      parseFloat(
        point.getAttribute('lat')
      );

    const lon =
      parseFloat(
        point.getAttribute('lon')
      );


    if (
      Number.isFinite(lat) &&
      Number.isFinite(lon)
    ) {

      latlngs.push(
        [lat, lon]
      );
    }
  });


  if (
    latlngs.length < 2
  ) {

    throw new Error(
      gpxFile.name +
      ' GPS座標不足'
    );
  }


  let fileDistanceKm = 0;


  for (
    let i = 1;
    i < latlngs.length;
    i++
  ) {

    const prev =
      latlngs[i - 1];

    const current =
      latlngs[i];


    const segmentKm =
      distanceKm(
        prev[0],
        prev[1],
        current[0],
        current[1]
      );


    fileDistanceKm +=
      segmentKm;


    const midLat =
      (prev[0] + current[0]) / 2;

    const midLon =
      (prev[1] + current[1]) / 2;


    const city =
      findMunicipality(
        midLat,
        midLon
      );


    if (city) {

      if (
        municipalityDistance[city]
        === undefined
      ) {

        municipalityDistance[city] = 0;
      }


      municipalityDistance[city] +=
        segmentKm;
    }
  }


  totalDistanceKm +=
    fileDistanceKm;


  const route =
    L.polyline(
      latlngs,
      {
        color: '#ff3b30',
        weight: 5,
        opacity: 0.9
      }
    );


  routeGroup.addLayer(
    route
  );


  console.log(
    gpxFile.name,
    fileDistanceKm.toFixed(2) +
    ' km'
  );
}


/*
 * ==========================================
 * 全GPX読み込み
 * ==========================================
 */

async function loadAllGPX() {

  for (
    const gpxFile of
    gpxFiles
  ) {

    await loadOneGPX(
      gpxFile
    );
  }
}


/*
 * ==========================================
 * 市町村面を描画
 * ==========================================
 */

function drawMunicipalities() {

  municipalityLayer =
    L.geoJSON(
      geojsonData,
      {

        style: feature => {

          const city =
            feature.properties.N03_004;

          const km =
            municipalityDistance[city] || 0;


          return {
            color: '#14834f',
            weight: 1.2,
            fillColor: '#20b26b',
            fillOpacity:
              getOpacity(km)
          };
        },


        onEachFeature:
          (feature, layer) => {

            const prefecture =
              feature.properties.N03_001 ||
              '群馬県';

            const city =
              feature.properties.N03_004 ||
              '名称不明';

            const km =
              municipalityDistance[city] || 0;


            layer.bindPopup(
              '<strong>' +
              prefecture +
              ' ' +
              city +
              '</strong><br>' +
              '累積走行距離：' +
              km.toFixed(2) +
              ' km'
            );
          }

      }
    );


  municipalityLayer.addTo(map);


  map.fitBounds(
    municipalityLayer.getBounds()
  );
}


/*
 * ==========================================
 * 市町村別サマリー
 * ==========================================
 */

function municipalitySummary() {

  const entries =
    Object.entries(
      municipalityDistance
    )
    .filter(
      ([, km]) => km > 0.01
    )
    .sort(
      (a, b) => b[1] - a[1]
    );


  if (
    entries.length === 0
  ) {

    return '市町村判定なし';
  }


  return entries
    .map(
      ([city, km]) =>
        city +
        ' ' +
        km.toFixed(2) +
        'km'
    )
    .join(' / ');
}


/*
 * ==========================================
 * ズーム表示切替
 * ==========================================
 */

function updateDisplay() {

  const zoom =
    map.getZoom();


  if (
    zoom >= 13
  ) {


    if (
      municipalityLayer &&
      map.hasLayer(
        municipalityLayer
      )
    ) {

      map.removeLayer(
        municipalityLayer
      );
    }


    if (
      !map.hasLayer(
        routeGroup
      )
    ) {

      routeGroup.addTo(map);
    }


    document.getElementById(
      'status'
    ).textContent =
      '詳細表示：実走路 ｜ 累積 ' +
      totalDistanceKm.toFixed(2) +
      ' km';


  } else {


    if (
      municipalityLayer &&
      !map.hasLayer(
        municipalityLayer
      )
    ) {

      municipalityLayer.addTo(map);
    }


    if (
      map.hasLayer(
        routeGroup
      )
    ) {

      map.removeLayer(
        routeGroup
      );
    }


    document.getElementById(
      'status'
    ).textContent =
      municipalitySummary() +
      ' ｜ 合計 ' +
      totalDistanceKm.toFixed(2) +
      'km';
  }
}


/*
 * ==========================================
 * Runner's Rings 起動
 * ==========================================
 */

async function start() {

  try {

    await loadMunicipalities();

    await loadAllGPX();

    drawMunicipalities();

    updateDisplay();

    map.on(
      'zoomend',
      updateDisplay
    );


  } catch (error) {

    console.error(error);

    document.getElementById(
      'status'
    ).textContent =
      '❌ ' +
      error.message;
  }
}


start();

</script>

</body>
</html>
