<body>

<header>
  <h1>Runner's Rings</h1>
  <p>走った記録ではなく、走った人生を残す。</p>
</header>

<div id="status">
  データを読み込み中…
</div>

<div id="filters">
  <button class="yearButton active">ALL</button>
</div>

<div id="map"></div>

<section id="dashboard">

  <div class="summary">

    <div class="card">
      <div class="label">TOTAL</div>
      <span id="totalDistance" class="value">--</span>
      <span class="unit">km</span>
    </div>

    <div class="card">
      <div class="label">RUNS</div>
      <div id="runCount" class="value">--</div>
    </div>

    <div class="card">
      <div class="label">CITIES</div>
      <div id="cityCount" class="value">--</div>
    </div>

  </div>

  <h2 id="cityHeading">市町村別</h2>

  <div id="cityList">
    <div class="emptyMessage">
      読み込み中…
    </div>
  </div>

</section>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const OWNER = 'atsuoebara';
const REPO = 'tree-age-map';
const BRANCH = 'main';

const CELL_SIZE = 0.0009;

const map = L.map('map').setView(
  [36.39, 139.06],
  9
);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/*
 * 元データ
 */

let geojsonData = null;

const activities = [];

let selectedYear = 'ALL';


/*
 * 表示用Layer
 */

let municipalityLayer = null;

const routeGroup = L.layerGroup();
const ringGroup = L.layerGroup();

const municipalityLayers = {};


/* =========================
   ステータス
========================= */

function setStatus(text) {
  document.getElementById('status').textContent = text;
}


/* =========================
   GitHubからGPX一覧取得
========================= */

async function getGPXFiles() {

  setStatus('GPXファイルを探しています…');

  const apiURL =
    'https://api.github.com/repos/' +
    OWNER + '/' +
    REPO +
    '/contents?ref=' +
    BRANCH;

  const response = await fetch(apiURL, {
    headers: {
      'Accept': 'application/vnd.github+json'
    }
  });

  if (!response.ok) {
    throw new Error(
      'GPX一覧取得失敗 HTTP ' +
      response.status
    );
  }

  const files = await response.json();

  const gpxFiles = files
    .filter(file =>
      file.type === 'file' &&
      file.name.toLowerCase().endsWith('.gpx')
    )
    .map(file => ({
      name: file.name,
      url: file.download_url
    }));

  if (gpxFiles.length === 0) {
    throw new Error('GPXファイルがありません');
  }

  return gpxFiles;
}


/* =========================
   2点間距離
========================= */

function distanceKm(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const toRad = deg =>
    deg * Math.PI / 180;

  const dLat =
    toRad(lat2 - lat1);

  const dLon =
    toRad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) ** 2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* =========================
   市町村判定
========================= */

function pointInRing(point, ring) {

  const x = point[0];
  const y = point[1];

  let inside = false;

  for (
    let i = 0, j = ring.length - 1;
    i < ring.length;
    j = i++
  ) {

    const xi = ring[i][0];
    const yi = ring[i][1];

    const xj = ring[j][0];
    const yj = ring[j][1];

    const intersect =
      ((yi > y) !== (yj > y)) &&
      (
        x <
        (xj - xi) *
        (y - yi) /
        (yj - yi) +
        xi
      );

    if (intersect) {
      inside = !inside;
    }
  }

  return inside;
}


function pointInPolygon(point, polygon) {

  if (!pointInRing(point, polygon[0])) {
    return false;
  }

  for (
    let i = 1;
    i < polygon.length;
    i++
  ) {

    if (pointInRing(point, polygon[i])) {
      return false;
    }
  }

  return true;
}


function pointInFeature(point, feature) {

  const geometry = feature.geometry;

  if (!geometry) {
    return false;
  }

  if (geometry.type === 'Polygon') {

    return pointInPolygon(
      point,
      geometry.coordinates
    );
  }

  if (geometry.type === 'MultiPolygon') {

    return geometry.coordinates.some(
      polygon =>
        pointInPolygon(
          point,
          polygon
        )
    );
  }

  return false;
}


function findMunicipality(lat, lon) {

  const point = [lon, lat];

  for (const feature of geojsonData.features) {

    if (pointInFeature(point, feature)) {

      return (
        feature.properties.N03_004 ||
        '名称不明'
      );
    }
  }

  return null;
}


/* =========================
   100mセル
========================= */

function getCellKey(lat, lon) {

  const latIndex =
    Math.floor(lat / CELL_SIZE);

  const lonIndex =
    Math.floor(lon / CELL_SIZE);

  return latIndex + ',' + lonIndex;
}


function getCellBounds(key) {

  const parts =
    key.split(',');

  const latIndex =
    Number(parts[0]);

  const lonIndex =
    Number(parts[1]);

  const south =
    latIndex * CELL_SIZE;

  const west =
    lonIndex * CELL_SIZE;

  const north =
    south + CELL_SIZE;

  const east =
    west + CELL_SIZE;

  return [
    [south, west],
    [north, east]
  ];
}


function getRingOpacity(count) {

  if (count <= 1) return 0.09;
  if (count === 2) return 0.20;
  if (count <= 4) return 0.36;
  if (count <= 7) return 0.55;

  return 0.75;
}


/* =========================
   市町村面の濃さ
========================= */

function getMunicipalityOpacity(km) {

  if (km <= 0) return 0.03;
  if (km < 5) return 0.15;
  if (km < 10) return 0.30;
  if (km < 20) return 0.45;
  if (km < 30) return 0.60;
  if (km < 50) return 0.72;

  return 0.85;
}


/* =========================
   行政境界読み込み
========================= */

async function loadMunicipalities() {

  setStatus('行政境界を読み込み中…');

  const response = await fetch(
    './N03-20250101_10.geojson'
  );

  if (!response.ok) {
    throw new Error(
      '行政境界データ取得失敗'
    );
  }

  geojsonData =
    await response.json();
}


/* =========================
   GPXの日付取得
========================= */

function getActivityDate(xml) {

  const timeElement =
    xml.getElementsByTagName('time')[0];

  if (!timeElement) {
    return null;
  }

  const date =
    new Date(
      timeElement.textContent
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return null;
  }

  return date;
}


/* =========================
   GPXを活動データへ変換
========================= */

async function loadOneGPX(
  gpxFile
) {

  const response =
    await fetch(
      gpxFile.url
    );

  if (!response.ok) {

    throw new Error(
      gpxFile.name +
      ' 取得失敗 HTTP ' +
      response.status
    );
  }

  const text =
    await response.text();

  const parser =
    new DOMParser();

  const xml =
    parser.parseFromString(
      text,
      'application/xml'
    );

  if (
    xml.querySelector(
      'parsererror'
    )
  ) {

    throw new Error(
      gpxFile.name +
      ' XML解析失敗'
    );
  }


  const activityDate =
    getActivityDate(xml);

  const activityYear =
    activityDate
      ? activityDate.getFullYear()
      : null;


  const points =
    Array.from(
      xml.getElementsByTagName(
        'trkpt'
      )
    );

  const latlngs = [];

  points.forEach(point => {

    const lat =
      parseFloat(
        point.getAttribute('lat')
      );

    const lon =
      parseFloat(
        point.getAttribute('lon')
      );

    if (
      Number.isFinite(lat) &&
      Number.isFinite(lon)
    ) {

      latlngs.push(
        [lat, lon]
      );
    }
  });


  if (
    latlngs.length < 2
  ) {

    throw new Error(
      gpxFile.name +
      ' GPS座標不足'
    );
  }


  let totalKm = 0;

  const cityDistances = {};
  const cities = new Set();
  const cells = new Set();


  /*
   * このランで踏んだセル
   */

  latlngs.forEach(
    ([lat, lon]) => {

      cells.add(
        getCellKey(
          lat,
          lon
        )
      );
    }
  );


  /*
   * 距離＋市町村判定
   */

  for (
    let i = 1;
    i < latlngs.length;
    i++
  ) {

    const prev =
      latlngs[i - 1];

    const current =
      latlngs[i];


    const segmentKm =
      distanceKm(
        prev[0],
        prev[1],
        current[0],
        current[1]
      );

    totalKm +=
      segmentKm;


    const midLat =
      (
        prev[0] +
        current[0]
      ) / 2;

    const midLon =
      (
        prev[1] +
        current[1]
      ) / 2;


    const city =
      findMunicipality(
        midLat,
        midLon
      );


    if (city) {

      if (
        cityDistances[city]
        === undefined
      ) {

        cityDistances[city] = 0;
      }

      cityDistances[city] +=
        segmentKm;

      cities.add(city);
    }
  }


  activities.push({

    name:
      gpxFile.name,

    date:
      activityDate,

    year:
      activityYear,

    distance:
      totalKm,

    latlngs:
      latlngs,

    cityDistances:
      cityDistances,

    cities:
      Array.from(cities),

    cells:
      Array.from(cells)

  });
}


/* =========================
   全GPX読み込み
========================= */

async function loadAllGPX(
  gpxFiles
) {

  for (
    let i = 0;
    i < gpxFiles.length;
    i++
  ) {

    setStatus(
      'GPX ' +
      (i + 1) +
      '/' +
      gpxFiles.length +
      ' 読み込み中'
    );

    await loadOneGPX(
      gpxFiles[i]
    );
  }
}


/* =========================
   年フィルター作成
========================= */

function createYearFilters() {

  const filterArea =
    document.getElementById(
      'filters'
    );

  filterArea.innerHTML = '';


  const years =
    Array.from(
      new Set(
        activities
          .map(activity =>
            activity.year
          )
          .filter(year =>
            year !== null
          )
      )
    )
    .sort(
      (a, b) =>
        b - a
    );


  const options =
    ['ALL', ...years];


  options.forEach(option => {

    const button =
      document.createElement(
        'button'
      );

    button.className =
      'yearButton';


    if (
      String(option) ===
      String(selectedYear)
    ) {

      button.classList.add(
        'active'
      );
    }


    button.textContent =
      option;


    button.addEventListener(
      'click',
      () => {

        selectedYear =
          option;

        document
          .querySelectorAll(
            '.yearButton'
          )
          .forEach(btn => {

            btn.classList.remove(
              'active'
            );
          });


        button.classList.add(
          'active'
        );


        renderSelectedData();
      }
    );


    filterArea.appendChild(
      button
    );
  });
}


/* =========================
   現在選択中の活動
========================= */

function getSelectedActivities() {

  if (
    selectedYear ===
    'ALL'
  ) {

    return activities;
  }


  return activities.filter(
    activity =>
      activity.year ===
      Number(selectedYear)
  );
}


/* =========================
   フィルター後の集計
========================= */

function buildSelectedStats() {

  const selectedActivities =
    getSelectedActivities();


  const municipalityDistance = {};
  const municipalityRunCount = {};
  const ringCells = {};

  let totalDistanceKm = 0;


  selectedActivities.forEach(
    activity => {

      totalDistanceKm +=
        activity.distance;


      /*
       * 市町村別距離
       */

      Object.entries(
        activity.cityDistances
      ).forEach(
        ([city, km]) => {

          if (
            municipalityDistance[city]
            === undefined
          ) {

            municipalityDistance[city] = 0;
          }

          municipalityDistance[city] +=
            km;
        }
      );


      /*
       * 市町村RUNS
       */

      activity.cities.forEach(
        city => {

          if (
            municipalityRunCount[city]
            === undefined
          ) {

            municipalityRunCount[city] = 0;
          }

          municipalityRunCount[city]++;
        }
      );


      /*
       * 年輪セル
       */

      activity.cells.forEach(
        key => {

          if (
            ringCells[key]
            === undefined
          ) {

            ringCells[key] = 0;
          }

          ringCells[key]++;
        }
      );

    }
  );


  return {

    activities:
      selectedActivities,

    municipalityDistance:
      municipalityDistance,

    municipalityRunCount:
      municipalityRunCount,

    ringCells:
      ringCells,

    totalDistanceKm:
      totalDistanceKm

  };
}


/* =========================
   全Layerクリア
========================= */

function clearMapLayers() {

  routeGroup.clearLayers();
  ringGroup.clearLayers();

  if (
    municipalityLayer &&
    map.hasLayer(
      municipalityLayer
    )
  ) {

    map.removeLayer(
      municipalityLayer
    );
  }

  municipalityLayer = null;

  Object.keys(
    municipalityLayers
  ).forEach(key => {

    delete municipalityLayers[key];
  });
}


/* =========================
   年輪セル描画
========================= */

function drawRingCells(
  ringCells
) {

  Object.entries(
    ringCells
  ).forEach(
    ([key, count]) => {

      const bounds =
        getCellBounds(key);


      const rectangle =
        L.rectangle(
          bounds,
          {
            stroke: false,

            fillColor:
              '#20b26b',

            fillOpacity:
              getRingOpacity(count),

            interactive:
              true
          }
        );


      rectangle.bindPopup(

        '<div class="popup-title">' +
        'Runner\'s Ring' +
        '</div>' +

        '<div class="popup-row">' +
        'このエリアを走ったラン：' +
        '<strong>' +
        count +
        ' 回</strong>' +
        '</div>'

      );


      ringGroup.addLayer(
        rectangle
      );
    }
  );
}


/* =========================
   実走路描画
========================= */

function drawRoutes(
  selectedActivities
) {

  selectedActivities.forEach(
    activity => {

      const route =
        L.polyline(
          activity.latlngs,
          {
            color:
              '#20b26b',

            weight:
              3,

            opacity:
              0.72,

            lineCap:
              'round',

            lineJoin:
              'round'
          }
        );


      routeGroup.addLayer(
        route
      );
    }
  );
}


/* =========================
   市町村面描画
========================= */

function drawMunicipalities(
  municipalityDistance,
  municipalityRunCount
) {

  municipalityLayer =
    L.geoJSON(
      geojsonData,
      {

        style: feature => {

          const city =
            feature.properties.N03_004;

          const km =
            municipalityDistance[
              city
            ] || 0;


          return {
            color:
              '#14834f',

            weight:
              1.2,

            fillColor:
              '#20b26b',

            fillOpacity:
              getMunicipalityOpacity(
                km
              )
          };
        },


        onEachFeature:
          (
            feature,
            layer
          ) => {

            const city =
              feature.properties.N03_004 ||
              '名称不明';

            const km =
              municipalityDistance[
                city
              ] || 0;

            const runs =
              municipalityRunCount[
                city
              ] || 0;


            municipalityLayers[
              city
            ] = layer;


            layer.bindPopup(

              '<div class="popup-title">' +
              city +
              '</div>' +

              '<div class="popup-row">' +
              '累積走行距離：' +
              '<strong>' +
              km.toFixed(2) +
              ' km</strong>' +
              '</div>' +

              '<div class="popup-row">' +
              '走ったラン：' +
              '<strong>' +
              runs +
              ' 回</strong>' +
              '</div>'

            );
          }

      }
    );
}


/* =========================
   市町村カード → 地図
========================= */

function focusMunicipality(
  city
) {

  const layer =
    municipalityLayers[
      city
    ];

  if (!layer) {
    return;
  }


  if (
    municipalityLayer &&
    !map.hasLayer(
      municipalityLayer
    )
  ) {

    municipalityLayer.addTo(
      map
    );
  }


  if (
    map.hasLayer(
      routeGroup
    )
  ) {

    map.removeLayer(
      routeGroup
    );
  }


  if (
    map.hasLayer(
      ringGroup
    )
  ) {

    map.removeLayer(
      ringGroup
    );
  }


  map.fitBounds(
    layer.getBounds(),
    {
      padding:
        [25, 25],

      maxZoom:
        11
    }
  );


  document
    .getElementById('map')
    .scrollIntoView({
      behavior:
        'smooth',

      block:
        'start'
    });


  setTimeout(
    () => {

      layer.openPopup();

    },
    500
  );
}


/* =========================
   ダッシュボード更新
========================= */

function updateDashboard(
  stats
) {

  const entries =
    Object.entries(
      stats.municipalityDistance
    )
    .filter(
      ([, km]) =>
        km > 0.01
    )
    .sort(
      (a, b) =>
        b[1] - a[1]
    );


  document.getElementById(
    'totalDistance'
  ).textContent =
    stats.totalDistanceKm
      .toFixed(1);


  document.getElementById(
    'runCount'
  ).textContent =
    stats.activities.length;


  document.getElementById(
    'cityCount'
  ).textContent =
    entries.length;


  document.getElementById(
    'cityHeading'
  ).textContent =
    selectedYear === 'ALL'
      ? '市町村別'
      : selectedYear +
        '年 市町村別';


  const cityList =
    document.getElementById(
      'cityList'
    );


  cityList.innerHTML = '';


  if (
    entries.length === 0
  ) {

    cityList.innerHTML =
      '<div class="emptyMessage">' +
      'この期間の市町村データがありません' +
      '</div>';

    return;
  }


  const maxKm =
    entries[0][1];


  entries.forEach(
    ([city, km]) => {

      const percent =
        Math.max(
          3,
          (km / maxKm) *
          100
        );


      const runs =
        stats
          .municipalityRunCount[
            city
          ] || 0;


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'cityCard';


      card.innerHTML =

        '<div class="cityTop">' +

          '<div class="cityName">' +
            city +
          '</div>' +

          '<div class="cityDistance">' +
            km.toFixed(2) +
            ' km' +
          '</div>' +

        '</div>' +

        '<div class="barTrack">' +

          '<div class="barFill" style="width:' +
            percent +
            '%"></div>' +

        '</div>' +

        '<div class="cityRuns">' +
          'RUNS ' +
          runs +
        '</div>';


      card.addEventListener(
        'click',
        () => {

          focusMunicipality(
            city
          );
        }
      );


      cityList.appendChild(
        card
      );
    }
  );
}


/* =========================
   ズーム表示切替
========================= */

function updateDisplay() {

  const zoom =
    map.getZoom();


  if (
    zoom >= 13
  ) {

    if (
      municipalityLayer &&
      map.hasLayer(
        municipalityLayer
      )
    ) {

      map.removeLayer(
        municipalityLayer
      );
    }


    if (
      !map.hasLayer(
        ringGroup
      )
    ) {

      ringGroup.addTo(
        map
      );
    }


    if (
      !map.hasLayer(
        routeGroup
      )
    ) {

      routeGroup.addTo(
        map
      );
    }


    setStatus(

      selectedYear === 'ALL'
        ? '詳細表示：実走路＋Runner\'s Rings'
        : selectedYear +
          '年：実走路＋Runner\'s Rings'

    );


  } else {

    if (
      municipalityLayer &&
      !map.hasLayer(
        municipalityLayer
      )
    ) {

      municipalityLayer.addTo(
        map
      );
    }


    if (
      map.hasLayer(
        routeGroup
      )
    ) {

      map.removeLayer(
        routeGroup
      );
    }


    if (
      map.hasLayer(
        ringGroup
      )
    ) {

      map.removeLayer(
        ringGroup
      );
    }


    setStatus(

      selectedYear === 'ALL'
        ? '広域表示：累積走行距離を面で表示'
        : selectedYear +
          '年：走行距離を面で表示'

    );
  }
}


/* =========================
   選択年を再描画
========================= */

function renderSelectedData() {

  const stats =
    buildSelectedStats();


  clearMapLayers();


  drawRoutes(
    stats.activities
  );


  drawRingCells(
    stats.ringCells
  );


  drawMunicipalities(
    stats.municipalityDistance,
    stats.municipalityRunCount
  );


  updateDashboard(
    stats
  );


  updateDisplay();
}


/* =========================
   起動
========================= */

async function start() {

  try {

    await loadMunicipalities();


    const gpxFiles =
      await getGPXFiles();


    await loadAllGPX(
      gpxFiles
    );


    /*
     * GPXから年を自動生成
     */

    createYearFilters();


    /*
     * 初回はALL
     */

    renderSelectedData();


    /*
     * 最初だけ群馬全体へ
     */

    if (
      municipalityLayer
    ) {

      map.fitBounds(
        municipalityLayer
          .getBounds()
      );
    }


    map.on(
      'zoomend',
      updateDisplay
    );


    setTimeout(
      () => {

        map.invalidateSize();

      },
      300
    );


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      '❌ ' +
      error.message
    );
  }
}


start();

</script>
