<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner's Rings GPX Test</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    header {
      background: #0f1d2f;
      color: white;
      padding: 12px 16px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    #status {
      background: #17283d;
      color: white;
      padding: 8px 14px;
      font-size: 13px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 86px);
    }
  </style>
</head>

<body>

<header>
  <h1>Runner's Rings</h1>
</header>

<div id="status">
  GPXを読み込み中…
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  const map = L.map('map').setView([36.4, 139.05], 12);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  async function loadGPX() {

    try {

      const response = await fetch('./run1.gpx');

      if (!response.ok) {
        throw new Error(
          'GPX取得失敗 HTTP ' + response.status
        );
      }

      const text = await response.text();

      const parser = new DOMParser();

      const xml = parser.parseFromString(
        text,
        'application/xml'
      );

      const parserError =
        xml.querySelector('parsererror');

      if (parserError) {
        throw new Error('GPXのXML解析に失敗');
      }

      const points = Array.from(
        xml.getElementsByTagName('trkpt')
      );

      if (points.length === 0) {
        throw new Error(
          'GPX内にtrkptがありません'
        );
      }

      const latlngs = [];

      points.forEach(point => {

        const lat =
          parseFloat(
            point.getAttribute('lat')
          );

        const lon =
          parseFloat(
            point.getAttribute('lon')
          );

        if (
          Number.isFinite(lat) &&
          Number.isFinite(lon)
        ) {
          latlngs.push([lat, lon]);
        }

      });


      if (latlngs.length === 0) {
        throw new Error(
          '有効なGPS座標がありません'
        );
      }


      const route = L.polyline(
        latlngs,
        {
          color: '#ff3b30',
          weight: 5,
          opacity: 1
        }
      ).addTo(map);


      map.fitBounds(
        route.getBounds(),
        {
          padding: [20, 20]
        }
      );


      document.getElementById(
        'status'
      ).textContent =
        '✅ GPX読み込み成功：' +
        latlngs.length +
        'ポイント';


    } catch (error) {

      console.error(error);

      document.getElementById(
        'status'
      ).textContent =
        '❌ ' + error.message;

    }

  }


  loadGPX();

</script>

</body>
</html>
