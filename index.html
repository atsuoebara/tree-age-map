<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner's Rings</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1422;
    }

    header {
      background: #0f1d2f;
      color: white;
      padding: 12px 16px;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.75;
    }

    #status {
      background: #17283d;
      color: #dce8f5;
      padding: 8px 14px;
      font-size: 13px;
      box-sizing: border-box;
    }

    #map {
      width: 100%;
      height: calc(100vh - 91px);
    }
  </style>
</head>

<body>

<header>
  <h1>Runner's Rings</h1>
  <p>走った記録ではなく、走った人生を残す。</p>
</header>

<div id="status">
  データを読み込み中…
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>

  const map = L.map('map').setView([36.39, 139.06], 9);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  /*
   * 仮の累積走行距離
   */

  const runningDistance = {
    '前橋市': 1200,
    '高崎市': 350,
    '吉岡町': 350,
    '渋川市': 120,
    '伊勢崎市': 60
  };


  function getDistance(name) {
    return runningDistance[name] || 0;
  }


  function getOpacity(km) {

    if (km === 0) return 0.05;
    if (km < 50) return 0.15;
    if (km < 100) return 0.25;
    if (km < 250) return 0.40;
    if (km < 500) return 0.55;
    if (km < 1000) return 0.70;

    return 0.85;
  }


  /*
   * 市町村境界
   */

  fetch('./N03-20250101_10.geojson')

    .then(response => {

      if (!response.ok) {
        throw new Error('GeoJSON読み込み失敗');
      }

      return response.json();

    })

    .then(data => {

      const municipalityLayer = L.geoJSON(data, {

        style: feature => {

          const city = feature.properties.N03_004;
          const km = getDistance(city);

          return {
            color: '#14834f',
            weight: 1.2,
            fillColor: '#20b26b',
            fillOpacity: getOpacity(km)
          };

        },

        onEachFeature: (feature, layer) => {

          const prefecture =
            feature.properties.N03_001 || '群馬県';

          const city =
            feature.properties.N03_004 || '名称不明';

          const km = getDistance(city);

          layer.bindPopup(
            '<strong>' +
            prefecture +
            ' ' +
            city +
            '</strong><br>' +
            '累積走行距離：' +
            km.toLocaleString() +
            ' km'
          );

        }

      }).addTo(map);

      map.fitBounds(municipalityLayer.getBounds());

    })

    .catch(error => {

      console.error('GeoJSON ERROR:', error);

    });


  /*
   * 本物のGPXを読み込む
   */

  const gpx = new L.GPX(
    './午後のランニング.gpx',
    {
      async: true,

      polyline_options: {
        color: '#ff3b30',
        weight: 5,
        opacity: 1
      },

      marker_options: {
        startIconUrl: null,
        endIconUrl: null,
        shadowUrl: null
      }
    }
  );


  /*
   * GPX読み込み成功
   */

  gpx.on('loaded', function(e) {

    document.getElementById('status').textContent =
      '✅ GPX読み込み成功：実際の走路を表示中';

    map.fitBounds(e.target.getBounds());

  });


  /*
   * GPX読み込み失敗
   */

  gpx.on('error', function(e) {

    console.error('GPX ERROR:', e);

    document.getElementById('status').textContent =
      '❌ GPX読み込み失敗';

  });


  /*
   * GPXを常時表示
   */

  gpx.addTo(map);

</script>

</body>
</html>
