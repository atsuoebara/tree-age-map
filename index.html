<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner's Rings</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1422;
    }

    header {
      background: #0f1d2f;
      color: white;
      padding: 12px 16px;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.75;
    }

    #status {
      background: #17283d;
      color: #dce8f5;
      padding: 8px 14px;
      font-size: 13px;
      box-sizing: border-box;
    }

    #map {
      width: 100%;
      height: calc(100vh - 91px);
    }
  </style>
</head>

<body>

<header>
  <h1>Runner's Rings</h1>
  <p>走った記録ではなく、走った人生を残す。</p>
</header>

<div id="status">
  データを読み込み中...
</div>

<div id="map"></div>

<!-- Leaflet本体を先に読み込む -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- その後でGPXライブラリを読み込む -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>

  const map = L.map('map').setView([36.39, 139.06], 9);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  /*
   * ========================================
   * 仮の累積走行距離
   * ========================================
   *
   * 現在は表示テスト用。
   * 将来はGPX/Strava/Garminから自動集計する。
   *
   * 面積補正はしない。
   * 前橋100kmも吉岡100kmも同じ価値。
   */

  const runningDistance = {
    '前橋市': 1200,
    '高崎市': 350,
    '吉岡町': 350,
    '渋川市': 120,
    '伊勢崎市': 60
  };


  function getDistance(name) {
    return runningDistance[name] || 0;
  }


  /*
   * 距離から面の濃さを決める
   */

  function getOpacity(km) {

    if (km === 0) return 0.05;
    if (km < 50) return 0.15;
    if (km < 100) return 0.25;
    if (km < 250) return 0.40;
    if (km < 500) return 0.55;
    if (km < 1000) return 0.70;

    return 0.85;
  }


  let municipalityLayer = null;
  let gpxLayer = null;


  /*
   * ========================================
   * 群馬県行政境界
   * ========================================
   */

  fetch('./N03-20250101_10.geojson')

    .then(response => {

      if (!response.ok) {
        throw new Error('GeoJSONを読み込めませんでした');
      }

      return response.json();

    })

    .then(data => {

      municipalityLayer = L.geoJSON(data, {

        style: feature => {

          const name = feature.properties.N03_004;
          const km = getDistance(name);

          return {
            color: '#14834f',
            weight: 1.2,
            fillColor: '#20b26b',
            fillOpacity: getOpacity(km)
          };

        },


        onEachFeature: (feature, layer) => {

          const prefecture =
            feature.properties.N03_001 || '群馬県';

          const city =
            feature.properties.N03_004 || '名称不明';

          const km = getDistance(city);


          layer.bindPopup(
            '<strong>' +
            prefecture +
            ' ' +
            city +
            '</strong><br>' +
            '累積走行距離：' +
            km.toLocaleString() +
            ' km'
          );

        }

      }).addTo(map);


      map.fitBounds(municipalityLayer.getBounds());

      updateDisplay();

    })

    .catch(error => {

      console.error(error);

      document.getElementById('status').textContent =
        '行政境界データの読み込みに失敗しました';

    });


  /*
   * ========================================
   * 実際のGPX走路
   * ========================================
   */

  gpxLayer = new L.GPX(
    './午後のランニング.gpx',
    {
      async: true,

      polyline_options: {
        color: '#ff3b30',
        weight: 5,
        opacity: 0.9
      },

      marker_options: {
        startIconUrl: null,
        endIconUrl: null,
        shadowUrl: null
      }
    }
  );


  gpxLayer.on('loaded', function(e) {

    console.log(
      'GPX読み込み成功',
      e.target.get_distance()
    );

    updateDisplay();

  });


  gpxLayer.on('error', function(error) {

    console.error(
      'GPX読み込み失敗',
      error
    );

    document.getElementById('status').textContent =
      'GPXデータの読み込みに失敗しました';

  });


  /*
   * ========================================
   * ズームによる表示切替
   * ========================================
   *
   * 広域
   *   ↓
   * 市町村の面
   *
   * 拡大
   *   ↓
   * 実際のGPS走路
   */

  function updateDisplay() {

    const zoom = map.getZoom();


    /*
     * 詳細表示
     */

    if (zoom >= 13) {

      if (
        municipalityLayer &&
        map.hasLayer(municipalityLayer)
      ) {
        map.removeLayer(municipalityLayer);
      }


      if (
        gpxLayer &&
        !map.hasLayer(gpxLayer)
      ) {
        gpxLayer.addTo(map);
      }


      document.getElementById('status').textContent =
        '詳細表示：実際の走路';


    /*
     * 広域表示
     */

    } else {

      if (
        municipalityLayer &&
        !map.hasLayer(municipalityLayer)
      ) {
        municipalityLayer.addTo(map);
      }


      if (
        gpxLayer &&
        map.hasLayer(gpxLayer)
      ) {
        map.removeLayer(gpxLayer);
      }


      document.getElementById('status').textContent =
        '広域表示：累積走行距離を面の濃淡で表示';

    }

  }


  map.on(
    'zoomend',
    updateDisplay
  );


  /*
   * GPXデータを読み込み開始
   *
   * 最初は地図へ追加しない。
   * ズーム13以上になった時だけ表示する。
   */

  gpxLayer.addTo(map);

  gpxLayer.once(
    'loaded',
    function() {

      if (map.getZoom() < 13) {
        map.removeLayer(gpxLayer);
      }

    }
  );

</script>

</body>
</html>
