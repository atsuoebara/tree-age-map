<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner's Rings</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1422;
    }

    header {
      background: #0f1d2f;
      color: white;
      padding: 12px 16px;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.75;
    }

    #status {
      background: #17283d;
      color: #dce8f5;
      padding: 8px 14px;
      font-size: 13px;
      box-sizing: border-box;
    }

    #map {
      width: 100%;
      height: calc(100vh - 91px);
    }
  </style>
</head>

<body>

<header>
  <h1>Runner's Rings</h1>
  <p>走った記録ではなく、走った人生を残す。</p>
</header>

<div id="status">
  市町村ごとの縄張りを表示
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([36.39, 139.06], 9);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  /*
   * Runner's Rings 仮走行データ
   *
   * 今は動作確認用。
   * 将来はStrava/GarminのGPSデータから
   * 自動計算する。
   */

  const runningCounts = {
    '前橋市': 120,
    '高崎市': 70,
    '吉岡町': 95,
    '渋川市': 45,
    '伊勢崎市': 30
  };


  function getCount(name) {
    return runningCounts[name] || 0;
  }


  function getOpacity(count) {

    if (count === 0) return 0.05;
    if (count < 20) return 0.20;
    if (count < 50) return 0.35;
    if (count < 80) return 0.50;
    if (count < 110) return 0.65;

    return 0.80;
  }


  let municipalityLayer;


  /*
   * 国土数値情報
   * 群馬県 行政区域GeoJSONを読み込む
   */

  fetch('./N03-20250101_10.geojson')

    .then(response => {

      if (!response.ok) {
        throw new Error('GeoJSONを読み込めませんでした');
      }

      return response.json();

    })

    .then(data => {

      municipalityLayer = L.geoJSON(data, {

        style: feature => {

          /*
           * 国土数値情報 N03
           * N03_004 = 市区町村名
           */

          const name = feature.properties.N03_004;
          const count = getCount(name);

          return {
            color: '#14834f',
            weight: 1.2,
            fillColor: '#20b26b',
            fillOpacity: getOpacity(count)
          };

        },


        onEachFeature: (feature, layer) => {

          const prefecture =
            feature.properties.N03_001 || '群馬県';

          const city =
            feature.properties.N03_004 || '名称不明';

          const count = getCount(city);


          layer.bindPopup(
            '<strong>' +
            prefecture +
            ' ' +
            city +
            '</strong><br>' +
            '走行回数：' +
            count +
            '回'
          );

        }

      }).addTo(map);


      /*
       * GeoJSONの範囲に地図を合わせる
       */

      map.fitBounds(municipalityLayer.getBounds());

      document.getElementById('status').textContent =
        '群馬県：市町村ごとの縄張りを表示';

    })

    .catch(error => {

      console.error(error);

      document.getElementById('status').textContent =
        '行政境界データの読み込みに失敗しました';

    });


  /*
   * 仮のGPS走路
   *
   * 将来は実際のランニングGPSに置き換える。
   */

  const route = L.polyline(
    [
      [36.3912, 139.0609],
      [36.4000, 139.0500],
      [36.4100, 139.0450],
      [36.4200, 139.0550],
      [36.4300, 139.0700],
      [36.4400, 139.0800]
    ],
    {
      color: '#ff4d4d',
      weight: 5
    }
  );


  /*
   * ズームによる表示切替
   *
   * 広域：行政区域の「面」
   * 詳細：GPS走路
   */

  function updateDisplay() {

    const zoom = map.getZoom();


    if (zoom >= 13) {

      if (
        municipalityLayer &&
        map.hasLayer(municipalityLayer)
      ) {
        map.removeLayer(municipalityLayer);
      }


      if (!map.hasLayer(route)) {
        route.addTo(map);
      }


      document.getElementById('status').textContent =
        '詳細表示：走路を表示';


    } else {

      if (
        municipalityLayer &&
        !map.hasLayer(municipalityLayer)
      ) {
        municipalityLayer.addTo(map);
      }


      if (map.hasLayer(route)) {
        map.removeLayer(route);
      }


      document.getElementById('status').textContent =
        '広域表示：市町村を「面」の濃淡で表示';

    }

  }


  map.on('zoomend', updateDisplay);

</script>

</body>
</html>
