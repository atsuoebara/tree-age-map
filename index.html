<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./runner_rings_archive.js"></script>

<script>

const OWNER = 'atsuoebara';
const REPO = 'tree-age-map';
const BRANCH = 'main';

const CELL_SIZE = 0.0009;

const AREA_COLOR = '#ff2bd6';
const BORDER_COLOR = '#707580';
const ROUTE_COLOR = '#ff3b30';


const map = L.map('map').setView(
  [36.39, 139.06],
  9
);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);


let geojsonData = null;

const municipalityFeatures = [];
const activities = [];

let selectedYear = 'ALL';

let municipalityLayer = null;

const routeGroup = L.layerGroup();
const ringGroup = L.layerGroup();

const municipalityLayers = {};


function setStatus(text) {
  document.getElementById('status').textContent = text;
}


function distanceKm(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const toRad =
    deg => deg * Math.PI / 180;

  const dLat =
    toRad(lat2 - lat1);

  const dLon =
    toRad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) ** 2;

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );
}


function pointInRing(point, ring) {

  const x = point[0];
  const y = point[1];

  let inside = false;

  for (
    let i = 0, j = ring.length - 1;
    i < ring.length;
    j = i++
  ) {

    const xi = ring[i][0];
    const yi = ring[i][1];

    const xj = ring[j][0];
    const yj = ring[j][1];

    const intersect =
      ((yi > y) !== (yj > y)) &&
      (
        x <
        (xj - xi) *
        (y - yi) /
        (yj - yi) +
        xi
      );

    if (intersect) {
      inside = !inside;
    }
  }

  return inside;
}


function pointInPolygon(point, polygon) {

  if (!pointInRing(point, polygon[0])) {
    return false;
  }

  for (
    let i = 1;
    i < polygon.length;
    i++
  ) {

    if (pointInRing(point, polygon[i])) {
      return false;
    }
  }

  return true;
}


function pointInFeature(point, feature) {

  const geometry =
    feature.geometry;

  if (!geometry) {
    return false;
  }

  if (geometry.type === 'Polygon') {

    return pointInPolygon(
      point,
      geometry.coordinates
    );
  }

  if (geometry.type === 'MultiPolygon') {

    return geometry.coordinates.some(
      polygon =>
        pointInPolygon(
          point,
          polygon
        )
    );
  }

  return false;
}


function collectCoordinates(coords, output) {

  if (
    typeof coords[0] === 'number'
  ) {

    output.push(coords);
    return;
  }

  coords.forEach(
    child =>
      collectCoordinates(
        child,
        output
      )
  );
}


function getFeatureBBox(feature) {

  const points = [];

  collectCoordinates(
    feature.geometry.coordinates,
    points
  );

  let minLon = Infinity;
  let minLat = Infinity;
  let maxLon = -Infinity;
  let maxLat = -Infinity;

  points.forEach(
    ([lon, lat]) => {

      minLon =
        Math.min(minLon, lon);

      minLat =
        Math.min(minLat, lat);

      maxLon =
        Math.max(maxLon, lon);

      maxLat =
        Math.max(maxLat, lat);
    }
  );

  return {
    minLon,
    minLat,
    maxLon,
    maxLat
  };
}


function findMunicipality(lat, lon) {

  const point =
    [lon, lat];

  for (
    const item of municipalityFeatures
  ) {

    const b =
      item.bbox;

    if (
      lon < b.minLon ||
      lon > b.maxLon ||
      lat < b.minLat ||
      lat > b.maxLat
    ) {
      continue;
    }

    if (
      pointInFeature(
        point,
        item.feature
      )
    ) {

      return (
        item.feature.properties.N03_004 ||
        '名称不明'
      );
    }
  }

  return null;
}


function getCellKey(lat, lon) {

  const latIndex =
    Math.floor(
      lat / CELL_SIZE
    );

  const lonIndex =
    Math.floor(
      lon / CELL_SIZE
    );

  return (
    latIndex +
    ',' +
    lonIndex
  );
}


function getCellBounds(key) {

  const [
    latIndex,
    lonIndex
  ] =
    key
      .split(',')
      .map(Number);

  const south =
    latIndex *
    CELL_SIZE;

  const west =
    lonIndex *
    CELL_SIZE;

  return [
    [south, west],
    [
      south + CELL_SIZE,
      west + CELL_SIZE
    ]
  ];
}


function getRingOpacity(count) {

  if (count <= 1)
    return 0.05;

  if (count === 2)
    return 0.11;

  if (count <= 4)
    return 0.20;

  if (count <= 7)
    return 0.30;

  if (count <= 15)
    return 0.42;

  return 0.56;
}


function buildCellsFromRoute(latlngs) {

  const cells =
    new Set();

  if (!latlngs.length) {
    return cells;
  }

  cells.add(
    getCellKey(
      latlngs[0][0],
      latlngs[0][1]
    )
  );

  for (
    let i = 1;
    i < latlngs.length;
    i++
  ) {

    const a =
      latlngs[i - 1];

    const b =
      latlngs[i];

    const km =
      distanceKm(
        a[0],
        a[1],
        b[0],
        b[1]
      );

    const steps =
      Math.max(
        1,
        Math.ceil(
          km / 0.04
        )
      );

    for (
      let s = 0;
      s <= steps;
      s++
    ) {

      const t =
        s / steps;

      const lat =
        a[0] +
        (b[0] - a[0]) *
        t;

      const lon =
        a[1] +
        (b[1] - a[1]) *
        t;

      cells.add(
        getCellKey(
          lat,
          lon
        )
      );
    }
  }

  return cells;
}


function getMunicipalityOpacity(km) {

  if (km <= 0)
    return 0;

  if (km < 5)
    return 0.04;

  if (km < 10)
    return 0.08;

  if (km < 20)
    return 0.14;

  if (km < 30)
    return 0.22;

  if (km < 50)
    return 0.30;

  if (km < 100)
    return 0.40;

  if (km < 200)
    return 0.50;

  if (km < 400)
    return 0.60;

  return 0.70;
}


async function loadMunicipalities() {

  setStatus(
    '行政境界を読み込み中…'
  );

  const response =
    await fetch(
      './N03-20250101_10.geojson'
    );

  if (!response.ok) {

    throw new Error(
      '行政境界データ取得失敗'
    );
  }

  geojsonData =
    await response.json();

  municipalityFeatures.length = 0;

  geojsonData.features.forEach(
    feature => {

      municipalityFeatures.push({

        feature,

        bbox:
          getFeatureBBox(
            feature
          )
      });
    }
  );
}


function analyseRoute(
  latlngs,
  targetDistanceKm = null
) {

  const cityDistances = {};
  const cities = new Set();

  let calculatedKm = 0;

  for (
    let i = 1;
    i < latlngs.length;
    i++
  ) {

    const prev =
      latlngs[i - 1];

    const current =
      latlngs[i];

    const segmentKm =
      distanceKm(
        prev[0],
        prev[1],
        current[0],
        current[1]
      );

    calculatedKm +=
      segmentKm;

    const midLat =
      (
        prev[0] +
        current[0]
      ) / 2;

    const midLon =
      (
        prev[1] +
        current[1]
      ) / 2;

    const city =
      findMunicipality(
        midLat,
        midLon
      );

    if (city) {

      cityDistances[city] =
        (
          cityDistances[city] ||
          0
        ) +
        segmentKm;

      cities.add(city);
    }
  }

  if (
    targetDistanceKm &&
    calculatedKm > 0
  ) {

    const scale =
      targetDistanceKm /
      calculatedKm;

    Object.keys(
      cityDistances
    ).forEach(
      city => {

        cityDistances[city] *=
          scale;
      }
    );
  }

  return {

    cityDistances,

    cities:
      Array.from(cities),

    calculatedKm
  };
}


function loadArchiveActivities() {

  const archive =
    window.RUNNERS_RINGS_ARCHIVE;

  if (
    !Array.isArray(archive)
  ) {

    console.warn(
      'runner_rings_archive.js が読み込めません'
    );

    return 0;
  }

  let loaded = 0;

  archive.forEach(
    run => {

      if (
        !Array.isArray(run.route) ||
        run.route.length < 2
      ) {
        return;
      }

      const latlngs =
        run.route
          .map(
            point => [
              Number(point[0]),
              Number(point[1])
            ]
          )
          .filter(
            point =>
              Number.isFinite(point[0]) &&
              Number.isFinite(point[1])
          );

      if (
        latlngs.length < 2
      ) {
        return;
      }

      const storedDistance =
        Number(
          run.distance_km
        );

      const analysis =
        analyseRoute(
          latlngs,
          Number.isFinite(
            storedDistance
          )
            ? storedDistance
            : null
        );

      const cells =
        buildCellsFromRoute(
          latlngs
        );

      const date =
        run.date
          ? new Date(
              run.date +
              'T12:00:00'
            )
          : null;

      const year =
        Number(run.year) ||
        (
          date &&
          !Number.isNaN(
            date.getTime()
          )
            ? date.getFullYear()
            : null
        );

      activities.push({

        source:
          'archive',

        id:
          run.id,

        name:
          run.name ||
          '過去ラン',

        date,

        year,

        distance:
          Number.isFinite(
            storedDistance
          )
            ? storedDistance
            : analysis.calculatedKm,

        latlngs,

        cityDistances:
          analysis.cityDistances,

        cities:
          analysis.cities,

        cells:
          Array.from(cells)

      });

      loaded++;
    }
  );

  return loaded;
}


async function getGPXFiles() {

  setStatus(
    '現在のGPXを探しています…'
  );

  const apiURL =
    'https://api.github.com/repos/' +
    OWNER +
    '/' +
    REPO +
    '/contents?ref=' +
    BRANCH;

  const response =
    await fetch(
      apiURL,
      {
        headers: {
          'Accept':
            'application/vnd.github+json'
        }
      }
    );

  if (!response.ok) {

    throw new Error(
      'GPX一覧取得失敗 HTTP ' +
      response.status
    );
  }

  const files =
    await response.json();

  return files
    .filter(
      file =>
        file.type === 'file' &&
        file.name
          .toLowerCase()
          .endsWith('.gpx')
    )
    .map(
      file => ({
        name:
          file.name,

        url:
          file.download_url
      })
    );
}


function getActivityDate(xml) {

  const metadataTime =
    xml.querySelector(
      'metadata > time'
    );

  const trackTime =
    xml.querySelector(
      'trkpt > time'
    );

  const element =
    metadataTime ||
    trackTime;

  if (!element) {
    return null;
  }

  const date =
    new Date(
      element.textContent
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return null;
  }

  return date;
}


async function loadOneGPX(
  gpxFile
) {

  const response =
    await fetch(
      gpxFile.url
    );

  if (!response.ok) {

    throw new Error(
      gpxFile.name +
      ' 取得失敗 HTTP ' +
      response.status
    );
  }

  const text =
    await response.text();

  const xml =
    new DOMParser()
      .parseFromString(
        text,
        'application/xml'
      );

  if (
    xml.querySelector(
      'parsererror'
    )
  ) {

    throw new Error(
      gpxFile.name +
      ' XML解析失敗'
    );
  }

  const date =
    getActivityDate(
      xml
    );

  const year =
    date
      ? date.getFullYear()
      : null;

  const points =
    Array.from(
      xml.getElementsByTagName(
        'trkpt'
      )
    );

  const latlngs =
    points
      .map(
        point => [
          parseFloat(
            point.getAttribute(
              'lat'
            )
          ),
          parseFloat(
            point.getAttribute(
              'lon'
            )
          )
        ]
      )
      .filter(
        point =>
          Number.isFinite(point[0]) &&
          Number.isFinite(point[1])
      );

  if (
    latlngs.length < 2
  ) {

    throw new Error(
      gpxFile.name +
      ' GPS座標不足'
    );
  }

  const analysis =
    analyseRoute(
      latlngs
    );

  const cells =
    buildCellsFromRoute(
      latlngs
    );

  activities.push({

    source:
      'gpx',

    name:
      gpxFile.name,

    date,

    year,

    distance:
      analysis.calculatedKm,

    latlngs,

    cityDistances:
      analysis.cityDistances,

    cities:
      analysis.cities,

    cells:
      Array.from(cells)

  });
}


async function loadAllGPX(
  gpxFiles
) {

  for (
    let i = 0;
    i < gpxFiles.length;
    i++
  ) {

    setStatus(
      '現在GPX ' +
      (i + 1) +
      '/' +
      gpxFiles.length +
      ' 読み込み中…'
    );

    await loadOneGPX(
      gpxFiles[i]
    );
  }
}


function createYearFilters() {

  const area =
    document.getElementById(
      'filters'
    );

  area.innerHTML = '';

  const years =
    Array.from(
      new Set(
        activities
          .map(
            activity =>
              activity.year
          )
          .filter(
            year =>
              Number.isFinite(year)
          )
      )
    )
    .sort(
      (a, b) =>
        b - a
    );

  const options =
    ['ALL', ...years];

  options.forEach(
    option => {

      const button =
        document.createElement(
          'button'
        );

      button.className =
        'yearButton';

      button.textContent =
        option;

      if (
        String(option) ===
        String(selectedYear)
      ) {

        button.classList.add(
          'active'
        );
      }

      button.addEventListener(
        'click',
        () => {

          selectedYear =
            option;

          document
            .querySelectorAll(
              '.yearButton'
            )
            .forEach(
              btn =>
                btn.classList.remove(
                  'active'
                )
            );

          button.classList.add(
            'active'
          );

          renderSelectedData();
        }
      );

      area.appendChild(
        button
      );
    }
  );
}


function getSelectedActivities() {

  if (
    selectedYear === 'ALL'
  ) {

    return activities;
  }

  return activities.filter(
    activity =>
      activity.year ===
      Number(selectedYear)
  );
}


function buildSelectedStats() {

  const selected =
    getSelectedActivities();

  const municipalityDistance = {};
  const municipalityRunCount = {};
  const ringCells = {};

  let totalDistanceKm = 0;

  selected.forEach(
    activity => {

      totalDistanceKm +=
        activity.distance;

      Object.entries(
        activity.cityDistances
      ).forEach(
        ([city, km]) => {

          municipalityDistance[city] =
            (
              municipalityDistance[city] ||
              0
            ) +
            km;
        }
      );

      activity.cities.forEach(
        city => {

          municipalityRunCount[city] =
            (
              municipalityRunCount[city] ||
              0
            ) +
            1;
        }
      );

      activity.cells.forEach(
        key => {

          ringCells[key] =
            (
              ringCells[key] ||
              0
            ) +
            1;
        }
      );
    }
  );

  return {

    activities:
      selected,

    municipalityDistance,

    municipalityRunCount,

    ringCells,

    totalDistanceKm
  };
}


function clearMapLayers() {

  routeGroup.clearLayers();
  ringGroup.clearLayers();

  if (
    municipalityLayer &&
    map.hasLayer(
      municipalityLayer
    )
  ) {

    map.removeLayer(
      municipalityLayer
    );
  }

  municipalityLayer =
    null;

  Object.keys(
    municipalityLayers
  ).forEach(
    key =>
      delete municipalityLayers[
        key
      ]
  );
}


/* =========================
   実走線
   今回ここを弱く調整
========================= */

function drawRoutes(
  selectedActivities
) {

  selectedActivities.forEach(
    activity => {

      const route =
        L.polyline(
          activity.latlngs,
          {
            color:
              ROUTE_COLOR,

            weight:
              2,

            opacity:
              0.45,

            lineCap:
              'round',

            lineJoin:
              'round'
          }
        );

      routeGroup.addLayer(
        route
      );
    }
  );
}


function drawRingCells(
  ringCells
) {

  Object.entries(
    ringCells
  ).forEach(
    ([key, count]) => {

      const rectangle =
        L.rectangle(
          getCellBounds(
            key
          ),
          {
            stroke:
              false,

            fillColor:
              AREA_COLOR,

            fillOpacity:
              getRingOpacity(
                count
              ),

            interactive:
              true
          }
        );

      rectangle.bindPopup(

        '<div class="popup-title">' +
        'Runner\'s Ring' +
        '</div>' +

        '<div class="popup-row">' +
        'このエリアを走ったラン：' +
        '<strong>' +
        count +
        ' 回</strong>' +
        '</div>'
      );

      ringGroup.addLayer(
        rectangle
      );
    }
  );
}


function drawMunicipalities(
  municipalityDistance,
  municipalityRunCount
) {

  municipalityLayer =
    L.geoJSON(
      geojsonData,
      {

        style:
          feature => {

            const city =
              feature
                .properties
                .N03_004;

            const km =
              municipalityDistance[
                city
              ] || 0;

            return {

              color:
                BORDER_COLOR,

              weight:
                km > 0
                  ? 0.7
                  : 0.35,

              opacity:
                km > 0
                  ? 0.45
                  : 0.10,

              fillColor:
                AREA_COLOR,

              fillOpacity:
                getMunicipalityOpacity(
                  km
                )
            };
          },


        onEachFeature:
          (
            feature,
            layer
          ) => {

            const city =
              feature
                .properties
                .N03_004 ||
              '名称不明';

            const km =
              municipalityDistance[
                city
              ] || 0;

            const runs =
              municipalityRunCount[
                city
              ] || 0;

            municipalityLayers[
              city
            ] =
              layer;

            layer.bindPopup(

              '<div class="popup-title">' +
              city +
              '</div>' +

              '<div class="popup-row">' +
              '累積走行距離：' +
              '<strong>' +
              km.toFixed(2) +
              ' km</strong>' +
              '</div>' +

              '<div class="popup-row">' +
              '走ったラン：' +
              '<strong>' +
              runs +
              ' 回</strong>' +
              '</div>'
            );
          }
      }
    );
}


function focusMunicipality(city) {

  const layer =
    municipalityLayers[
      city
    ];

  if (!layer) {
    return;
  }

  if (
    municipalityLayer &&
    !map.hasLayer(
      municipalityLayer
    )
  ) {

    municipalityLayer.addTo(
      map
    );
  }

  if (
    map.hasLayer(
      routeGroup
    )
  ) {

    map.removeLayer(
      routeGroup
    );
  }

  if (
    map.hasLayer(
      ringGroup
    )
  ) {

    map.removeLayer(
      ringGroup
    );
  }

  map.fitBounds(
    layer.getBounds(),
    {
      padding:
        [25, 25],

      maxZoom:
        11
    }
  );

  document
    .getElementById(
      'map'
    )
    .scrollIntoView({
      behavior:
        'smooth',

      block:
        'start'
    });

  setTimeout(
    () =>
      layer.openPopup(),
    500
  );
}


function updateDashboard(
  stats
) {

  const entries =
    Object.entries(
      stats
        .municipalityDistance
    )
    .filter(
      ([, km]) =>
        km > 0.01
    )
    .sort(
      (a, b) =>
        b[1] - a[1]
    );

  document
    .getElementById(
      'totalDistance'
    )
    .textContent =
      stats
        .totalDistanceKm
        .toFixed(1);

  document
    .getElementById(
      'runCount'
    )
    .textContent =
      stats
        .activities
        .length;

  document
    .getElementById(
      'cityCount'
    )
    .textContent =
      entries.length;

  document
    .getElementById(
      'cityHeading'
    )
    .textContent =
      selectedYear === 'ALL'
        ? '市町村別'
        : selectedYear +
          '年 市町村別';

  const cityList =
    document.getElementById(
      'cityList'
    );

  cityList.innerHTML = '';

  if (
    entries.length === 0
  ) {

    cityList.innerHTML =
      '<div class="emptyMessage">' +
      'この期間の市町村データがありません' +
      '</div>';

    return;
  }

  const maxKm =
    entries[0][1];

  entries.forEach(
    ([city, km]) => {

      const percent =
        Math.max(
          3,
          (
            km /
            maxKm
          ) *
          100
        );

      const runs =
        stats
          .municipalityRunCount[
            city
          ] || 0;

      const card =
        document.createElement(
          'div'
        );

      card.className =
        'cityCard';

      card.innerHTML =

        '<div class="cityTop">' +

          '<div class="cityName">' +
            city +
          '</div>' +

          '<div class="cityDistance">' +
            km.toFixed(2) +
            ' km' +
          '</div>' +

        '</div>' +

        '<div class="barTrack">' +

          '<div class="barFill" style="width:' +
            percent +
            '%"></div>' +

        '</div>' +

        '<div class="cityRuns">' +
          'RUNS ' +
          runs +
        '</div>';

      card.addEventListener(
        'click',
        () =>
          focusMunicipality(
            city
          )
      );

      cityList.appendChild(
        card
      );
    }
  );
}


function updateDisplay() {

  const zoom =
    map.getZoom();

  if (
    zoom >= 13
  ) {

    if (
      municipalityLayer &&
      map.hasLayer(
        municipalityLayer
      )
    ) {

      map.removeLayer(
        municipalityLayer
      );
    }

    if (
      !map.hasLayer(
        ringGroup
      )
    ) {

      ringGroup.addTo(
        map
      );
    }

    if (
      !map.hasLayer(
        routeGroup
      )
    ) {

      routeGroup.addTo(
        map
      );
    }

    setStatus(
      selectedYear === 'ALL'

        ? '詳細表示：実際に走った道路＋Runner\'s Rings'

        : selectedYear +
          '年：実際に走った道路＋Runner\'s Rings'
    );

  } else {

    if (
      municipalityLayer &&
      !map.hasLayer(
        municipalityLayer
      )
    ) {

      municipalityLayer.addTo(
        map
      );
    }

    if (
      map.hasLayer(
        routeGroup
      )
    ) {

      map.removeLayer(
        routeGroup
      );
    }

    if (
      map.hasLayer(
        ringGroup
      )
    ) {

      map.removeLayer(
        ringGroup
      );
    }

    setStatus(
      selectedYear === 'ALL'

        ? '広域表示：累積走行距離を面で表示'

        : selectedYear +
          '年：走行距離を面で表示'
    );
  }
}


function renderSelectedData() {

  const stats =
    buildSelectedStats();

  clearMapLayers();

  drawRoutes(
    stats.activities
  );

  drawRingCells(
    stats.ringCells
  );

  drawMunicipalities(
    stats.municipalityDistance,
    stats.municipalityRunCount
  );

  updateDashboard(
    stats
  );

  updateDisplay();
}


async function start() {

  try {

    await loadMunicipalities();

    setStatus(
      '過去ランを復元中…'
    );

    const archiveCount =
      loadArchiveActivities();

    const gpxFiles =
      await getGPXFiles();

    await loadAllGPX(
      gpxFiles
    );

    createYearFilters();

    renderSelectedData();

    if (
      municipalityLayer
    ) {

      map.fitBounds(
        municipalityLayer
          .getBounds()
      );
    }

    map.on(
      'zoomend',
      updateDisplay
    );

    setTimeout(
      () =>
        map.invalidateSize(),
      300
    );

    console.log(
      '過去ラン:',
      archiveCount
    );

    console.log(
      'GPX:',
      gpxFiles.length
    );

    console.log(
      '合計:',
      activities.length
    );

  } catch(error) {

    console.error(error);

    setStatus(
      '❌ ' +
      error.message
    );
  }
}


start();

</script>
