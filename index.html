<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner's Rings</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1422;
      color: white;
    }

    header {
      background: #0f1d2f;
      padding: 14px 16px 12px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.75;
    }

    #status {
      background: #17283d;
      color: #dce8f5;
      padding: 8px 14px;
      font-size: 13px;
      white-space: nowrap;
      overflow-x: auto;
    }

    #map {
      width: 100%;
      height: 48vh;
      min-height: 330px;
    }

    #dashboard {
      padding: 18px 16px 32px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      background: #132237;
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
    }

    .label {
      font-size: 10px;
      letter-spacing: 1px;
      opacity: 0.65;
      margin-bottom: 6px;
    }

    .value {
      font-size: 21px;
      font-weight: 700;
    }

    .unit {
      font-size: 12px;
      opacity: 0.65;
    }

    h2 {
      font-size: 16px;
      margin: 22px 0 10px;
    }

    #cityList {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cityCard {
      background: #132237;
      border-radius: 14px;
      padding: 12px 14px 14px;
    }

    .cityTop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .cityName {
      font-size: 14px;
      font-weight: 700;
    }

    .cityDistance {
      font-size: 14px;
      opacity: 0.85;
    }

    .cityRuns {
      margin-top: 7px;
      font-size: 11px;
      opacity: 0.6;
    }

    .barTrack {
      width: 100%;
      height: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .barFill {
      height: 100%;
      background: #20b26b;
      border-radius: 999px;
      min-width: 3px;
    }

    .emptyMessage {
      background: #132237;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      opacity: 0.8;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
    }

    .popup-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .popup-row {
      margin-top: 4px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>Runner's Rings</h1>
  <p>走った記録ではなく、走った人生を残す。</p>
</header>

<div id="status">
  データを読み込み中…
</div>

<div id="map"></div>

<section id="dashboard">

  <div class="summary">

    <div class="card">
      <div class="label">TOTAL</div>
      <span id="totalDistance" class="value">--</span>
      <span class="unit">km</span>
    </div>

    <div class="card">
      <div class="label">RUNS</div>
      <div id="runCount" class="value">--</div>
    </div>

    <div class="card">
      <div class="label">CITIES</div>
      <div id="cityCount" class="value">--</div>
    </div>

  </div>

  <h2>市町村別</h2>

  <div id="cityList">
    <div class="emptyMessage">
      読み込み中…
    </div>
  </div>

</section>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const OWNER = 'atsuoebara';
const REPO = 'tree-age-map';
const BRANCH = 'main';


const map = L.map('map').setView(
  [36.39, 139.06],
  9
);


L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);


let geojsonData = null;
let municipalityLayer = null;

const routeGroup = L.layerGroup();

const municipalityDistance = {};
const municipalityRunCount = {};

let totalDistanceKm = 0;
let loadedGPXCount = 0;


/* =========================
   ステータス
========================= */

function setStatus(text) {
  document.getElementById('status').textContent = text;
}


/* =========================
   GitHubからGPX一覧取得
========================= */

async function getGPXFiles() {

  setStatus('GPXファイルを探しています…');

  const apiURL =
    'https://api.github.com/repos/' +
    OWNER + '/' +
    REPO +
    '/contents?ref=' +
    BRANCH;


  const response = await fetch(apiURL, {
    headers: {
      'Accept': 'application/vnd.github+json'
    }
  });


  if (!response.ok) {
    throw new Error(
      'GPX一覧取得失敗 HTTP ' +
      response.status
    );
  }


  const files = await response.json();


  const gpxFiles = files
    .filter(file =>
      file.type === 'file' &&
      file.name.toLowerCase().endsWith('.gpx')
    )
    .map(file => ({
      name: file.name,
      url: file.download_url
    }));


  if (gpxFiles.length === 0) {
    throw new Error('GPXファイルがありません');
  }


  return gpxFiles;
}


/* =========================
   2点間距離
========================= */

function distanceKm(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const toRad = deg =>
    deg * Math.PI / 180;


  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);


  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;
}


/* =========================
   点がリング内にあるか
========================= */

function pointInRing(point, ring) {

  const x = point[0];
  const y = point[1];

  let inside = false;


  for (
    let i = 0, j = ring.length - 1;
    i < ring.length;
    j = i++
  ) {

    const xi = ring[i][0];
    const yi = ring[i][1];

    const xj = ring[j][0];
    const yj = ring[j][1];


    const intersect =
      ((yi > y) !== (yj > y)) &&
      (
        x <
        (xj - xi) *
        (y - yi) /
        (yj - yi) +
        xi
      );


    if (intersect) {
      inside = !inside;
    }
  }


  return inside;
}


/* =========================
   Polygon判定
========================= */

function pointInPolygon(point, polygon) {

  if (!pointInRing(point, polygon[0])) {
    return false;
  }


  for (
    let i = 1;
    i < polygon.length;
    i++
  ) {

    if (pointInRing(point, polygon[i])) {
      return false;
    }
  }


  return true;
}


/* =========================
   GeoJSON判定
========================= */

function pointInFeature(point, feature) {

  const geometry = feature.geometry;

  if (!geometry) {
    return false;
  }


  if (geometry.type === 'Polygon') {

    return pointInPolygon(
      point,
      geometry.coordinates
    );
  }


  if (geometry.type === 'MultiPolygon') {

    return geometry.coordinates.some(
      polygon =>
        pointInPolygon(
          point,
          polygon
        )
    );
  }


  return false;
}


/* =========================
   座標 → 市町村
========================= */

function findMunicipality(lat, lon) {

  const point = [lon, lat];


  for (const feature of geojsonData.features) {

    if (pointInFeature(point, feature)) {

      return (
        feature.properties.N03_004 ||
        '名称不明'
      );
    }
  }


  return null;
}


/* =========================
   面の濃さ
========================= */

function getOpacity(km) {

  if (km <= 0) return 0.03;
  if (km < 5) return 0.15;
  if (km < 10) return 0.30;
  if (km < 20) return 0.45;
  if (km < 30) return 0.60;
  if (km < 50) return 0.72;

  return 0.85;
}


/* =========================
   行政境界読み込み
========================= */

async function loadMunicipalities() {

  setStatus('行政境界を読み込み中…');


  const response = await fetch(
    './N03-20250101_10.geojson'
  );


  if (!response.ok) {
    throw new Error(
      '行政境界データ取得失敗'
    );
  }


  geojsonData = await response.json();
}


/* =========================
   GPXを1本読み込む
========================= */

async function loadOneGPX(gpxFile) {

  const response = await fetch(
    gpxFile.url
  );


  if (!response.ok) {

    throw new Error(
      gpxFile.name +
      ' 取得失敗 HTTP ' +
      response.status
    );
  }


  const text = await response.text();


  const parser = new DOMParser();

  const xml = parser.parseFromString(
    text,
    'application/xml'
  );


  if (xml.querySelector('parsererror')) {

    throw new Error(
      gpxFile.name +
      ' XML解析失敗'
    );
  }


  const points = Array.from(
    xml.getElementsByTagName('trkpt')
  );


  const latlngs = [];


  points.forEach(point => {

    const lat = parseFloat(
      point.getAttribute('lat')
    );

    const lon = parseFloat(
      point.getAttribute('lon')
    );


    if (
      Number.isFinite(lat) &&
      Number.isFinite(lon)
    ) {

      latlngs.push([lat, lon]);
    }
  });


  if (latlngs.length < 2) {

    throw new Error(
      gpxFile.name +
      ' GPS座標不足'
    );
  }


  let fileDistanceKm = 0;

  const citiesThisRun =
    new Set();


  for (
    let i = 1;
    i < latlngs.length;
    i++
  ) {

    const prev = latlngs[i - 1];
    const current = latlngs[i];


    const segmentKm = distanceKm(
      prev[0],
      prev[1],
      current[0],
      current[1]
    );


    fileDistanceKm += segmentKm;


    const midLat =
      (prev[0] + current[0]) / 2;

    const midLon =
      (prev[1] + current[1]) / 2;


    const city = findMunicipality(
      midLat,
      midLon
    );


    if (city) {

      if (
        municipalityDistance[city]
        === undefined
      ) {

        municipalityDistance[city] = 0;
      }


      municipalityDistance[city] +=
        segmentKm;


      citiesThisRun.add(city);
    }
  }


  citiesThisRun.forEach(city => {

    if (
      municipalityRunCount[city]
      === undefined
    ) {

      municipalityRunCount[city] = 0;
    }


    municipalityRunCount[city]++;
  });


  totalDistanceKm +=
    fileDistanceKm;


  loadedGPXCount++;


  const route = L.polyline(
    latlngs,
    {
      color: '#ff3b30',
      weight: 5,
      opacity: 0.9
    }
  );


  routeGroup.addLayer(route);
}


/* =========================
   全GPX読み込み
========================= */

async function loadAllGPX(gpxFiles) {

  for (
    let i = 0;
    i < gpxFiles.length;
    i++
  ) {

    setStatus(
      'GPX ' +
      (i + 1) +
      '/' +
      gpxFiles.length +
      ' 読み込み中'
    );


    await loadOneGPX(
      gpxFiles[i]
    );
  }
}


/* =========================
   市町村面描画
========================= */

function drawMunicipalities() {

  municipalityLayer =
    L.geoJSON(
      geojsonData,
      {

        style: feature => {

          const city =
            feature.properties.N03_004;


          const km =
            municipalityDistance[city] || 0;


          return {
            color: '#14834f',
            weight: 1.2,
            fillColor: '#20b26b',
            fillOpacity: getOpacity(km)
          };
        },


        onEachFeature:
          (feature, layer) => {

            const prefecture =
              feature.properties.N03_001 ||
              '群馬県';


            const city =
              feature.properties.N03_004 ||
              '名称不明';


            const km =
              municipalityDistance[city] || 0;


            const runs =
              municipalityRunCount[city] || 0;


            layer.bindPopup(

              '<div class="popup-title">' +
              city +
              '</div>' +

              '<div class="popup-row">' +
              '累積走行距離：' +
              '<strong>' +
              km.toFixed(2) +
              ' km</strong>' +
              '</div>' +

              '<div class="popup-row">' +
              '走ったラン：' +
              '<strong>' +
              runs +
              ' 回</strong>' +
              '</div>'

            );
          }

      }
    );


  municipalityLayer.addTo(map);


  map.fitBounds(
    municipalityLayer.getBounds()
  );
}


/* =========================
   ダッシュボード
========================= */

function updateDashboard() {

  const entries =
    Object.entries(
      municipalityDistance
    )
    .filter(
      ([, km]) => km > 0.01
    )
    .sort(
      (a, b) => b[1] - a[1]
    );


  document.getElementById(
    'totalDistance'
  ).textContent =
    totalDistanceKm.toFixed(1);


  document.getElementById(
    'runCount'
  ).textContent =
    loadedGPXCount;


  document.getElementById(
    'cityCount'
  ).textContent =
    entries.length;


  const cityList =
    document.getElementById(
      'cityList'
    );


  cityList.innerHTML = '';


  if (entries.length === 0) {

    cityList.innerHTML =
      '<div class="emptyMessage">' +
      '市町村データがありません' +
      '</div>';

    return;
  }


  const maxKm =
    entries[0][1];


  entries.forEach(
    ([city, km]) => {

      const percent =
        Math.max(
          3,
          (km / maxKm) * 100
        );


      const runs =
        municipalityRunCount[city] || 0;


      const card =
        document.createElement('div');


      card.className =
        'cityCard';


      card.innerHTML =

        '<div class="cityTop">' +

          '<div class="cityName">' +
            city +
          '</div>' +

          '<div class="cityDistance">' +
            km.toFixed(2) +
            ' km' +
          '</div>' +

        '</div>' +

        '<div class="barTrack">' +

          '<div class="barFill" style="width:' +
            percent +
            '%"></div>' +

        '</div>' +

        '<div class="cityRuns">' +
          'RUNS ' +
          runs +
        '</div>';


      cityList.appendChild(card);
    }
  );
}


/* =========================
   ズーム切替
========================= */

function updateDisplay() {

  const zoom =
    map.getZoom();


  if (zoom >= 13) {

    if (
      municipalityLayer &&
      map.hasLayer(
        municipalityLayer
      )
    ) {

      map.removeLayer(
        municipalityLayer
      );
    }


    if (
      !map.hasLayer(
        routeGroup
      )
    ) {

      routeGroup.addTo(map);
    }


    setStatus(
      '詳細表示：実際に走った道路'
    );


  } else {

    if (
      municipalityLayer &&
      !map.hasLayer(
        municipalityLayer
      )
    ) {

      municipalityLayer.addTo(map);
    }


    if (
      map.hasLayer(
        routeGroup
      )
    ) {

      map.removeLayer(
        routeGroup
      );
    }


    setStatus(
      '広域表示：累積走行距離を面で表示'
    );
  }
}


/* =========================
   起動
========================= */

async function start() {

  try {

    await loadMunicipalities();


    const gpxFiles =
      await getGPXFiles();


    await loadAllGPX(
      gpxFiles
    );


    drawMunicipalities();

    updateDashboard();

    updateDisplay();


    map.on(
      'zoomend',
      updateDisplay
    );


    setTimeout(
      () => {
        map.invalidateSize();
      },
      300
    );


  } catch (error) {

    console.error(error);


    setStatus(
      '❌ ' +
      error.message
    );
  }
}


start();

</script>

</body>
</html>
