<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner's Rings</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1422;
    }

    header {
      background: #0f1d2f;
      color: white;
      padding: 12px 16px;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.75;
    }

    #status {
      background: #17283d;
      color: #dce8f5;
      padding: 8px 14px;
      font-size: 13px;
      box-sizing: border-box;
    }

    #map {
      width: 100%;
      height: calc(100vh - 91px);
    }
  </style>
</head>

<body>

<header>
  <h1>Runner's Rings</h1>
  <p>走った記録ではなく、走った人生を残す。</p>
</header>

<div id="status">データを読み込み中…</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([36.39, 139.06], 9);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  const runningDistance = {
    '前橋市': 1200,
    '高崎市': 350,
    '吉岡町': 350,
    '渋川市': 120,
    '伊勢崎市': 60
  };

  function getDistance(name) {
    return runningDistance[name] || 0;
  }

  function getOpacity(km) {
    if (km === 0) return 0.05;
    if (km < 50) return 0.15;
    if (km < 100) return 0.25;
    if (km < 250) return 0.40;
    if (km < 500) return 0.55;
    if (km < 1000) return 0.70;
    return 0.85;
  }

  let municipalityLayer = null;
  let gpxLine = null;

  async function loadMunicipalities() {
    const response = await fetch('./N03-20250101_10.geojson');
    if (!response.ok) {
      throw new Error('行政境界データを読み込めませんでした');
    }

    const data = await response.json();

    municipalityLayer = L.geoJSON(data, {
      style: feature => {
        const city = feature.properties.N03_004;
        const km = getDistance(city);

        return {
          color: '#14834f',
          weight: 1.2,
          fillColor: '#20b26b',
          fillOpacity: getOpacity(km)
        };
      },

      onEachFeature: (feature, layer) => {
        const prefecture =
          feature.properties.N03_001 || '群馬県';

        const city =
          feature.properties.N03_004 || '名称不明';

        const km = getDistance(city);

        layer.bindPopup(
          '<strong>' +
          prefecture +
          ' ' +
          city +
          '</strong><br>' +
          '累積走行距離：' +
          km.toLocaleString() +
          ' km'
        );
      }
    }).addTo(map);

    map.fitBounds(municipalityLayer.getBounds());
  }

  async function loadGPX() {
    const response = await fetch('./午後のランニング.gpx');

    if (!response.ok) {
      throw new Error('GPXファイルを読み込めませんでした');
    }

    const text = await response.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'application/xml');

    const points = Array.from(
      xml.getElementsByTagName('trkpt')
    );

    if (points.length === 0) {
      throw new Error('GPX内に走行ポイントがありません');
    }

    const latlngs = points.map(point => {
      return [
        parseFloat(point.getAttribute('lat')),
        parseFloat(point.getAttribute('lon'))
      ];
    });

    gpxLine = L.polyline(latlngs, {
      color: '#ff3b30',
      weight: 5,
      opacity: 1
    });

    return latlngs.length;
  }

  function updateDisplay() {
    const zoom = map.getZoom();

    if (zoom >= 13) {
      if (
        municipalityLayer &&
        map.hasLayer(municipalityLayer)
      ) {
        map.removeLayer(municipalityLayer);
      }

      if (
        gpxLine &&
        !map.hasLayer(gpxLine)
      ) {
        gpxLine.addTo(map);
      }

      document.getElementById('status').textContent =
        '詳細表示：実際に走った道を表示';

    } else {
      if (
        municipalityLayer &&
        !map.hasLayer(municipalityLayer)
      ) {
        municipalityLayer.addTo(map);
      }

      if (
        gpxLine &&
        map.hasLayer(gpxLine)
      ) {
        map.removeLayer(gpxLine);
      }

      document.getElementById('status').textContent =
        '広域表示：累積走行距離を「面」の濃淡で表示';
    }
  }

  async function start() {
    try {
      await loadMunicipalities();
      const pointCount = await loadGPX();

      document.getElementById('status').textContent =
        'GPX読み込み成功：' +
        pointCount +
        'ポイント';

      updateDisplay();

      map.on('zoomend', updateDisplay);

    } catch (error) {
      console.error(error);

      document.getElementById('status').textContent =
        '読み込みエラー：' + error.message;
    }
  }

  start();
</script>

</body>
</html>
