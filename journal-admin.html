<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner's Rings Journal Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #0b1422;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    .header {
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.3;
    }

    .header p {
      margin: 7px 0 0;
      color: #aeb9c8;
      font-size: 13px;
      line-height: 1.6;
    }

    .card {
      background: #132237;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
    }

    .statusBox {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #0f1d2f;
      color: #dce8f5;
      font-size: 13px;
      line-height: 1.6;
    }

    .statusBox.ok {
      border: 1px solid rgba(234, 255, 0, 0.35);
      color: #eaff00;
    }

    .statusBox.error {
      border: 1px solid rgba(255, 80, 120, 0.45);
      color: #ff9db5;
    }

    .field {
      margin-top: 16px;
    }

    .field:first-of-type {
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: #0f1d2f;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input,
    select {
      min-height: 48px;
      padding: 11px 12px;
    }

    textarea {
      min-height: 120px;
      padding: 12px;
      resize: vertical;
      line-height: 1.65;
    }

    textarea.bodyField {
      min-height: 220px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff2bd6;
      box-shadow: 0 0 0 3px rgba(255, 43, 214, 0.11);
    }

    .help {
      margin-top: 6px;
      color: #8190a3;
      font-size: 11px;
      line-height: 1.5;
    }

    .buttonRow {
      margin-top: 22px;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 13px;
      background: #ff2bd6;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .backLink {
      display: block;
      margin-top: 16px;
      color: #aeb9c8;
      font-size: 12px;
      text-align: center;
      text-decoration: none;
    }

    .backLink:hover {
      color: #ffffff;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 520px) {
      .page {
        padding: 14px 10px 32px;
      }

      .card {
        padding: 15px;
        border-radius: 16px;
      }

      .header h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>Runner's Rings Journal</h1>
      <p>
        Journal記事の下書き投稿画面です。
        まずはSupabaseへdraft保存できるところまで確認します。
      </p>
    </header>

    <section class="card">
      <div id="authStatus" class="statusBox">
        ログイン状態を確認しています...
      </div>

      <form id="journalForm" class="hidden">
        <div class="field">
          <label for="titleJa">日本語タイトル</label>
          <input
            id="titleJa"
            name="titleJa"
            type="text"
            maxlength="160"
            required
          >
        </div>

        <div class="field">
          <label for="titleEn">English title</label>
          <input
            id="titleEn"
            name="titleEn"
            type="text"
            maxlength="160"
          >
        </div>

        <div class="field">
          <label for="summaryJa">日本語概要</label>
          <textarea
            id="summaryJa"
            name="summaryJa"
            maxlength="500"
          ></textarea>
        </div>

        <div class="field">
          <label for="summaryEn">English summary</label>
          <textarea
            id="summaryEn"
            name="summaryEn"
            maxlength="500"
          ></textarea>
        </div>

        <div class="field">
          <label for="bodyJa">日本語本文</label>
          <textarea
            id="bodyJa"
            name="bodyJa"
            class="bodyField"
            required
          ></textarea>
        </div>

        <div class="field">
          <label for="bodyEn">English body</label>
          <textarea
            id="bodyEn"
            name="bodyEn"
            class="bodyField"
          ></textarea>
        </div>

        <div class="field">
          <label for="category">カテゴリ</label>
          <select id="category" name="category">
            <option value="development">開発日記</option>
            <option value="runner">世界のランナー</option>
            <option value="gps-art">GPSアート</option>
            <option value="discovery">今週の発見</option>
            <option value="other">その他</option>
          </select>
        </div>

        <div class="buttonRow">
          <button id="saveDraftButton" type="submit">
            下書き保存
          </button>
        </div>

        <div id="saveMessage" class="statusBox hidden"></div>
      </form>
    </section>

    <a class="backLink" href="./index.html">
      Runner's Ringsへ戻る
    </a>
  </main>

  <script>
    const SUPABASE_URL =
      'https://fhwvntpzwyenendhcgbw.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_8ZhwV5lVHGbud8v6AS3YBQ_C78JbXyM';

    const ADMIN_USER_ID =
      '386da875-298e-46b7-927d-0e02d02c409a';

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    const authStatus =
      document.getElementById('authStatus');

    const journalForm =
      document.getElementById('journalForm');

    const saveDraftButton =
      document.getElementById('saveDraftButton');

    const saveMessage =
      document.getElementById('saveMessage');

    function setAuthStatus(message, type = '') {
      authStatus.textContent = message;
      authStatus.className = 'statusBox';

      if (type) {
        authStatus.classList.add(type);
      }
    }

    function setSaveMessage(message, type = '') {
      saveMessage.textContent = message;
      saveMessage.className = 'statusBox';

      if (type) {
        saveMessage.classList.add(type);
      }

      saveMessage.classList.remove('hidden');
    }

    function hideSaveMessage() {
      saveMessage.classList.add('hidden');
    }

    function makeSlug() {
      const now = new Date();

      const pad = value =>
        String(value).padStart(2, '0');

      const datePart =
        now.getFullYear() +
        pad(now.getMonth() + 1) +
        pad(now.getDate());

      const timePart =
        pad(now.getHours()) +
        pad(now.getMinutes()) +
        pad(now.getSeconds());

      return 'journal-' + datePart + '-' + timePart;
    }

    async function checkAdmin() {
      try {
        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        const session =
          data.session;

        if (!session) {
          setAuthStatus(
            'Runner\'s Ringsにログインしてください。',
            'error'
          );
          return;
        }

        const user =
          session.user;

        if (!user || user.id !== ADMIN_USER_ID) {
          setAuthStatus(
            'このページを利用する権限がありません。',
            'error'
          );
          return;
        }

        setAuthStatus(
          '管理者ログインを確認しました。',
          'ok'
        );

        journalForm.classList.remove('hidden');

      } catch (error) {
        console.error(error);

        setAuthStatus(
          'ログイン状態の確認に失敗しました。',
          'error'
        );
      }
    }

    journalForm.addEventListener(
      'submit',
      async event => {
        event.preventDefault();

        hideSaveMessage();

        const titleJa =
          document.getElementById('titleJa')
            .value
            .trim();

        const titleEn =
          document.getElementById('titleEn')
            .value
            .trim();

        const summaryJa =
          document.getElementById('summaryJa')
            .value
            .trim();

        const summaryEn =
          document.getElementById('summaryEn')
            .value
            .trim();

        const bodyJa =
          document.getElementById('bodyJa')
            .value
            .trim();

        const bodyEn =
          document.getElementById('bodyEn')
            .value
            .trim();

        const category =
          document.getElementById('category')
            .value;

        if (!titleJa || !bodyJa) {
          setSaveMessage(
            '日本語タイトルと日本語本文は必須です。',
            'error'
          );
          return;
        }

        saveDraftButton.disabled = true;
        saveDraftButton.textContent =
          '保存しています...';

        try {
          const {
            data: sessionData,
            error: sessionError
          } =
            await supabaseClient.auth.getSession();

          if (sessionError) {
            throw sessionError;
          }

          const user =
            sessionData.session?.user;

          if (!user || user.id !== ADMIN_USER_ID) {
            throw new Error(
              '管理者ログインを確認できません。'
            );
          }

          const slug =
            makeSlug();

          const {
            data,
            error
          } =
            await supabaseClient
              .from('journal_posts')
              .insert({
                slug,
                title_ja: titleJa,
                title_en: titleEn || null,
                summary_ja: summaryJa || null,
                summary_en: summaryEn || null,
                body_ja: bodyJa,
                body_en: bodyEn || null,
                category,
                status: 'draft',
                published_at: null
              })
              .select('id, slug, created_at')
              .single();

          if (error) {
            throw error;
          }

          setSaveMessage(
            '下書きを保存しました。ID: ' +
              data.id,
            'ok'
          );

          journalForm.reset();

          document.getElementById('category')
            .value = 'development';

        } catch (error) {
          console.error(error);

          setSaveMessage(
            '保存に失敗しました。' +
            (error?.message
              ? ' ' + error.message
              : ''),
            'error'
          );

        } finally {
          saveDraftButton.disabled = false;
          saveDraftButton.textContent =
            '下書き保存';
        }
      }
    );

    checkAdmin();
  </script>
</body>
</html>
