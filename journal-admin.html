<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runner's Rings Journal Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0b1422; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; }
    .page { width: 100%; max-width: 720px; margin: 0 auto; padding: 18px 14px 40px; }
    .header { margin-bottom: 18px; }
    .header h1 { margin: 0; font-size: 24px; line-height: 1.3; }
    .header p { margin: 7px 0 0; color: #aeb9c8; font-size: 13px; line-height: 1.6; }
    .card { background: #132237; border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px; padding: 18px; box-shadow: 0 16px 40px rgba(0,0,0,.16); }
    .statusBox { margin-bottom: 16px; padding: 12px 14px; border-radius: 12px;
      background: #0f1d2f; color: #dce8f5; font-size: 13px; line-height: 1.6;
      overflow-wrap: anywhere; }
    .statusBox.ok { border: 1px solid rgba(234,255,0,.35); color: #eaff00; }
    .statusBox.error { border: 1px solid rgba(255,80,120,.45); color: #ff9db5; }
    .statusBox.notice { border: 1px solid rgba(255,203,69,.45); color: #ffdb83; }
    .field { margin-top: 16px; }
    .field:first-of-type { margin-top: 0; }
    label { display: block; margin-bottom: 7px; color: #cbd5e1; font-size: 13px; font-weight: 700; }
    input, textarea, select { width: 100%; border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px; background: #0f1d2f; color: #fff; font: inherit;
      font-size: 16px; outline: none; }
    input, select { min-height: 48px; padding: 11px 12px; }
    input[type="file"] { padding: 12px; height: auto; }
    textarea { min-height: 120px; padding: 12px; resize: vertical; line-height: 1.65; }
    textarea.bodyField { min-height: 220px; }
    input:focus, textarea:focus, select:focus { border-color: #ff2bd6;
      box-shadow: 0 0 0 3px rgba(255,43,214,.11); }
    .help { margin-top: 6px; color: #a7b5c8; font-size: 12px; line-height: 1.5; }
    .preview { display: block; max-width: 100%; max-height: 340px;
      margin-top: 12px; border-radius: 12px; object-fit: contain; border: 1px solid #38516b; }
    .buttonRow { margin-top: 22px; }
    .secondary { margin-top: 10px; background: #30445d; }
    .previewPanel { margin-top: 18px; padding: 16px; background: #0b1422;
      border: 1px solid #52657c; border-radius: 14px; overflow-wrap: anywhere; }
    .previewPanel h2 { font-size: 20px; }
    .previewPanel p { white-space: pre-wrap; line-height: 1.7; }
    .previewPanel img { max-width: 100%; border-radius: 10px; }
    .draftLoader { padding-bottom: 16px; border-bottom: 1px solid #38516b; }
    .draftLoader button { margin-top: 8px; background: #30445d; }
    button { width: 100%; min-height: 50px; border: 0; border-radius: 13px;
      background: #ff2bd6; color: #fff; font: inherit; font-size: 15px;
      font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .backLink { display: block; margin-top: 16px; color: #aeb9c8;
      font-size: 12px; text-align: center; text-decoration: none; }
    .backLink:hover { color: #fff; }
    .hidden { display: none !important; }
    @media (max-width: 520px) {
      .page { padding: 14px 10px 32px; }
      .card { padding: 15px; border-radius: 16px; }
      .header h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Runner's Rings Journal</h1>
      <p>Journal記事の下書き投稿画面です。画像を確認してから保存できます。</p>
    </header>
    <section class="card">
      <div id="authStatus" class="statusBox">ログイン状態を確認しています...</div>
      <div id="draftLoader" class="draftLoader hidden">
        <label for="loadDraftId">保存済み下書きID（今回の記事は 4）</label>
        <input id="loadDraftId" type="number" min="1" inputmode="numeric" value="4">
        <button id="loadDraftButton" type="button">下書きを読み込む</button>
        <div id="loadMessage" class="statusBox hidden" aria-live="polite"></div>
      </div>
      <form id="journalForm" class="hidden">
        <div class="field">
          <label for="titleJa">日本語タイトル</label>
          <input id="titleJa" name="titleJa" type="text" maxlength="160" required>
        </div>
        <div class="field">
          <label for="titleEn">English title</label>
          <input id="titleEn" name="titleEn" type="text" maxlength="160">
        </div>
        <div class="field">
          <label for="summaryJa">日本語概要</label>
          <textarea id="summaryJa" name="summaryJa" maxlength="500"></textarea>
        </div>
        <div class="field">
          <label for="summaryEn">English summary</label>
          <textarea id="summaryEn" name="summaryEn" maxlength="500"></textarea>
        </div>
        <div class="field">
          <label for="bodyJa">日本語本文</label>
          <textarea id="bodyJa" name="bodyJa" class="bodyField" required></textarea>
        </div>
        <div class="field">
          <label for="bodyEn">English body</label>
          <textarea id="bodyEn" name="bodyEn" class="bodyField"></textarea>
        </div>
        <div class="field">
          <label for="category">カテゴリ</label>
          <select id="category" name="category">
            <option value="development">開発日記</option>
            <option value="runner">世界のランナー</option>
            <option value="gps-art">GPSアート</option>
            <option value="discovery">今週の発見</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="field">
          <label for="journalImage">写真・1コマ漫画（任意）</label>
          <input id="journalImage" name="journalImage" type="file" accept="image/*">
          <div class="help">画像のみ、5MB以下。保存前にプレビューできます。</div>
          <img id="imagePreview" class="preview hidden" alt="選択した画像のプレビュー">
          <div id="imageInfo" class="help" aria-live="polite"></div>
        </div>
        <div class="buttonRow">
          <button id="saveDraftButton" type="submit">下書き保存</button>
          <button id="publishButton" type="button" class="secondary">記事を公開する</button>
          <button id="previewButton" type="button" class="secondary">公開前プレビュー（日英）</button>
        </div>
        <div id="saveMessage" class="statusBox hidden" aria-live="polite"></div>
        <div id="articlePreview" class="previewPanel hidden" aria-live="polite"></div>
      </form>
    </section>
    <a class="backLink" href="./index.html">Runner's Ringsへ戻る</a>
  </main>
  <script>
    'use strict';
    const SUPABASE_URL = 'https://fhwvntpzwyenendhcgbw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8ZhwV5lVHGbud8v6AS3YBQ_C78JbXyM';
    const ADMIN_USER_ID = '386da875-298e-46b7-927d-0e02d02c409a';
    const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
    const BUCKET = 'journal-images';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const $ = id => document.getElementById(id);
    const authStatus = $('authStatus');
    const form = $('journalForm');
    const button = $('saveDraftButton');
    const publishButton = $('publishButton');
    const saveMessage = $('saveMessage');
    const imageInput = $('journalImage');
    const preview = $('imagePreview');
    const imageInfo = $('imageInfo');
    const loader = $('draftLoader');
    const loadMessage = $('loadMessage');
    const articlePreview = $('articlePreview');
    let previewUrl = null;
    // 途中失敗した場合は同じ下書きを再利用し、重複記事を増やさない。
    let draftId = null;
    let imageStoragePath = null;
    let pendingImageUrl = null;
    let initialImage = null;
    let busy = false;

    function showStatus(element, message, type = '') {
      element.textContent = message;
      element.className = 'statusBox' + (type ? ' ' + type : '');
    }
    function makeSlug() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      return 'journal-' + now.getFullYear() + pad(now.getMonth() + 1) +
        pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes()) +
        pad(now.getSeconds()) + '-' + crypto.randomUUID().slice(0, 8);
    }
    async function requireAdmin() {
      // サーバーにユーザーを確認。画面での判定に加えて、RLSが実際の権限を守る。
      const { data, error } = await supabaseClient.auth.getUser();
      if (error || !data?.user || data.user.id !== ADMIN_USER_ID) {
        throw new Error('管理者ログインを確認できません。Runner\'s Ringsへログインしてください。');
      }
      return data.user;
    }
    async function checkAdmin() {
      try {
        await requireAdmin();
        showStatus(authStatus, '管理者ログインを確認しました。', 'ok');
        form.classList.remove('hidden');
        loader.classList.remove('hidden');
      } catch (error) {
        showStatus(authStatus, error.message, 'error');
        form.classList.add('hidden');
        loader.classList.add('hidden');
      }
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    $('loadDraftButton').addEventListener('click', async () => {
      const id = Number($('loadDraftId').value);
      if (!Number.isSafeInteger(id) || id < 1) {
        showStatus(loadMessage, '有効な下書きIDを入力してください。', 'error');
        return;
      }
      if (busy) return;
      busy = true;
      $('loadDraftButton').disabled = true;
      try {
        await requireAdmin();
        const { data, error } = await supabaseClient.from('journal_posts')
          .select('id,status,title_ja,title_en,summary_ja,summary_en,body_ja,body_en,category,image_url')
          .eq('id', id).eq('status', 'draft').single();
        if (error || !data) throw new Error('下書きを取得できません。IDと権限を確認してください。');
        const names = ['titleJa','titleEn','summaryJa','summaryEn','bodyJa','bodyEn','category'];
        const columns = ['title_ja','title_en','summary_ja','summary_en','body_ja','body_en','category'];
        names.forEach((name, i) => { $(name).value = data[columns[i]] || (name === 'category' ? 'development' : ''); });
        draftId = data.id;
        pendingImageUrl = data.image_url || null;
        imageStoragePath = null;
        initialImage = null;
        imageInput.value = '';
        clearPreview();
        if (pendingImageUrl) {
          preview.src = pendingImageUrl;
          preview.classList.remove('hidden');
          imageInfo.textContent = '保存済み画像（変更しない場合はそのまま）';
        }
        articlePreview.classList.add('hidden');
        saveMessage.classList.add('hidden');
        showStatus(loadMessage, '下書き ID: ' + id + ' を読み込みました。', 'ok');
      } catch (error) {
        showStatus(loadMessage, error.message, 'error');
      } finally {
        busy = false;
        $('loadDraftButton').disabled = false;
      }
    });

    $('previewButton').addEventListener('click', () => {
      let fields;
      try { fields = collectFields(); }
      catch (error) {
        showStatus(saveMessage, error.message, 'error');
        return;
      }
      const section = (lang, title, summary, body) =>
        '<section><h2>' + lang + '</h2><h3>' + escapeHtml(title || '') + '</h3>' +
        '<p>' + escapeHtml(summary || '') + '</p><p>' + escapeHtml(body || '') + '</p></section>';
      articlePreview.innerHTML =
        '<strong>管理者用プレビュー（未公開・この画面内のみ）</strong>' +
        section('日本語', fields.title_ja, fields.summary_ja, fields.body_ja) +
        '<hr>' + section('English', fields.title_en, fields.summary_en, fields.body_en);
      const file = imageInput.files?.[0];
      const url = file ? previewUrl : pendingImageUrl;
      if (url) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = '記事画像';
        articlePreview.appendChild(img);
      }
      articlePreview.classList.remove('hidden');
      articlePreview.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    function clearPreview() {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
      preview.removeAttribute('src');
      preview.classList.add('hidden');
      imageInfo.textContent = '';
    }
    function validateImage(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) throw new Error('画像ファイルを選んでください。');
      if (file.size > MAX_IMAGE_SIZE) throw new Error('画像は5MB以下にしてください。');
      if (file.size === 0) throw new Error('空の画像はアップロードできません。');
    }
    imageInput.addEventListener('change', () => {
      clearPreview();
      const file = imageInput.files?.[0];
      if (!file) return;
      try {
        validateImage(file);
        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
        preview.classList.remove('hidden');
        imageInfo.textContent = file.name + '（' + (file.size / 1024 / 1024).toFixed(2) + 'MB）';
      } catch (error) {
        imageInput.value = '';
        showStatus(saveMessage, error.message, 'error');
      }
    });
    function collectFields() {
      const titleJa = $('titleJa').value.trim();
      const bodyJa = $('bodyJa').value.trim();
      if (!titleJa || !bodyJa) throw new Error('日本語タイトルと日本語本文は必須です。');
      return {
        title_ja: titleJa,
        title_en: $('titleEn').value.trim() || null,
        summary_ja: $('summaryJa').value.trim() || null,
        summary_en: $('summaryEn').value.trim() || null,
        body_ja: bodyJa,
        body_en: $('bodyEn').value.trim() || null,
        category: $('category').value
      };
    }
    async function createOrUpdateDraft(fields) {
      if (draftId != null) {
        const { data, error } = await supabaseClient.from('journal_posts')
          .update(fields).eq('id', draftId).eq('status', 'draft').select('id').single();
        if (error || !data) throw new Error('下書きの更新に失敗しました。公開済み記事は編集できません。');
        return draftId;
      }
      const { data, error } = await supabaseClient.from('journal_posts').insert({
        ...fields, slug: makeSlug(), status: 'draft', published_at: null
      }).select('id').single();
      if (error) throw error;
      draftId = data.id;
      return draftId;
    }
    async function uploadImage(file) {
      // 公開バケットへのアップロードでも、Storage側のINSERTポリシーが必要。
      const safeExt = ({ 'image/jpeg': 'jpg', 'image/png': 'png',
        'image/webp': 'webp', 'image/gif': 'gif', 'image/avif': 'avif' })[file.type] ||
        (file.name.split('.').pop() || 'image').replace(/[^a-zA-Z0-9]/g, '').slice(0, 8).toLowerCase();
      const path = 'posts/' + draftId + '/' + crypto.randomUUID() + '.' + safeExt;
      const { error } = await supabaseClient.storage.from(BUCKET)
        .upload(path, file, { contentType: file.type, upsert: false });
      if (error) throw error;
      imageStoragePath = path;
      pendingImageUrl = supabaseClient.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    }
    // 公開時も必ず下書き保存と画像アップロードを完了させてから状態を変更する。
    async function saveArticle(publish = false) {
      if (busy) return;
      saveMessage.classList.add('hidden');
      let fields, file;
      try {
        fields = collectFields();
        file = imageInput.files?.[0] || null;
        validateImage(file);
        if (draftId != null && imageStoragePath && file && file !== initialImage) {
          throw new Error('画像アップロード済みです。この画面では画像変更せず再保存してください。');
        }
        if (publish && !window.confirm('この記事を一般公開します。内容・画像・日英プレビューを確認しましたか？')) return;
      } catch (error) {
        showStatus(saveMessage, error.message, 'error');
        return;
      }
      busy = true;
      button.disabled = true;
      publishButton.disabled = true;
      button.textContent = publish ? '公開準備中...' : '保存しています...';
      try {
        await requireAdmin();
        await createOrUpdateDraft(fields);
        if (file && !imageStoragePath) {
          initialImage = file;
          await uploadImage(file);
        }
        if (pendingImageUrl) {
          const { error } = await supabaseClient.from('journal_posts')
            .update({ image_url: pendingImageUrl }).eq('id', draftId).eq('status', 'draft')
            .select('id').single();
          if (error) throw error;
        }
        if (publish) {
          // 管理者であってもDB側RLSが公開操作を許可しなければ失敗する。
          const { data, error } = await supabaseClient.from('journal_posts')
            .update({ status: 'published', published_at: new Date().toISOString() })
            .eq('id', draftId).eq('status', 'draft').select('slug').single();
          if (error || !data) throw new Error('公開操作が拒否されました。Supabaseの管理者用RLSを確認してください。' + (error?.message || ''));
          showStatus(saveMessage, '公開登録が完了しました。記事URL: https://runnersrings.com/journal/articles/' + data.slug + '/ （ページ生成は通常15分程度、GitHub Actionsの混雑時はさらに時間がかかります）', 'ok');
          form.classList.add('hidden');
          loader.classList.add('hidden');
        } else {
          showStatus(saveMessage, '下書きを保存しました。ID: ' + draftId + (pendingImageUrl ? '／画像も保存しました。' : ''), 'ok');
          $('loadDraftId').value = draftId;
          showStatus(loadMessage, '編集中の下書き ID: ' + draftId + '（このまま再保存できます）', 'ok');
        }
      } catch (error) {
        console.error(error);
        showStatus(saveMessage, '処理を完了できませんでした。' + (draftId != null ? ' 下書きID: ' + draftId + '。' : '') + ' この画面を閉じずに確認してください。詳細: ' + (error?.message || '不明なエラー'), 'error');
      } finally {
        busy = false;
        button.disabled = false;
        publishButton.disabled = false;
        button.textContent = '下書き保存';
      }
    }
    form.addEventListener('submit', event => { event.preventDefault(); saveArticle(false); });
    publishButton.addEventListener('click', () => saveArticle(true));
    checkAdmin();
  </script>
</body>
</html>
