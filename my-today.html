<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY TODAY | Runner's Rings</title>
<link rel="icon" href="./icon.PNG">
<style>
*{box-sizing:border-box}body{margin:0;background:#091724;color:#eef9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:620px;margin:auto;padding:20px 15px 70px}a{color:#9defff}h1{color:#8cefff;font-size:34px}.sub{color:#a6c5d3;line-height:1.6}.card{background:#102a3d;border:1px solid #387a91;border-radius:20px;padding:23px;margin:18px 0}.distance{font-size:70px;color:#90efff;font-weight:900;margin:12px 0}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#17384c;padding:15px 20px;border-radius:12px;font-weight:800}button,input{font:inherit}button{border:0;border-radius:13px;padding:14px 17px;font-weight:900;cursor:pointer;color:#052533;background:#90efff}button.secondary{color:#fff;background:#254c63;border:1px solid #90efff}button:disabled{opacity:.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}#status{color:#b8d7e2;margin-top:14px}input{padding:10px;background:#18394d;border:1px solid #6291a4;border-radius:9px;color:white}small{color:#b3d0dc}.privacy{margin-top:18px;font-size:12px;color:#aac4d2;line-height:1.65}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<main><a href="./index.html">← Runner's Rings</a><h1>🩵 MY TODAY</h1><p class="sub">自分のランニングをInstagramストーリーズ用の1枚に。</p>
<label for="date">共有する日付</label> <input id="date" type="date">
<div class="card"><small id="dateLabel">—</small><div class="distance"><span id="km">—</span><span style="font-size:25px"> km</span></div><div class="stats"><div class="stat">🏃 <span id="count">—</span> runs</div></div><p id="region" class="sub"></p></div>
<div class="actions"><button id="share" disabled>Instagramへ共有</button><button class="secondary" id="save" disabled>画像を保存</button></div><p id="status" role="status">ログイン情報を確認中…</p>
<p class="privacy">共有画像には個人名・走行ルート・GPS座標を含めません。地域名は保存された地域別集計から取得できた場合だけ表示します。投稿前に画像をご確認ください。</p>
</main>
<script>
const sb=window.supabase.createClient('https://fhwvntpzwyenendhcgbw.supabase.co','sb_publishable_8ZhwV5lVHGbud8v6AS3YBQ_C78JbXyM',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),localDay=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
$('date').value=localDay(new Date());$('date').max=$('date').value;
let current=null,data=[];let regionNames=[];
function gtagEvent(name){if(typeof gtag==='function')gtag('event',name,{feature:'my_today'});}
async function load(){
 $('share').disabled=$('save').disabled=true;$('status').textContent='ランニングデータを集計中…';
 const {data:{user},error:authError}=await sb.auth.getUser();
 if(authError||!user){$('status').textContent='ランリングでログインしてから開いてください。';return;}
 const date=$('date').value;
 const {data:rows,error}=await sb.from('runs').select('id,activity_date,distance_km,name').eq('user_id',user.id).is('deleted_at',null).eq('activity_date',date).limit(1000);
 if(error){console.error(error);$('status').textContent='ランデータを読み込めませんでした。';return;}
 if(date!==$('date').value)return;
 data=rows||[];current={date,count:data.length,km:data.reduce((a,r)=>a+Number(r.distance_km||0),0)};
 const {data:geoRows,error:geoError}=await sb.rpc('my_today_regions',{p_date:date});
 if(date!==$('date').value)return;
 if(geoError){console.warn('MY TODAY regions:',geoError.message);regionNames=[];}else{
 regionNames=[...new Set((geoRows||[]).map(r=>[r.country_code,r.parent_region_name,r.region_name].filter(Boolean).join(' / ')).filter(Boolean))];
 }
 $('dateLabel').textContent=date.replaceAll('-','.');$('km').textContent=current.km.toFixed(2);$('count').textContent=current.count;
 $('region').textContent=regionNames.length?'📍 '+regionNames.slice(0,4).join(' ・ ')+(regionNames.length>4?' ほか'+(regionNames.length-4)+'地域':''):'';
 $('share').disabled=$('save').disabled=!current.count;
 $('status').textContent=current.count?'共有画像を作成できます。':'この日の保存済みランはありません。';
}
$('date').onchange=load;
function draw(){
 if(!current||!current.count)throw Error('No runs');
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const c=canvas.getContext('2d');
 let g=c.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#0c3549');g.addColorStop(1,'#10192b');c.fillStyle=g;c.fillRect(0,0,1080,1920);
 const txt=(v,x,y,size,color)=>{c.fillStyle=color;c.font='bold '+size+'px sans-serif';c.fillText(v,x,y,930)};
 txt('MY TODAY',68,150,65,'#88edff');txt(current.date.replaceAll('-','.'),68,260,45,'#b5d6e2');
 c.fillStyle='#17374b';c.beginPath();c.roundRect(55,390,970,550,34);c.fill();
 txt(current.km.toFixed(2),92,665,142,'#fff');txt('km',92,753,72,'#8eefff');txt(current.count+' '+(current.count===1?'run':'runs'),92,870,56,'#bedce8');
 txt('Today I added another ring.',68,1130,48,'#d2e9f1');
 if(regionNames.length){txt('📍 REGIONS',68,1270,40,'#8eefff');regionNames.slice(0,5).forEach((name,i)=>txt(name,68,1350+i*85,32,'#e7f7ff'));if(regionNames.length>5)txt('+'+(regionNames.length-5)+' more regions',68,1780,30,'#a6d3e3');}
 txt("Runner's Rings",68,1755,55,'#8eefff');txt('runnersrings.com',68,1840,35,'#c5dbe4');
 return canvas;
}
async function exportCard(saveOnly){
 $('share').disabled=$('save').disabled=true;$('status').textContent='画像を作成しています…';
 try{
 const blob=await new Promise((resolve,reject)=>draw().toBlob(b=>b?resolve(b):reject(Error('PNG error')),'image/png'));
 const file=new File([blob],'my-today-'+current.date+'.png',{type:'image/png'});gtagEvent('my_today_image_generated');
 if(!saveOnly&&navigator.canShare?.({files:[file]})&&navigator.share){
  try{await navigator.share({files:[file],title:'MY TODAY'});gtagEvent('my_today_share_sheet_opened');$('status').textContent='共有先でInstagramを選んでください。';return}
  catch(e){if(e.name==='AbortError'){$('status').textContent='';return;}console.warn(e)}
 }
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
 gtagEvent('my_today_image_saved');$('status').textContent='画像を保存しました。Instagramから選んで投稿できます。';
 }catch(e){console.error(e);$('status').textContent='画像生成に失敗しました。もう一度試してください。'}
 finally{$('share').disabled=$('save').disabled=!current?.count;}
}
$('share').onclick=()=>exportCard(false);$('save').onclick=()=>exportCard(true);load();
</script></body></html>
