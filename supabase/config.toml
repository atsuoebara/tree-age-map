# Garmin calls the callback without a Supabase JWT. The handler validates the
# encrypted HttpOnly OAuth session and state; start/disconnect verify user JWTs.
[functions.garmin-oauth]
verify_jwt = false

# Secret-path webhook; /drain verifies a dedicated Vault token inside the handler.
[functions.garmin-activity-push]
verify_jwt = false

# Candidate only: anonymous fixed control signal, not deployed. No user token or FIT.
[functions.rings-now-control]
verify_jwt = false

# Candidate only; handler verifies user with Auth, never accepts anonymous permission.
[functions.rings-now-owner-trial]
verify_jwt = false
