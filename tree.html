<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Rings Tree | Runner's Rings</title><link rel="icon" href="./icon.PNG"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0c1722;color:#f5f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:20px 15px 60px}a{color:#91e9cc}.head{color:#83e4ac;font-size:12px;letter-spacing:.14em;font-weight:900;margin-top:30px}h1{font-size:32px;margin:10px 0}.intro{line-height:1.7;color:#b5c8d3}.treePanel{border-radius:22px;background:linear-gradient(170deg,#143b3b,#132638 75%);border:1px solid #438a73;padding:16px 10px;text-align:center}.treeSvg{width:min(100%,420px);display:block;margin:auto;max-height:490px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:14px}.stat{border-radius:12px;background:#17353e;padding:12px 5px}.stat b{display:block;color:#8df3ae;font-size:20px}.stat small{font-size:11px;color:#c3d7d7}.annual{margin:15px 0;padding:15px;border:1px solid #315d63;background:#132638;border-radius:14px}.annual h2{font-size:17px;margin:0 0 10px}.yearRow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #284851;font-size:13px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}button{border:0;border-radius:12px;background:#83e4ac;color:#0c2725;padding:13px 16px;font:inherit;font-weight:900;cursor:pointer}button.secondary{background:#193b48;border:1px solid #83e4ac;color:#e8f5ed}button:disabled{opacity:.5}#status{color:#b4c8d1;margin:14px 0;line-height:1.6}.note{font-size:12px;color:#b1c4c9;line-height:1.7}</style></head>
<body><main><a href="./index.html">← Runner's Rings</a><div class="head">🌳 MY RINGS TREE</div><h1>一生に一本、あなただけの木。</h1><p class="intro">走るたびに枝と葉が育ち、走った年が年輪になる。休んでも枯れず、過去のランも一緒に成長します。</p>
<div class="treePanel"><svg id="treeSvg" class="treeSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 490" role="img" aria-label="走行記録で育つ一本の木"><rect width="420" height="490" fill="#143a39" rx="18"/><circle cx="210" cy="210" r="157" fill="#225044" opacity=".38"/><path d="M42 435 Q210 418 378 435" fill="none" stroke="#98c99b" stroke-width="3"/><g id="branches"></g><g id="leaves"></g><path id="trunk" d="M203 430 Q197 345 207 275 L213 275 Q225 340 217 430 Z" fill="#8a5a3b" stroke="#b5885d" stroke-width="2"/><g id="rings"></g></svg>
<div id="treeStage" style="font-weight:900;font-size:17px;color:#f9e49c;margin:7px 0 9px">🌱 はじまりの木</div><div class="stats"><div class="stat"><b id="km">—</b><small>累計 km</small></div><div class="stat"><b id="days">—</b><small>走った日数</small></div><div class="stat"><b id="years">—</b><small>走った年</small></div></div></div>
<div class="annual"><h2>🪵 年輪の記録</h2><div id="yearList">読み込み中…</div></div>
<div class="buttons"><button id="share" disabled>📷 Instagramへ共有</button><button id="save" class="secondary" disabled>画像を保存</button></div><p id="status" role="status">ランニングデータを読み込み中…</p><p class="note">木の成長は累計距離・走行日数・記録年をもとに表現します。順位や速さで優劣をつけず、ランのない期間も木は減りません。共有画像には名前・GPS座標・ルートを載せません。</p></main>
<script>
const sb=window.supabase.createClient('https://fhwvntpzwyenendhcgbw.supabase.co','sb_publishable_8ZhwV5lVHGbud8v6AS3YBQ_C78JbXyM',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
let summary=null;
function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const [key,val] of Object.entries(attrs))n.setAttribute(key,String(val));parent.append(n);return n;}
function grow(summary){
 const branches=$('branches'),leaves=$('leaves'),rings=$('rings');
 branches.replaceChildren();leaves.replaceChildren();rings.replaceChildren();
 const svg=$('treeSvg'),trunk=$('trunk');
 if(!summary.days){trunk.setAttribute('opacity','0.25');return;}
 trunk.setAttribute('opacity','1');
 // Slow lifelong progression, balanced across distance, running days and years.
 const kmGrowth=Math.log1p(summary.km)/Math.log(1+40000);
 const dayGrowth=Math.log1p(summary.days)/Math.log(1+7500);
 const yearGrowth=Math.log1p(summary.years.length)/Math.log(1+50);
 const growth=Math.min(.98,Math.max(.06,kmGrowth*.42+dayGrowth*.38+yearGrowth*.20));
 const spread=44+growth*122, height=82+growth*116;
 let seed=(3907+summary.days*31+Math.floor(summary.km)*7+summary.years.length*127)>>>0;
 const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 // Ground, roots and subtle game-style sparkles are inside the SVG and share export.
 el('ellipse',{cx:210,cy:440,rx:142,ry:15,fill:'#082c2b',opacity:.5},branches);
 for(let i=0;i<5;i++){
  const side=i%2===0?-1:1, y=326-i*24;
  const tx=210+side*(spread*(.48+.15*i)),ty=y-38-i*4;
  el('path',{d:`M 210 ${y+16} Q ${210+side*spread*.35} ${y-16} ${tx} ${ty}`,stroke:'#9b6748','stroke-width':12-i*1.45,fill:'none','stroke-linecap':'round'},branches);
 }
 // Three overlapping, continuous scalloped foliage masses, not scattered circles.
 function canopy(cx,cy,rx,ry,color,light){
  const n=13,pts=[];
  for(let i=0;i<n;i++){
   const a=-Math.PI/2+i*Math.PI*2/n;
   const wave=1+.035*Math.sin(i*2.4+growth*4);
   pts.push([cx+Math.cos(a)*rx*wave,cy+Math.sin(a)*ry*wave]);
  }
  let d=`M ${(pts[n-1][0]+pts[0][0])/2} ${(pts[n-1][1]+pts[0][1])/2}`;
  for(let i=0;i<n;i++){
   const p=pts[i],next=pts[(i+1)%n];
   d+=` Q ${p[0]} ${p[1]} ${(p[0]+next[0])/2} ${(p[1]+next[1])/2}`;
  }
  d+=' Z';
  el('path',{d,fill:color,stroke:'#286d4e','stroke-width':4,'stroke-linejoin':'round'},leaves);
  el('path',{d:`M ${cx-rx*.56} ${cy-ry*.34} Q ${cx-rx*.12} ${cy-ry*.77} ${cx+rx*.42} ${cy-ry*.39}`,fill:'none',stroke:light,'stroke-width':9,'stroke-linecap':'round',opacity:.62},leaves);
 }
 canopy(210-spread*.40,258-height*.32,spread*.64,height*.63,'#3d9964','#99e4a0');
 canopy(210+spread*.40,258-height*.32,spread*.64,height*.63,'#328a5c','#7cd69b');
 canopy(210,247-height*.70,spread*.81,height*.78,'#55b577','#b5f0a3');
 // Broad game-art trunk with single curved bark accents, avoiding ladder rungs.
 const w=10+growth*22;
 trunk.setAttribute('d',`M ${210-w} 431 Q ${201-w*.8} 355 203 274 Q 205 255 210 238 Q 220 272 218 305 Q ${219+w*.75} 376 ${210+w} 431 Z`);
 trunk.setAttribute('fill','#a66e48');trunk.setAttribute('stroke','#e0aa70');trunk.setAttribute('stroke-width','3.4');
 el('path',{d:'M 202 402 Q 206 367 205 335',fill:'none',stroke:'#e9b982','stroke-width':4,opacity:.7,'stroke-linecap':'round'},rings);
 el('path',{d:'M 218 392 Q 213 378 217 355',fill:'none',stroke:'#704a37','stroke-width':4,opacity:.65,'stroke-linecap':'round'},rings);
 // Each completed calendar year gets a tiny concentric annual marker.
 const n=Math.min(summary.years.length,20);
 for(let i=0;i<n;i++)el('ellipse',{cx:210,cy:420,rx:2.8+i*1.04,ry:1.5+i*.45,fill:'none',stroke:i%2?'#e8bf84':'#76503b','stroke-width':1.2,opacity:.76},rings);
 // Seasonal rewards: restrained five-petal blossoms within the crown.
 const flowers=Math.min(18,Math.floor(summary.years.length*.65+growth*8));
 for(let i=0;i<flowers;i++){
  const ang=rnd()*Math.PI*2,rad=Math.sqrt(rnd())*.79;
  const x=210+Math.cos(ang)*spread*rad,y=248-height*.56+Math.sin(ang)*height*.59*rad;
  const hue=['#ffd978','#ffc6da','#fff0a7'][i%3];
  for(let p=0;p<5;p++){const a=p*Math.PI*2/5;el('circle',{cx:x+Math.cos(a)*5,cy:y+Math.sin(a)*5,r:4.2,fill:hue},leaves)}
  el('circle',{cx:x,cy:y,r:3.3,fill:'#e68e56'},leaves);
 }
 for(let i=0;i<4;i++){
  const x=50+rnd()*320,y=70+rnd()*200;
  el('path',{d:`M ${x} ${y-6} V ${y+6} M ${x-6} ${y} H ${x+6}`,stroke:'#ffeab8','stroke-width':2,'stroke-linecap':'round',opacity:.75},leaves);
 }
 const stage=summary.days<5?'芽吹きの木':summary.days<30?'小さな若木':summary.days<180?'育ちざかりの木':summary.days<500?'森を目指す木':'旅する大樹';
 const label=$('treeStage');if(label)label.textContent='✨ '+stage;
}
async function load(){
 try{const {data:{user},error:e}=await sb.auth.getUser();if(e||!user){$('status').textContent='ランリングからログインして開いてください。';$('yearList').textContent='ログインが必要です';return;}
 let rows=[],from=0;for(;;){const {data,error}=await sb.from('runs').select('id,activity_date,distance_km').eq('user_id',user.id).is('deleted_at',null).order('id',{ascending:true}).range(from,from+499);if(error)throw error;rows.push(...(data||[]));if(!data||data.length<500)break;from+=500;if(from>=30000)throw Error('Too many records');}
 const byYear=new Map(),dates=new Set();let km=0;
 for(const r of rows){const dist=Math.max(0,Number(r.distance_km||0));km+=dist;const d=String(r.activity_date||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(d)){dates.add(d);const y=d.slice(0,4),v=byYear.get(y)||{km:0,runs:0};v.km+=dist;v.runs++;byYear.set(y,v);}}
 summary={km,days:dates.size,years:[...byYear.keys()].sort(),runs:rows.length};$('km').textContent=km.toFixed(1);$('days').textContent=dates.size;$('years').textContent=summary.years.length;grow(summary);
 const list=$('yearList');list.replaceChildren();for(const y of [...summary.years].reverse()){const v=byYear.get(y),r=document.createElement('div');r.className='yearRow';r.textContent=y+'年　'+v.runs+'本';const span=document.createElement('strong');span.textContent=v.km.toFixed(1)+' km';r.append(span);list.append(r);}
 if(!summary.years.length)list.textContent='最初のランを取り込むと、木が芽生えます。';
 $('share').disabled=$('save').disabled=!summary.runs;$('status').textContent=summary.runs?'あなたの木が育っています。共有画像も作成できます。':'まだランニング記録がありません。';
 }catch(e){console.error(e);$('status').textContent='記録を取得できませんでした。再読み込みしてください。';$('yearList').textContent='集計できませんでした。';}
}
function makeCard(){
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const c=canvas.getContext('2d'),gradient=c.createLinearGradient(0,0,1080,1920);gradient.addColorStop(0,'#113b37');gradient.addColorStop(1,'#10192c');c.fillStyle=gradient;c.fillRect(0,0,1080,1920);
 const draw=(str,x,y,size,color)=>{c.fillStyle=color;c.font='bold '+size+'px sans-serif';c.fillText(str,x,y,950)};
 draw('MY RINGS TREE',70,165,62,'#8cf3b4');draw('一生に一本、あなただけの木。',70,260,43,'#fff');
 const svg=$('treeSvg').cloneNode(true);svg.setAttribute('xmlns',NS);const serialized=new XMLSerializer().serializeToString(svg),uri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(serialized);
 return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{c.drawImage(img,85,345,910,1062);draw(summary.km.toFixed(1)+' km',70,1530,70,'#fff');draw(summary.days+' days    '+summary.years.length+' years',70,1620,47,'#8cf3b4');draw("Runner's Rings",70,1802,45,'#fff');draw('runnersrings.com/tree.html',70,1868,31,'#acdec6');canvas.toBlob(b=>b?resolve(b):reject(Error('PNG failed')),'image/png')};img.onerror=()=>reject(Error('Tree rendering failed'));img.src=uri;});
}
async function exportTree(saveOnly){$('share').disabled=$('save').disabled=true;$('status').textContent='画像を作成中…';try{const blob=await makeCard(),file=new File([blob],'my-rings-tree.png',{type:'image/png'});if(typeof gtag==='function')gtag('event','rings_tree_image_generated');
 if(!saveOnly&&navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'My Rings Tree'});$('status').textContent='共有メニューからInstagramを選んでください。';return}catch(e){if(e.name==='AbortError'){$('status').textContent='';return;}}}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);$('status').textContent='画像を保存しました。Instagramで選んで投稿できます。';
 }catch(e){console.error(e);$('status').textContent='画像の生成に失敗しました。もう一度お試しください。';}finally{$('share').disabled=$('save').disabled=!summary?.runs;}}
$('share').onclick=()=>exportTree(false);$('save').onclick=()=>exportTree(true);load();
</script></body></html>
