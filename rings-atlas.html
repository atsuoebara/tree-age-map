<script>
/* Size the single same-origin app to its content so iPhone has one page scroll.
 * No cross-frame messaging, data transfer, extra auth client or navigation.
 * If access/ResizeObserver fails, the iframe keeps its native fallback scroll.
 */
(function () {
  'use strict';
  const frame = document.getElementById('rrAtlasAppFrame');
  if (!frame) return;
  frame.addEventListener('load', () => {
    let child;
    try {
      child = frame.contentDocument;
      if (!child || !child.body) return;
    } catch (_) {
      return;
    }
    let queued = false;
    function resize() {
      queued = false;
      if (!frame.isConnected || !child.body) return;
      const height = Math.max(500, Math.ceil(child.body.scrollHeight));
      if (!Number.isFinite(height) || height > 40000) return;
      if (Math.abs(frame.getBoundingClientRect().height - height) >= 2) {
        frame.style.height = height + 'px';
      }
      frame.scrolling = 'no';
    }
    function schedule() {
      if (!queued) {
        queued = true;
        requestAnimationFrame(resize);
      }
    }
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(schedule).observe(child.body);
    }
    new MutationObserver(schedule).observe(child.body, {
      childList:true, subtree:true, attributes:true,
      attributeFilter:['hidden','open','style','class']
    });
    schedule();
  });
})();
</script>
