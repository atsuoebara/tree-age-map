<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Rings Atlas | Runner's Rings</title>
<meta name="description" content="Runner's RingsのRings Atlas。自分の走行履歴を国・地域別の年輪として振り返る。">
<style>
  :root { color-scheme:dark; font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#0b1422; color:#fff; }
  .atlasShell { min-height:100dvh; display:flex; flex-direction:column; }
  .atlasHeader { display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px;padding:10px max(12px,env(safe-area-inset-right));border-bottom:1px solid #3b5268;background:#0f1d2f; }
  .atlasTitle { min-width:0; }
  .atlasTitle strong { display:block; font-size:19px; }
  .atlasTitle small { display:block; font-size:11px;color:#b5d4e9; }
  .atlasBack { display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 11px;border:1px solid #74d5ff;border-radius:10px;color:#dcf7ff;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap; }
  .atlasFrame { width:100%;height:calc(100dvh - 66px);flex:1 1 auto;min-height:500px;border:0;background:#0b1422; }
  @media(max-width:375px) {
    .atlasHeader {gap:8px;padding:9px 10px;}
    .atlasTitle strong {font-size:17px;}
    .atlasTitle small {font-size:10px;}
    .atlasBack {font-size:12px;padding:7px 9px;}
  }
</style>
</head>
<body>
<div class="atlasShell">
  <header class="atlasHeader">
    <div class="atlasTitle">
      <strong>🌍 Rings Atlas</strong>
      <small>国・地域別に、走った年輪をたどる</small>
    </div>
    <a class="atlasBack" href="./index.html" target="_top" rel="noopener">← トップに戻る</a>
  </header>
  <!-- One same-origin canonical app instance. No duplicated data client or user records. -->
  <iframe class="atlasFrame" title="Rings Atlas：本人専用の地域別記録" src="./index.html?atlas=embedded" loading="eager" referrerpolicy="same-origin"></iframe>
</div>
</body>
</html>
