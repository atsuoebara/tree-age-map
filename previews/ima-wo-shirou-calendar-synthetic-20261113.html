<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>今を知ろう — 隔離UIプレビュー（架空データ）</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#102a24;color:#e8f6ed}
*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:480px;margin:auto}
h1{font-size:1.55rem;margin:6px 0 12px}p{line-height:1.55}small{color:#b6cfc3}
.notice{border:1px dashed #cbd59d;border-radius:10px;padding:10px;margin:14px 0;color:#f4edc3}
.entry{display:flex;width:100%;gap:12px;align-items:center;justify-content:space-between;text-align:left;border:1px solid #619a80;border-radius:12px;background:#1d4236;color:inherit;padding:14px;margin:8px 0;min-height:52px;cursor:pointer}
.entry[aria-pressed=true]{outline:3px solid #cfffa0}.entry small{white-space:nowrap}
#selection{border:1px solid #537b6a;border-radius:12px;padding:15px;margin-top:14px;min-height:140px}
#selectAsGachi{min-height:44px;margin:10px 0;padding:10px 18px;border:0;border-radius:10px;background:#bce6ab;color:#163124;font-weight:bold;font-size:1rem}
#selectAsGachi:disabled{opacity:.5}.muted{color:#b6cfc3}
</style></head><body><main>
<small>開発中／架空データのみ／本番と未接続</small>
<h1>今を知ろう</h1>
<p>カレンダーで選んだ1本を振り返る準備画面。ガチランにするかは本人が決めます。</p>
<div class="notice">これは隔離プレビューです。実際の記録・FIT・GPS・心拍データは読み込まず、診断も行いません。</div>
<h2>11月13日の記録（架空）</h2>
<div id="records"></div>
<section id="selection" aria-live="polite"><p>ランを1本選択してください。</p></section>
<small>信号待ちやトイレ休憩、自動ポーズなどの影響により、正しく分析できない場合があります。</small>
</main>
<script type="module">
import {reviewSelectedCalendarRun} from '../src/ima-wo-shirou-calendar-selection-review.mjs';
// Fixed synthetic clock/launch boundary: NOT a production rollout policy.
const t=Date.parse('2026-11-13T12:00:00Z');
const featureStartedAtMs=t-20*86400000;
const rows=[
 {id:11,user_id:'DEMO',activity_date:'2026-11-13',started_at:'2026-11-13T02:00:00Z',distance_km:10.2,name:'朝のラン（架空）'},
 {id:12,user_id:'DEMO',activity_date:'2026-11-13',started_at:'2026-11-13T09:00:00Z',distance_km:5.1,name:'夕方のラン（架空）'},
 {id:13,user_id:'DEMO',activity_date:'2026-11-13',started_at:'2026-11-04T09:00:00Z',distance_km:8,name:'期限切れ例（架空）'}
];
const records=document.getElementById('records'),selection=document.getElementById('selection');
let active=null;
function render(){
 records.replaceChildren();
 for(const row of rows){
  const button=document.createElement('button');button.type='button';button.className='entry';
  button.setAttribute('aria-pressed',String(active?.id===row.id));
  const name=document.createElement('span');name.textContent=row.name;
  const km=document.createElement('small');km.textContent=row.distance_km.toFixed(2)+' km';
  button.append(name,km);button.addEventListener('click',()=>{active=row;render()});
  records.append(button);
 }
 selection.replaceChildren();
 if(!active){const p=document.createElement('p');p.textContent='ランを1本選択してください。';selection.append(p);return}
 const title=document.createElement('strong');title.textContent=active.name;selection.append(title);
 const explanation=document.createElement('p');explanation.textContent='このランをガチランとして本人が選択します。自動判定はしません。';selection.append(explanation);
 const button=document.createElement('button');button.type='button';button.id='selectAsGachi';button.textContent='このランで今を知ろう';
 selection.append(button);
 const status=document.createElement('p');status.className='muted';status.setAttribute('role','status');selection.append(status);
 button.addEventListener('click',()=>{
  const verdict=reviewSelectedCalendarRun({row:active,currentUserId:'DEMO',selectedAsGachiRun:true,nowMs:t,featureStartedAtMs});
  status.textContent=verdict.eligible
   ? '8日間の対象期間内です。ただし解析は未認定のため実行できません（隔離プレビュー）。'
   : '診断できません（理由: '+verdict.reason+'）。期限切れや不正な時刻を推測で補正しません。';
 });
}
render();
</script></body></html>
