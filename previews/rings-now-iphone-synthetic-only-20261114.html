<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>Rings Now | iPhone合成FIT検証（未公開）</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101926;color:#f4f8ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:480px;margin:auto;padding:18px 16px 50px}h1{font-size:1.6rem}p,li{line-height:1.7}.card{background:#1b2e43;padding:16px;margin:16px 0;border-radius:13px;border:1px solid #536b84}button,input{font:inherit}button{min-height:48px;color:#fff;background:#28516d;border:1px solid #b7cfdb;border-radius:9px;padding:10px 14px}button:disabled{opacity:.5}input[type=file]{display:block;width:100%;padding:15px 0}label{display:block}strong{color:#e6f5a5}.caution{border-left:4px solid #ffc97a;padding:9px 12px;background:#403324}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #607184;text-align:left}td:last-child{text-align:right}</style></head>
<body><main class="wrap">
<p>RUNNER’S RINGS · 隔離テスト専用</p>
<h1>Rings Now <small>NOW × KNOW</small></h1>
<p class="caution">これはiPhoneのファイル選択を試す合成データ専用ページです。実際のランニングFITは使用できません。まだ公開・本番利用の承認はありません。</p>
<section class="card"><h2>① 架空のFITを保存する</h2><button type="button" id="download">合成5km FITをダウンロード</button><p>架空の5km・27分のデータのみ。GPS・心拍・個人情報なし。</p></section>
<section class="card"><h2>② iPhoneの「ファイル」から選ぶ</h2><label for="fit">さきほど保存した <strong>rings-now-synthetic-5km.fit</strong> だけを選択してください。</label><input id="fit" type="file" accept=".fit,application/octet-stream"><button type="button" id="review">端末内で合成FITを確認</button><p id="status" role="status" aria-live="polite">未選択</p><div id="laps"></div></section>
<section class="card"><h2>検証上の注意</h2><p>信号待ちやトイレ休憩、自動ポーズなどの影響により、正しく分析できない場合があります。</p><p>読み込みは端末内のみ。外部送信・保存・本番カレンダーとの連携はしません。表示は未認証の参考候補です。</p></section>
</main><script type="module">
import {reviewSingleUserFitBuffer} from '../src/race-fit-local-file-review.mjs';
// Exact bytes of the public-safe synthetic FIT generated by make-synthetic-race-fit-portable.py.
// Never ship athlete data, private FIT, GPS data, heart rate or credentials here.
const SYNTHETIC_B64='DiBcCBYBAAAuRklUqd1AAAASAAT9BIYCBIYJBIYFAQAAVJtuOACVbjggoQcAAUEAABQAAv0EhgUEhgEAlW44AAAAAAE/lW44IE4AAAF+lW44QJwAAAG9lW44YOoAAAH8lW44gDgBAAE7lm44oIYBAAF7lm44wNQBAAG6lm444CICAAH6lm44AHECAAE5l244IL8CAAF5l244QA0DAAG5l244YFsDAAH5l244gKkDAAE5mG44oPcDAAF5mG44wEUEAAG5mG444JMEAAH6mG44AOIEAAE7mW44IDAFAAF7mW44QH4FAAG8mW44YMwFAAH9mW44gBoGAAFCmm44oGgGAAGGmm44wLYGAAHLmm444AQHAAEPm244AFMHAAFUm244IKEHAHQp';
const EXPECTED_SHA256='24c29cacc088ee2cb2a43f82402d88dfd222a389da98f7b37704e87ba64163aa';
const $=id=>document.getElementById(id);
const bytes=()=>Uint8Array.from(atob(SYNTHETIC_B64),c=>c.charCodeAt(0));
const hex=buffer=>Array.from(new Uint8Array(buffer),v=>v.toString(16).padStart(2,'0')).join('');
const format=s=>{const n=Math.round(s);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
let choice=0,reading=false;
$('download').addEventListener('click',()=>{
 const blob=new Blob([bytes()],{type:'application/octet-stream'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='rings-now-synthetic-5km.fit';
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
});
$('fit').addEventListener('change',()=>{choice++;$('laps').replaceChildren();$('status').textContent='選択済み（まだ読み取っていません）';});
$('review').addEventListener('click',async()=>{
 if(reading)return;
 const file=$('fit').files?.[0];$('laps').replaceChildren();
 if(!file){$('status').textContent='合成FITファイルを選んでください';return;}
 if(file.name!=='rings-now-synthetic-5km.fit'||file.size!==294){$('status').textContent='合成FIT以外は読み取りできません';return;}
 const version=choice;reading=true;$('review').disabled=true;
 $('status').textContent='合成FITかどうか端末内で確認中…';
 try{
  const buffer=await file.arrayBuffer();
  if(version!==choice||$('fit').files?.[0]!==file)return;
  // Content identity verification before calling the FIT decoder:
  // unlike real-file previews, unrecognized private FITs must NEVER be decoded.
  const digest=hex(await crypto.subtle.digest('SHA-256',buffer));
  if(version!==choice||$('fit').files?.[0]!==file)return;
  if(digest!==EXPECTED_SHA256){$('status').textContent='合成FITと一致しません。解析しません';return;}
  const result=reviewSingleUserFitBuffer(buffer,{confirmedOwner:true,confirmedRace:true});
  if(result.status!=='candidate_unverified'||result.analysisAllowed!==false||result.writeAllowed!==false){
   $('status').textContent='未認証の合成データを読み取れませんでした';return;
  }
  $('status').textContent='合成FIT読込成功（未認証）：5km・27分を想定';
  const table=document.createElement('table'),head=document.createElement('tr');
  for(const label of ['区間','時計経過時間']){const th=document.createElement('th');th.textContent=label;head.append(th);}
  table.append(head);
  for(const segment of result.segments){const row=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td');a.textContent=segment.index+' km';b.textContent=format(segment.clockElapsedS);row.append(a,b);table.append(row);}
  $('laps').append(table);
 }catch{$('status').textContent='読み込めませんでした。ファイル形式とSafariを確認してください';}
 finally{if(version===choice){reading=false;$('review').disabled=false;}}
});
</script></body></html>
