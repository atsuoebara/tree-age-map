<body>
  <header><div class="inner"><strong>Runner's Rings Journal</strong><nav><button type="button" id="ja" class="active">日本語</button> <button type="button" id="en">EN</button></nav></div></header>
  <main>
    <article data-lang="ja" >
      <div class="category">development</div>
      <time datetime="2026-09-26">2026-09-26</time>
      <h1>Journal 自動公開テスト</h1>
      
      
      <div class="body">スマホからの記事投稿テストです。</div>
      <div class="share">
        <button type="button" class="copy">リンクをコピー</button>
        <button type="button" class="native-share" hidden>共有</button>
        <a href="https://twitter.com/intent/tweet?text=Journal%20%E8%87%AA%E5%8B%95%E5%85%AC%E9%96%8B%E3%83%86%E3%82%B9%E3%83%88&amp;url=https%3A%2F%2Frunnersrings.com%2Fjournal%2Farticles%2Fjournal-20260926-155545-c3daccaa%2F" target="_blank" rel="noopener noreferrer">Xで共有</a>
      </div><p class="feedback" aria-live="polite"></p>
      <a class="back" href="/journal.html">Journal一覧へ戻る</a>
    </article>
    <article data-lang="en" hidden>
      <div class="category">development</div>
      <time datetime="2026-09-26">2026-09-26</time>
      <h1>Journal Publishing Test</h1>
      
      
      <div class="body">Testing article publishing from a smartphone.</div>
      <div class="share">
        <button type="button" class="copy">Copy link</button>
        <button type="button" class="native-share" hidden>Share</button>
        <a href="https://twitter.com/intent/tweet?text=Journal%20Publishing%20Test&amp;url=https%3A%2F%2Frunnersrings.com%2Fjournal%2Farticles%2Fjournal-20260926-155545-c3daccaa%2F" target="_blank" rel="noopener noreferrer">Share to X</a>
      </div><p class="feedback" aria-live="polite"></p>
      <a class="back" href="/journal.html">Back to Journal</a>
    </article></main>
  <footer>© 2026 Runner's Rings</footer>
  <script>
  (()=>{
    'use strict';
    const permalink="https://runnersrings.com/journal/articles/journal-20260926-155545-c3daccaa/";
    const labels={ja:'URLをコピーしました',en:'Link copied'};
    let lang=localStorage.getItem('runners-rings-language')==='en'?'en':'ja';
    const show=()=>{
      document.documentElement.lang=lang;
      document.querySelectorAll('article[data-lang]').forEach(a=>a.hidden=a.dataset.lang!==lang);
      ['ja','en'].forEach(s=>document.getElementById(s).classList.toggle('active',s===lang));
    };
    ['ja','en'].forEach(s=>document.getElementById(s).addEventListener('click',()=>{lang=s;localStorage.setItem('runners-rings-language',s);show();}));
    document.querySelectorAll('article').forEach(a=>{
      const feedback=a.querySelector('.feedback');
      a.querySelector('.copy').addEventListener('click',async()=>{
        try{if(!navigator.clipboard)throw new Error('No clipboard');await navigator.clipboard.writeText(permalink);feedback.textContent=labels[a.dataset.lang];}
        catch{window.prompt('Copy article URL',permalink);}
      });
      if(navigator.share){const btn=a.querySelector('.native-share');btn.hidden=false;btn.addEventListener('click',async()=>{try{await navigator.share({title:a.querySelector('h1').textContent,url:permalink});}catch(e){if(e.name!=='AbortError')feedback.textContent='Share failed';}});}
    });
    show();
  })();
  </script>
